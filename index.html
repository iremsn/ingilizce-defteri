<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>İngilizce Defteri</title>
<meta name="description" content="Seviye testi, günlük 15 dakikalık plan, kelime kartları ve pratik.">
<meta name="theme-color" content="#F5F2FA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
:root{
  --bg:#F5F2FA; --surface:#FFFFFF; --raised:#FFFFFF; --ink:#1E1A24; --ink-2:#6C6577; --ink-3:#8F889A;
  --line:#ECE6F4; --line-2:#D9D0E6; --accent:#8944D9; --accent-ink:#FFFFFF; --accent-soft:#F1E8FC;
  --fill:rgba(124,92,168,.12); --fill-2:rgba(124,92,168,.07); --glass:rgba(250,247,253,.82);
  --ok:#248A3D; --ok-soft:#E5F4E9; --warn:#B35A00; --warn-soft:#FDF0E1;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.06);
  --r-card:16px; --r-ctl:10px;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-d:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI Variable Display","Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C0A10; --surface:#1C1922; --raised:#2A2632; --ink:#F6F3FA; --ink-2:#B3ABBF; --ink-3:#8F889A;
  --line:#37323F; --line-2:#474151; --accent:#9B51E0; --accent-soft:#2C1F42;
  --fill:rgba(150,120,190,.22); --fill-2:rgba(150,120,190,.13); --glass:rgba(28,25,34,.82);
  --ok:#30D158; --ok-soft:#163220; --warn:#FF9F0A; --warn-soft:#3A2A10;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0A10; --surface:#1C1922; --raised:#2A2632; --ink:#F6F3FA; --ink-2:#B3ABBF; --ink-3:#8F889A;
  --line:#37323F; --line-2:#474151; --accent:#9B51E0; --accent-soft:#2C1F42;
  --fill:rgba(150,120,190,.22); --fill-2:rgba(150,120,190,.13); --glass:rgba(28,25,34,.82);
  --ok:#30D158; --ok-soft:#163220; --warn:#FF9F0A; --warn-soft:#3A2A10;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
.app{max-width:720px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom,0px))}
h1{font:700 32px/1.15 var(--f-d);letter-spacing:-.01em;margin:8px 0 4px}
h2{font:700 21px/1.25 var(--f-d);margin:28px 0 10px}
h3{font:600 17px/1.3 var(--f-d);margin:0 0 6px}
.sub{color:var(--ink-2);margin:0 0 18px}
.muted{color:var(--ink-2)} .small{font-size:13.5px} .tiny{font-size:12px;color:var(--ink-3)}
.card{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);padding:16px 18px;margin:0 0 12px}
.card.soft{background:var(--accent-soft);box-shadow:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stack>*+*{margin-top:10px}
.btn{border:0;border-radius:var(--r-ctl);padding:10px 16px;background:var(--fill);color:var(--accent);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;line-height:1.2;min-height:40px;white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;padding-left:8px;padding-right:8px}
.btn.block{width:100%;justify-content:center;min-height:48px;font-size:17px}
.btn:disabled{opacity:.45;cursor:default}
.chip{border:0;border-radius:999px;padding:6px 12px;background:var(--fill-2);color:var(--ink-2);font-size:13.5px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);color:#fff}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:600;background:var(--fill-2);color:var(--ink-2)}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.seg{display:flex;background:var(--fill-2);border-radius:10px;padding:3px;margin:0 0 16px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 6px;font-weight:600;color:var(--ink-2);cursor:pointer;font-size:14.5px}
.seg button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
textarea,input.f{width:100%;border:0;background:var(--fill-2);border-radius:var(--r-ctl);padding:11px 13px;font-size:16px;resize:vertical}
textarea:focus,input.f:focus{outline:0;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent);background:var(--surface)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);padding:6px 8px max(8px,env(safe-area-inset-bottom))}
.tabbar nav{max-width:560px;margin:0 auto;display:flex}
.tabbar a{flex:1;text-decoration:none;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;padding:4px 0}
.tabbar a svg{width:24px;height:24px}
.tabbar a[aria-current=page]{color:var(--accent)}
/* levels */
.lvl{display:grid;grid-template-columns:84px 1fr 54px;gap:10px;align-items:center;padding:7px 0}
.lvl+.lvl{border-top:1px solid var(--line)}
.lvl .bars{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.lvl .bars i{height:10px;border-radius:5px;background:var(--fill)}
.lvl .bars i.on{background:var(--accent)}
.lvl .bars i.work{background:repeating-linear-gradient(45deg,var(--accent) 0 3px,transparent 3px 6px);opacity:.55}
.lvl b{font:600 15px var(--f-d);text-align:right}
/* test */
.progress{height:6px;background:var(--fill);border-radius:3px;overflow:hidden;margin:6px 0 18px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.opt{border:0;text-align:left;background:var(--surface);box-shadow:var(--shadow);border-radius:12px;padding:13px 16px;cursor:pointer;font-size:16px}
.opt:hover{box-shadow:0 0 0 2px var(--accent)}
.opt.idk{background:transparent;box-shadow:none;color:var(--ink-2);text-align:center}
.qword{font:700 30px/1.2 var(--f-d);margin:6px 0}
.passage{background:var(--surface);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);font-size:15.5px;line-height:1.6;margin-bottom:10px}
.check{display:flex;gap:12px;align-items:flex-start;padding:11px 0;cursor:pointer}
.check+.check{border-top:1px solid var(--line)}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin-top:1px}
/* today */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week div{font-size:11px;color:var(--ink-3);font-weight:600}
.week span{display:block;margin:4px auto 0;width:30px;height:30px;border-radius:50%;background:var(--fill-2);line-height:30px;font-size:13px;color:var(--ink-2)}
.week span.done{background:var(--accent);color:#fff}
.week span.today{box-shadow:0 0 0 2px var(--accent)}
.task{display:flex;gap:14px;align-items:flex-start}
.task .tick{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line-2);background:transparent;cursor:pointer;display:grid;place-items:center;color:#fff;margin-top:2px}
.task .tick.on{background:var(--accent);border-color:var(--accent)}
.task .body{flex:1;min-width:0}
.task ol{margin:8px 0 10px;padding-left:20px}
.task ol li{margin:3px 0}
/* cards */
.flash{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:34px 20px;text-align:center;min-height:240px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.flash .w{font:700 34px/1.15 var(--f-d)}
.flash .ex{color:var(--ink-2);font-style:italic}
.flash .tr{font:600 22px var(--f-d);color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px}
.stat b{display:block;font:700 24px var(--f-d)}
.stat span{font-size:12.5px;color:var(--ink-2)}
/* practice */
.diff span{padding:1px 2px;border-radius:4px}
.diff .miss{background:var(--warn-soft);color:var(--warn);text-decoration:underline wavy}
.diff .hit{color:var(--ok)}
.rec{width:72px;height:72px;border-radius:50%;border:0;background:var(--accent);color:#fff;cursor:pointer;display:grid;place-items:center;margin:8px auto}
.rec.live{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 50%,transparent)}100%{box-shadow:0 0 0 18px transparent}}
.entry{border-top:1px solid var(--line);padding:10px 0}
.entry pre{white-space:pre-wrap;font:inherit;margin:6px 0 0;font-size:14.5px}
/* resources */
.res{display:flex;gap:12px;align-items:flex-start}
.res .ico{flex:none;width:38px;height:38px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center;font-size:19px}
.res p{margin:3px 0 0;font-size:14px;color:var(--ink-2)}
/* modal */
.ov{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.32);display:flex;align-items:flex-end;justify-content:center;padding:12px}
@media (min-width:700px){.ov{align-items:center}}
.modal{background:var(--surface);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:min(560px,100%);max-height:calc(100dvh - 24px);overflow:auto;padding:18px 20px}
.modal ol{padding-left:20px;margin:10px 0}
.modal ol li{margin:0 0 14px}
.modal textarea.q{font:12.5px/1.45 ui-monospace,"SF Mono",Menlo,Consolas,monospace;min-height:120px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:99;box-shadow:var(--shadow)}
.why{display:grid;gap:10px;margin:18px 0}
.why .card{display:flex;gap:14px;align-items:flex-start;margin:0}
.why .n{flex:none;font-size:24px}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
@media (max-width:420px){h1{font-size:28px}.lvl{grid-template-columns:72px 1fr 46px}}
</style>
</head>

  qs:[["Mert neden başta gitmek istemedi?",["Yorgundu","Yağmur yağıyordu","Müze kapalıydı","Selin gelmiyordu"],1],["En çok hangi parçayı sevdi?",["Metal bir masa","1950'lerden bir lamba","Üç bacaklı ahşap bir sandalye","Plastik bir koltuk"],2]]},
 {lv:2,text:"Many students think that a good designer must be good at drawing. Drawing helps, of course, but it is not the most important skill. Good designers spend a lot of time observing how people actually use things. They notice small problems — a handle that is hard to hold, a button that is easy to press by mistake — and they ask why. Sketching is simply a way of thinking about these problems quickly.",
  qs:[["Metne göre en önemli beceri hangisi?",["İyi çizim yapmak","İnsanların nesneleri nasıl kullandığını gözlemlemek","Hızlı çalışmak","Bilgisayar programlarını bilmek"],1],["Metne göre eskiz nedir?",["Sunum için güzel bir görsel","Problemler üzerine hızlıca düşünmenin bir yolu","Zaman kaybı","Sadece yeteneklilerin işi"],1]]},

  qs:[["Bambu diş fırçası örneği neyi gösteriyor?",["Bambunun her zaman en iyi malzeme olduğunu","Malzeme tek başına sürdürülebilirliği garanti etmez","Plastiğin yasaklanması gerektiğini","Yerel üretimin pahalı olduğunu"],1],["Tasarımcılardan ne yapmaları isteniyor?",["Sadece geri dönüştürülebilir malzeme kullanmaları","Ürünün tüm yaşam döngüsünü düşünmeleri","Daha ucuz ürünler yapmaları","Taşımacılığı tamamen bırakmaları"],1]]},

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today = () => ymd(new Date());
const addDays = (s,n) => { const d = new Date(s+"T12:00:00"); d.setDate(d.getDate()+n); return ymd(d); };
const dayNo = () => Math.floor(new Date(today()+"T12:00:00").getTime()/864e5);
function lvOf(sk){ return S.levels ? S.levels[sk] : -1; }          // -1..4  (highest level passed)
function workOf(sk){ return Math.min(4, lvOf(sk)+1); }               // level being worked on
function band(w){ return w<=1 ? "low" : w===2 ? "mid" : "high"; }
function lvName(lv){ return lv<0 ? "Başlangıç" : LV[lv]; }
function overall(){ if(!S.levels) return -1; const v = Object.values(S.levels); return Math.round(v.reduce((a,b)=>a+b,0)/v.length); }
function toast(m){ const t=document.createElement("div"); t.className="toast"; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
function copyText(t){
  if(navigator.clipboard && window.isSecureContext){ return navigator.clipboard.writeText(t).catch(()=>fallbackCopy(t)); }
  fallbackCopy(t); return Promise.resolve();
}
function fallbackCopy(t){ const a=document.createElement("textarea"); a.value=t; document.body.appendChild(a); a.select(); try{document.execCommand("copy");}catch(e){} a.remove(); }
let VOICE = null;
function pickVoice(){
  if(!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
  VOICE = vs.find(v=>/Google US|Samantha|Aria|Jenny/i.test(v.name)) || vs.find(v=>/en[-_]US/i.test(v.lang)) || vs[0] || null;
}
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, slow){
  if(!("speechSynthesis" in window)){ toast("Tarayıcın sesli okumayı desteklemiyor."); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang = VOICE ? VOICE.lang : "en-US"; if(VOICE) u.voice = VOICE;
  u.rate = slow ? 0.7 : (S.settings.rate || 0.9); speechSynthesis.speak(u);
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const norm = s => s.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]+/g," ").split(/\s+/).filter(Boolean);
function compare(target, said){
  const a = norm(target), b = norm(said);
  const L = Array.from({length:a.length+1},()=>new Array(b.length+1).fill(0));
  for(let i=a.length-1;i>=0;i--) for(let j=b.length-1;j>=0;j--) L[i][j] = a[i]===b[j] ? L[i+1][j+1]+1 : Math.max(L[i+1][j],L[i][j+1]);
  const hit = new Array(a.length).fill(false); let i=0,j=0;
  while(i<a.length && j<b.length){ if(a[i]===b[j]){hit[i]=true;i++;j++;} else if(L[i+1][j]>=L[i][j+1]) i++; else j++; }
  const words = target.split(/\s+/); let k=0;
  const html = words.map(w=>{ const n=norm(w); if(!n.length) return esc(w); const ok = hit[k]; k+=n.length; return `<span class="${ok?"hit":"miss"}">${esc(w)}</span>`; }).join(" ");
  return {pct: a.length ? Math.round(100*L[0][0]/a.length) : 0, html};
}

/* ================= CLAUDE BRIDGE ================= */
function bridge(title, prompt, opts){
  opts = opts || {};
  const ov = document.createElement("div"); ov.className = "ov";
  ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true">
    <div class="between"><h3 style="margin:0">${esc(title)}</h3><button class="btn ghost" data-x>Kapat</button></div>
    <ol>
      <li><b>Komutu kopyala, Claude'u aç</b> ve yeni sohbete yapıştır.
        <textarea class="q" readonly>${esc(prompt)}</textarea>
        <div class="row" style="margin-top:8px"><button class="btn primary" data-go>Kopyala ve Claude'u aç</button><button class="btn" data-copy>Sadece kopyala</button></div></li>
      ${opts.save ? `<li><b>İstersen cevabı buraya yapıştır</b>, yazının altına kaydedeyim.
        <textarea data-ans rows="5" placeholder="Claude'un cevabı (isteğe bağlı)"></textarea>
        <div class="row" style="margin-top:8px"><button class="btn" data-save>Kaydet</button></div></li>` : ""}
    </ol>
    <p class="tiny" style="margin:0">${esc(opts.tip || "Önce kendin dene, sonra Claude'a sor. Cevabı okurken 'neden?' diye sor; düzeltmeleri ezberleme, kuralı yakala.")}</p>
  </div>`;
  document.body.appendChild(ov);
  const close = ()=>ov.remove();
  ov.addEventListener("click", e=>{ if(e.target===ov || e.target.closest("[data-x]")) close(); });
  ov.querySelector("[data-copy]").onclick = ()=>copyText(prompt).then(()=>toast("Kopyalandı"));
  ov.querySelector("[data-go]").onclick = ()=>{ copyText(prompt).then(()=>toast("Kopyalandı, Claude'a yapıştır")); window.open("https://claude.ai/new","_blank","noopener"); };
  const sv = ov.querySelector("[data-save]");
  if(sv) sv.onclick = ()=>{ const v = ov.querySelector("[data-ans]").value.trim(); if(v){ opts.save(v); toast("Kaydedildi"); } close(); };
}

const MODES = [

const SCENES = ["Kafede sipariş vermek","Havalimanında check-in","Otele giriş yapıp bir sorunu bildirmek","Yol sormak ve toplu taşıma","Eczanede derdini anlatmak","Değişim programında yeni biriyle tanışmak","Bir tasarım stüdyosunda staj mülakatı","Jüriye proje sunumu ve sorular","Müşteriyle tasarım toplantısı","Bir mağazada ürünü iade etmek"];
function learningWords(n){
  return Object.entries(S.cards).filter(([id,c])=>c.box<4).map(([id])=>wordById(id)).filter(Boolean).slice(0,n).map(w=>w.en);
}
function tutorBase(){
  const sp = lvOf("speaking"), ov = overall();
  const spName = sp<0 ? "başlangıç (A1'e çalışıyorum)" : LV[sp];
  const ovName = ov<0 ? "başlangıç" : LV[ov];
  const target = LV[workOf("speaking")];
  return `Sen "LinguaClaude" adında sabırlı, sıcak ve motive edici bir İngilizce öğretmenisin. Öğrencin benim.

HAKKIMDA
- Türkçe konuşan bir endüstriyel tasarım öğrencisiyim.
- Seviyem: konuşmada ${spName}, genelde ${ovName}. Kelime ve cümle karmaşıklığını buna göre ayarla; ara sıra ${target} seviyesinden bir ifade kat ki gelişeyim.
- Hedeflerim: okul ve tasarım (sunum, portfolyo), staj ve iş (mülakat, e-posta, toplantı), seyahat ve günlük hayat, ileride bir dil sınavı (IELTS gibi).
- Çocukluktan kalma bir İngilizce çekincem var. Kırmızı kalem gibi davranma; hataları bilgi olarak gör. Gerçek ilerlemeleri fark et ama abartma.

KURALLAR
1. Sohbet ve pratik tamamen İngilizce; açıklamalar, ipuçları ve düzeltme notları Türkçe.
2. Hatalı ya da Türkçe bir şey yazarsam: önce ne demek istediğimi anladığını göster, sonra doğal İngilizcesini "✏️" ile ver, nedenini tek cümleyle Türkçe açıkla.
3. Bir mesajda en fazla 2 düzeltme yap, en önemlilerini seç; küçükleri sona sakla. Beni bunaltma.
4. Türkçe söylediğim bir cümlenin İngilizcesini verdiysen, bir sonraki mesajda onu kendim kullanmamı iste.
5. Kısa konuş (2–5 cümle). Konuşan çoğunlukla ben olayım.
6. Her cevabın sonunda seviyeme uygun, açık uçlu tek bir soru sor.
7. Takılırsam ("help", "?" ya da Türkçe yazarsam) cevabı hemen verme; önce bir ipucu ya da cümle başlangıcı ver.
8. Sesli moddaysak düzeltmeleri çok kısa tut, akışı bozma; ayrıntıları özete bırak.
9. "mod 1", "mod 2", "mod 3", "mod 4" ya da mod adını yazınca o moda geç.
10. Ben "bitti" deyince bir ÖZET ver:
   • İyi yaptığım 2 şey
   • En önemli 5 hatam (yanlış → doğru, kısa Türkçe açıklama)
   • BU HAFTANIN KURALI: en sık yaptığım hataya dair tek kural
   • KELİMELERİM: öğrendiğim yeni kelime ve ifadeler, her satırda "english — türkçe — örnek cümle" formatında (bunları kelime kartlarıma yapıştıracağım)

MODLAR
- Mod 1 · Serbest sohbet: günlük hayat, projelerim, filmler, teknoloji, seyahat.
- Mod 2 · Rol yapma: bir karakteri oynarsın. Sahneyi Türkçe tek cümleyle kur, sonra karakter olarak gerçekçi devam et. Sahne bitince kısa bir değerlendirme yap.
- Mod 3 · Kelime & gramer koçu: 3–5 kelime öğret (anlam, örnek cümle, telaffuz ipucu), sonra bunları benim kullanmamı gerektiren bir mini test yap; cevapları ben denedikten sonra ver.
- Mod 4 · Sınav konuşma provası: IELTS Speaking Part 1, 2, 3 formatında soruları tek tek sor; sonunda tahmini band ve geliştirmem gereken 3 şeyi söyle.`;
}
function tutorPrompt(mode, scene){
  const words = learningWords(8), g = nextGrammar();
  const start = {
    free:`BAŞLA: Mod 1. Seviyemi ve hedeflerimi zaten biliyorsun, tekrar sorma. Kısa, sıcak bir merhaba de ve bana bugünümü ya da üzerinde çalıştığım bir projeyi sor.`,
    role:`BAŞLA: Mod 2. Senaryo: ${scene || SCENES[0]}. Senin rolünü ve sahneyi Türkçe tek cümleyle açıkla, sonra karakter olarak ilk İngilizce repliğini söyle.`,
    coach:`BAŞLA: Mod 3. ${words.length ? `Kartlarımda şu an öğrenmekte olduğum kelimeler: ${words.join(", ")}. Bunlardan 3'ünü seç ve onlarla uyumlu 2 yeni kelime ekle.` : `Seviyeme uygun, tasarım ve günlük hayattan 5 kelime seç.`} Bu haftaki gramer konum: "${g.topic}". Mini testte bu konuyu da kullandır.`,
    exam:`BAŞLA: Mod 4. Part 1 ile başla, soruları tek tek sor.`
  }[mode];
  return tutorBase() + "\n\n" + start;
}

function vTest(m){
  if(!T) T = buildTest();
  const it = T.q[T.i];
  const pct = Math.round(100*T.i/T.q.length);
  const head = `<div class="between"><a class="btn ghost" href="#${S.onboarded?"ben":"bugun"}" data-quit>Vazgeç</a><span class="tiny">${SK[it.sec]}</span></div><div class="progress"><i style="width:${pct}%"></i></div>`;
  if(it.type==="intro"){
    m.innerHTML = head + `<h1>${esc(it.title)}</h1><p class="sub">${esc(it.text)}</p><button class="btn primary block" data-next>Başla</button>`;
  } else if(it.type==="mc"){
    m.innerHTML = head + `<div lang="en">${it.html}</div><div class="opts">${it.o.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}<button class="opt idk" data-k="-1">Bilmiyorum</button></div>
    <p style="text-align:center;margin-top:18px"><button class="btn ghost small" data-skipsec>Bu bölüm bana çok zor geliyor, sonraki bölüme geç</button></p>`;
    if(it.say) setTimeout(()=>speak(it.say), 350);
  } else {
    const rows = T_SELF[it.sec].map((pair,l)=>pair.map((t,j)=>`<label class="check"><input type="checkbox" data-l="${l}" data-j="${j}"><span>${esc(t)} <span class="tag">${LV[l]}</span></span></label>`).join("")).join("");
    m.innerHTML = head + `<h1>${esc(it.title)}</h1><p class="sub">${esc(it.text)}</p><div class="card" style="padding:4px 18px">${rows}</div><button class="btn primary block" data-selfnext>Devam</button>`;
  }
  m.onclick = e=>{
    if(e.target.closest("[data-quit]")){ T = null; return; }
    if(e.target.closest("[data-next]")){ T.i++; vTest(m); return; }
    const o = e.target.closest("[data-k]");
    if(o){ T.ans[T.i] = +o.dataset.k === it.a; T.i++; vTest(m); return; }
    if(e.target.closest("[data-skipsec]")){ const sec = it.sec; while(T.i<T.q.length && T.q[T.i].sec===sec){ T.ans[T.i]=false; T.i++; } vTest(m); return; }
    if(e.target.closest("[data-selfnext]")){
      T.self[it.sec] = [...m.querySelectorAll("input:checked")].map(c=>+c.dataset.l);
      T.i++;
      if(T.i>=T.q.length) finishTest(); else vTest(m);
    }
  };
}
function finishTest(){
  const res = {};
  ["vocab","grammar","reading","listening"].forEach(sec=>{
    const by = [0,0,0,0,0].map(()=>({n:0,ok:0}));
    T.q.forEach((x,i)=>{ if(x.sec===sec && x.type==="mc"){ by[x.lv].n++; if(T.ans[i]) by[x.lv].ok++; } });
    let lv = -1;
    for(let l=0;l<5;l++){ if(by[l].n && by[l].ok/by[l].n >= 0.5) lv = l; else break; }
    res[sec] = lv;
  });
  ["writing","speaking"].forEach(sec=>{
    const c = T.self[sec]; let lv = -1;
    for(let l=0;l<5;l++){ if(c.includes(l)) lv = l; else break; }
    res[sec] = lv;
  });
  S.levels = res; S.testDate = today(); S.history.push({date:today(), levels:res}); S.onboarded = true;
  save(); T = null; location.hash = "#sonuc";
}

/* ================= CARDS ================= */
function wordById(id){
  if(id.startsWith("b:")){ const w = WORDS.find(x=>"b:"+x[0]===id); return w ? {en:w[0],tr:w[1],ex:w[2],lv:w[3],topic:w[4]} : null; }
  const c = S.custom.find(x=>x.id===id); return c ? {en:c.en,tr:c.tr,ex:c.ex||"",lv:null,topic:"benim"} : null;
}
function bulkAdd(text){
  const have = new Set([...S.custom.map(c=>c.en.toLowerCase()), ...Object.keys(S.cards).filter(k=>k.startsWith("b:")).map(k=>k.slice(2).toLowerCase())]);
  let added = 0, skipped = 0, n = Date.now();
  text.split(/\r?\n/).forEach(line=>{
    const parts = line.replace(/^\s*(?:[-•*]|\d+[.)])\s*/,"").split(/\s+[—–-]\s+|\s*\|\s*|\t/).map(s=>s.replace(/\*\*/g,"").trim()).filter(Boolean);
    if(parts.length<2) return;
    const en = parts[0], tr = parts[1], ex = parts.slice(2).join(" — ");
    if(have.has(en.toLowerCase())){ skipped++; return; }
    const id = "u:"+(n++); S.custom.push({id,en,tr,ex}); S.cards[id] = {box:0, due:today()}; have.add(en.toLowerCase()); added++;
  });
  if(added) save();
  return {added, skipped};
}
const INTERVALS = [0,1,3,7,16,35];

function startSession(mini){
  const t = today();

  if(add.length){ S.newOn[t] = (S.newOn[t]||0) + add.length; save(); }
  q = [...new Set([...q, ...add])];
  if(mini) q = q.slice(0,5);
  CS = {q, show:false, total:q.length, ok:0, again:new Set()};
}

let REC = null;
function stopRec(){ if(REC){ try{ REC.onend=null; REC.stop(); }catch(e){} REC=null; } }
function listen(onText, onEnd, continuous){
  if(!SR){ toast("Bu tarayıcı konuşmayı yazıya çeviremiyor. Chrome, Edge ya da Safari dene."); return null; }
  stopRec();
  const r = new SR(); r.lang = "en-US"; r.interimResults = true; r.continuous = !!continuous;
  let finalText = "";
  r.onresult = ev=>{ let interim=""; for(let i=ev.resultIndex;i<ev.results.length;i++){ const t=ev.results[i][0].transcript; if(ev.results[i].isFinal) finalText += t+" "; else interim += t; } onText((finalText+interim).trim(), false); };
  r.onerror = ev=>{ if(ev.error==="not-allowed") toast("Mikrofon izni gerekiyor."); };
  r.onend = ()=>{ REC=null; onEnd(finalText.trim()); };
  r.start(); REC = r; return r;
}
function vPractice(m, sub){
  sub = sub || "yaz";
  const seg = `<div class="seg" role="tablist">${[["yaz","Yaz"],["konus","Konuş"],["dinle","Dinle"],["sohbet","Sohbet"]].map(([k,l])=>`<button role="tab" aria-selected="${k===sub}" data-sub="${k}">${l}</button>`).join("")}</div>`;
  m.innerHTML = `<h1>Pratik</h1>` + seg + `<div id="pbody"></div>`;
  m.querySelector(".seg").onclick = e=>{ const b=e.target.closest("[data-sub]"); if(b) location.hash = "#pratik/"+b.dataset.sub; };
  const body = $("#pbody");
  ({yaz:pWrite, konus:pSpeak, dinle:pListen, sohbet:pChat}[sub] || pWrite)(body);
}
function pWrite(el){
  const w = workOf("writing"), prompts = W_PROMPTS[band(w)];
  let pi = dayNo() % prompts.length;
  const draw = ()=>{
    const draft = (()=>{ try{ return localStorage.getItem(KEY+":draft")||""; }catch(e){ return ""; } })();
    el.innerHTML = `<div class="card"><div class="between"><span class="tag acc">Seviye ${LV[w]}</span><button class="btn ghost small" data-np>Başka konu</button></div>
      <h3 style="margin-top:8px">${esc(prompts[pi])}</h3>
      <textarea id="wt" rows="8" lang="en" spellcheck="false" placeholder="Doğrudan İngilizce yaz. Kelime bilmiyorsan (Türkçesini parantez içinde) yaz, sorun değil.">${esc(draft)}</textarea>
      <div class="between" style="margin-top:8px"><span class="tiny" id="wc">0 kelime</span><div class="row"><button class="btn" data-save>Kaydet</button><button class="btn primary" data-fb>Claude'a düzelttir</button></div></div></div>
      <p class="tiny">Yazım denetimi kapalı: kendi hatalarını görebilmen için. Claude metnini baştan yazmaz, hatalarını ve bir kural gösterir.</p>
      <h2>Yazılarım</h2>
      <div class="card" style="padding:4px 18px">${S.journal.length ? S.journal.slice().reverse().map(j=>`<details class="entry"><summary><b>${esc(j.date)}</b> · <span class="muted small">${esc(j.prompt)}</span></summary><pre lang="en">${esc(j.text)}</pre>${j.fb?`<hr><div class="tiny">Claude'un geri bildirimi</div><pre>${esc(j.fb)}</pre>`:""}</details>`).join("") : `<p class="small muted">Henüz yazı yok. İlki en zoru; 3 cümle bile yeter.</p>`}</div>`;
    const ta = $("#wt"), wc = $("#wc");
    const upd = ()=>{ wc.textContent = (ta.value.trim().split(/\s+/).filter(Boolean).length)+" kelime"; try{ localStorage.setItem(KEY+":draft", ta.value); }catch(e){} };
    ta.oninput = upd; upd();
    const store = ()=>{ const text = ta.value.trim(); if(!text){ toast("Önce bir şeyler yaz"); return null; }
      const j = {id:Date.now(), date:today(), prompt:prompts[pi], text, kind:"yazma"}; S.journal.push(j);
      S.done[today()] = Object.assign({}, S.done[today()], DAYPLAN[new Date().getDay()]==="writing" ? {main:true} : {});
      save(); try{ localStorage.removeItem(KEY+":draft"); }catch(e){} return j; };
    el.onclick = e=>{
      if(e.target.closest("[data-np]")){ pi = (pi+1) % prompts.length; draw(); return; }
      if(e.target.closest("[data-save]")){ if(store()){ toast("Kaydedildi"); draw(); } return; }
      if(e.target.closest("[data-fb]")){ const j = store(); if(!j) return; draw();
        bridge("Yazını Claude'a düzelttir", P.writing(j.prompt, LV[w], j.text), {save:v=>{ const x=S.journal.find(y=>y.id===j.id); if(x){ x.fb=v; save(); draw(); } }}); }
    };
  };
  draw();
}

     <div class="card"><h3>3 · LinguaClaude ile konuş</h3><p class="small muted" style="margin:0 0 10px">Serbest sohbet, rol yapma (kafe, mülakat, jüri…), kelime koçu ya da sınav provası. Claude mobil uygulamasında ses moduyla gerçek bir konuşma.</p><a class="btn" href="#pratik/sohbet">Sohbet modlarına git</a></div>

    const frBtn = $("#fr"), frt = $("#frt"), frtx = $("#frtx"); let timer = null;

      listen(t=>{ frtx.value = (base?base+" ":"")+t; }, said=>{ clearInterval(timer); frBtn.classList.remove("live"); frBtn.innerHTML = ICON.mic; if(said) frtx.value = (base?base+" ":"")+said; }, true);
    };
    el.onclick = e=>{
      if(e.target.closest("[data-prev]")){ stopRec(); si = Math.max(0,si-1); draw(); }
      else if(e.target.closest("[data-nexts]")){ stopRec(); si = (si+1) % sents.length; if(si===0) toast("Tur tamam! Baştan bir tur daha?"); draw(); }
      else if(e.target.closest("[data-nt]")){ stopRec(); ti = (ti+1) % topics.length; draw(); }

    };
  };
  draw();
}
function pListen(el){
  const w = workOf("listening");
  const pool = [...SENT[w], ...(w>0?SENT[w-1]:[])];
  let i = 0, order = pool.map((_,k)=>k).sort(()=>Math.random()-.5).slice(0,5), score = [];
  const draw = ()=>{
    if(i>=order.length){
      const avg = Math.round(score.reduce((a,b)=>a+b,0)/score.length);
      el.innerHTML = `<div class="card soft"><h3>Dikte bitti 🎧</h3><p class="small" style="margin:0">Ortalama doğruluk: <b>%${avg}</b>. ${avg>=85?"Kulakların iyi çalışıyor!":"Kaçırdığın kelimeler genelde kısa, vurgusuz kelimeler (a, the, to, have). Bu çok normal; dinledikçe oturur."}</p></div>
      <button class="btn primary block" data-again>Yeni 5 cümle</button>`;
      if(DAYPLAN[new Date().getDay()]==="listening" && band(w)==="low"){ S.done[today()] = Object.assign({}, S.done[today()], {main:true}); save(); }
      el.onclick = e=>{ if(e.target.closest("[data-again]")){ i=0; score=[]; order = pool.map((_,k)=>k).sort(()=>Math.random()-.5).slice(0,5); draw(); } };
      return;
    }
    const s = pool[order[i]];
    el.innerHTML = `<div class="card"><div class="between"><h3 style="margin:0">Dikte</h3><span class="tag acc">${LV[w]} · ${i+1}/${order.length}</span></div>
      <p class="small muted" style="margin:6px 0 12px">Cümleyi dinle ve duyduğun gibi yaz. İstediğin kadar tekrar dinle.</p>
      <div class="row">${playBtn(s, "Cümleyi dinle")}</div>
      <textarea id="dt" rows="3" lang="en" spellcheck="false" autocapitalize="off" style="margin-top:12px" placeholder="Duyduğunu yaz…"></textarea>
      <div id="dres" class="diff" style="margin-top:10px"></div>
      <div class="row" style="margin-top:10px"><button class="btn primary" data-chk>Kontrol et</button></div></div>
      <div class="card small muted">İpucu: Önce tüm cümleyi bir kez dinle, sonra parça parça yaz. Emin olmadığın yere tahmin yaz; boş bırakmaktan iyidir.</div>`;
    setTimeout(()=>speak(s), 300);
    el.onclick = e=>{
      const b = e.target.closest("[data-chk],[data-nx]"); if(!b) return;
      if(b.hasAttribute("data-nx")){ i++; draw(); return; }
      const c = compare(s, $("#dt").value); score.push(c.pct);
      $("#dres").innerHTML = `<div class="small"><b>%${c.pct}</b></div><div lang="en" style="font-size:17px">${c.html}</div>`;
      b.outerHTML = `<button class="btn primary" data-nx>Sonraki ›</button>`;
    };
  };
  draw();
}

  <h2>Verilerim</h2>
  <div class="card stack"><p class="small muted" style="margin:0">Her şey sadece bu cihazda, tarayıcıda saklanıyor. Telefon değiştirirken ya da ara sıra yedek al.</p>
   <div class="row"><button class="btn" data-exp>Yedeği indir</button><label class="btn">Yedekten yükle<input type="file" accept="application/json" data-imp hidden></label></div>
   <div class="row"><span class="small">Görünüm</span>${[["","Otomatik"],["light","Açık"],["dark","Koyu"]].map(([k,l])=>`<button class="chip" data-th="${k}" aria-pressed="${(S.settings.theme||"")===k}">${l}</button>`).join("")}</div>
   <div class="row"><span class="small">Konuşma hızı</span>${[[0.8,"Yavaş"],[0.9,"Normal"],[1,"Doğal"]].map(([k,l])=>`<button class="chip" data-rate="${k}" aria-pressed="${S.settings.rate===k}">${l}</button>`).join("")}</div>
   <button class="btn ghost" data-reset style="color:var(--warn)">Her şeyi sıfırla</button></div>`;
  m.onclick = e=>{
    if(e.target.closest("[data-exp]")){ const b = new Blob([JSON.stringify(S,null,1)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="ingilizce-yedek-"+today()+".json"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); return; }
    const th = e.target.closest("[data-th]"); if(th){ S.settings.theme = th.dataset.th; save(); applyTheme(); vMe(m); return; }
    const rt = e.target.closest("[data-rate]"); if(rt){ S.settings.rate = +rt.dataset.rate; save(); speak("This is how fast I will speak."); vMe(m); return; }
    if(e.target.closest("[data-reset]")){ if(confirm("Tüm ilerleme, kartlar ve yazılar silinecek. Emin misin? (Önce yedek almanı öneririm.)")){ S = fresh(); save(); location.hash="#bugun"; render(); } }
  };
  m.querySelector("[data-imp]").onchange = ev=>{ const f = ev.target.files[0]; if(!f) return; f.text().then(t=>{ try{ const d = JSON.parse(t); if(!d || d.v!==1) throw 0; S = Object.assign(fresh(), d); save(); applyTheme(); toast("Yedek yüklendi"); render(); }catch(err){ toast("Bu dosya bir yedek değil gibi"); } }); };
}
function applyTheme(){ const t = S.settings.theme; if(t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme"); }

/* ================= BOOT ================= */
applyTheme();
render();
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
