    if(e.target.closest("[data-sskip]")){ e.preventDefault(); clearInterval(BT); ev("skip", k); flowNext(m, k, "skip"); }
  };
}
/* 📸 Proof box: add screenshots / photos of solved book pages, then a ready prompt to have Claude or ChatGPT check them.
   Used on book steps and on the stand-alone #kontrol page. Images stay on this device (IndexedDB). */
function proofHTML(key){ const ph = (fd().ph||{})[key] || 0, ck = (fd().chk||{})[key];
  return `<div class="card"><div class="tiny">📸 SAYFANI KONTROL ETTİR</div>
  <ol class="small" style="margin:6px 0 10px;padding-left:20px;line-height:1.6"><li><b>Telefonda:</b> kitabın çözdüğün sayfasının ekran görüntüsünü al (ya da kâğıttaysa fotoğrafını çek), sonra aşağıdaki düğmeyle seç. <b>Bilgisayarda:</b> Win+Shift+S ile al, bu sayfada Ctrl+V yap.</li><li>“Kontrol ettir”e dokun: hazır komutu Claude'a ya da ChatGPT'ye yapıştır, <b>aynı görselleri de sohbete ekle</b>.</li><li>İstersen gelen cevabı buraya kaydet.</li></ol>
  <label class="btn block" style="cursor:pointer">🖼️ Ekran görüntüsü / fotoğraf seç${ph ? ` (${ph} eklendi)` : ""}<input type="file" accept="image/*" multiple data-photo hidden></label>
  <div id="phs" class="row" style="gap:6px;margin-top:8px"></div>
  <button class="btn primary block" data-check style="margin-top:8px">🧑‍🏫 Kontrol ettir (Claude / ChatGPT)</button>
  ${ck ? `<details style="margin-top:8px"><summary class="small"><b>Kaydedilen kontrol sonucu</b></summary><div class="small" style="white-space:pre-wrap;margin-top:6px">${esc(ck)}</div></details>` : ""}
  <p class="tiny" style="margin:8px 0 0">Görseller sadece bu cihazda kalır; Drive'a gitmez.</p></div>`; }
function proofBind(m, key, label, onAdd, redraw){
  const hash = location.hash, n = (fd().ph||{})[key] || 0;
  (async ()=>{ for(let j=0;j<n;j++){ const u = await idbGet(`ph:${today()}:${key}:${j}`).catch(()=>null), box = $("#phs"); if(u && box) box.insertAdjacentHTML("beforeend", `<img src="${u}" alt="Sayfa görseli ${j+1}" style="width:72px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line)">`); } })();
  const add = async files=>{ files = files.filter(f=>/^image\//.test(f.type)); if(!files.length) return;
    for(const f of files){ const url = await shrinkImg(f); const dd = fd(); dd.ph = dd.ph || {}; const j = dd.ph[key] || 0; await idbPut(`ph:${today()}:${key}:${j}`, url); dd.ph[key] = j+1; }
    onAdd && onAdd(); save(); toast(`📷 ${files.length} görsel eklendi ✓`); if(location.hash===hash) redraw(); };
  const inp = m.querySelector("[data-photo]"); if(inp) inp.onchange = ()=>add([...inp.files]);
  // a screenshot pasted with Ctrl+V (Win+Shift+S copies it), only while this page is open
  document.onpaste = e=>{ if(location.hash!==hash){ document.onpaste = null; return; } const fs = [...((e.clipboardData||{}).files||[])]; if(fs.length){ e.preventDefault(); add(fs); } };
}
function proofClick(e, key, label, redraw){

    {tip:"Komutu yapıştırdıktan sonra sayfa görsellerini de sohbete ekle (ataş / + simgesi). ChatGPT'de de aynı komut çalışır.", save: v=>{ const dd = fd(); dd.chk = dd.chk || {}; dd.chk[key] = v; save(); redraw(); }});

// photo → small JPEG data URL (≈1200px) so a page photo stays a few hundred KB on the device
function shrinkImg(file){ return new Promise(ok=>{ const r = new FileReader(); r.onload = ()=>{ const im = new Image(); im.onload = ()=>{
  const sc = Math.min(1, 1200/Math.max(im.width, im.height)), c = document.createElement("canvas"); c.width = Math.round(im.width*sc); c.height = Math.round(im.height*sc);
  c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); ok(c.toDataURL("image/jpeg", 0.72)); }; im.onerror = ()=>ok(r.result); im.src = r.result; }; r.readAsDataURL(file); }); }

/* Scenes the user adds (written by ChatGPT/Claude from the prompt below, pasted in the app). No audio files: TTS reads them. */
function sceneProblems(sc){
  if(!sc || typeof sc!=="object" || Array.isArray(sc)) return ["sahne bir JSON nesnesi değil"];
  const P = [], L = Array.isArray(sc.l) ? sc.l : [], who = sc.who || {};
  ["id","t","ic","top"].forEach(f=>{ if(typeof sc[f]!=="string" || !sc[f].trim()) P.push(`"${f}" eksik`); });
  if(!who.A || !who.B) P.push(`"who" içinde A ve B olmalı`);
  if(L.length<4) P.push("en az 4 replik (l) olmalı");
  L.forEach((x,i)=>{ if(!Array.isArray(x) || !(x[0] in who) || typeof x[1]!=="string" || typeof x[2]!=="string") P.push(`replik ${i}: ["A","English","Türkçe"] biçiminde olmalı`); });
  if(!Array.isArray(sc.q) || sc.q.length<2) P.push("en az 2 soru (q) olmalı");
  (sc.q||[]).forEach((q,i)=>{ if(!Array.isArray(q) || typeof q[0]!=="string" || !Array.isArray(q[1]) || q[1].length<3 || !(q[2]>=0 && q[2]<L.length)) P.push(`soru ${i}: ["soru", ["doğru","yanlış","yanlış"], replikNo] olmalı`); });
  if(!Array.isArray(sc.ph) || sc.ph.length<3 || sc.ph.length>5) P.push("3–5 ifade (ph) olmalı");
  (Array.isArray(sc.ph) ? sc.ph : []).forEach((p,i)=>{
    if(!p || typeof p.p!=="string" || typeof p.k!=="string" || typeof p.tr!=="string"){ P.push(`ifade ${i}: "p", "k", "tr" eksik`); return; }

   : t!=="c" ? `<div class="row" style="margin-top:14px"><button class="btn primary" data-check>Kontrol et</button><button class="btn ghost" data-idk>Bilmiyorum</button></div>` : ""}`;

function vGPEnd(m){

  ${res ? `<div class="fb ${res.ok?"ok":"no"}"><h3>${esc(res.t)}</h3>${res.html?`<div lang="en" class="diff" style="margin:4px 0">${res.html}</div>`:""}<div class="small">${esc(res.note||"")}</div>
    <div class="row" style="margin-top:10px"><button class="btn primary" data-next>${s<2?"Sonraki basamak →":"Bitir →"}</button><button class="btn ghost" data-edit>Düzelt</button></div></div>`
  : `<div class="row" style="margin-top:12px"><button class="btn primary" data-check>Kontrol et</button></div>`}`;

    (S.pack.phrasal||[]).forEach(([e,tr])=>add(e, {tr})); (S.pack.multi||[]).forEach(x=>add(x.en, {tr:x.tr}));

function packPool(){
  const P = S.pack; if(!P) return [];
  const g = (P.groups||[]).map((_,i)=>"p:g"+i), v = (P.phrasal||[]).map((_,i)=>"p:v"+i), mu = (P.multi||[]).map((_,i)=>"p:m"+i);
  const out = []; let vi = 0;
  g.forEach((id,i)=>{ out.push(id); if(i%3===2 && vi<v.length) out.push(v[vi++]); });
  return [...out, ...v.slice(vi), ...mu].filter(id=>!S.cards[id]);
}
function packNewLeft(){ return S.pack ? Math.max(0, (S.settings.packPerDay ?? 5) - (S.newOn[today()+"p"]||0)) : 0; }
function packWord(id){
  const P = S.pack; if(!P) return null; const k = id[2], n = +id.slice(3), c = S.cards[id];
  if(k==="g"){ const g = P.groups[n]; if(!g) return null; const front = g.en[((c&&c.box)||0) % g.en.length];
    return {en:front, tr:g.tr, ex:"", back: g.en.length>1 ? "Eş anlamlıları: "+g.en.filter(x=>x!==front).join(" · ") : "", lv:3, topic:"sınav · eş anlamlı"}; }
  if(k==="v"){ const p = P.phrasal[n]; return p ? {en:p[0], tr:p[1], ex:"", lv:3, topic:"sınav · phrasal verb"} : null; }
  if(k==="m"){ const x = P.multi[n]; return x ? {en:x.en, tr:x.tr, ex:"", back:"Birden fazla anlamı var: hepsini hatırlamaya çalış.", lv:3, topic:"sınav · çok anlamlı"} : null; }

function startSyn(){

function paceOn(d){ const w = new Date(d+"T12:00:00").getDay(); return (w===0 || w===6) && S.settings.wkend ? S.settings.wkend : (S.settings.pace || 45); }
function avgPlan(){ const a = S.settings.pace || 45, b = S.settings.wkend || a; return Math.round((5*a + 2*b)/7); }

function dayMin(d){ const l = (S.log||{})[d] || {};

function baseHours(){
  if(!S.levels) return 0;

  const cap = Math.max(S.levels.vocab ?? -1, S.levels.grammar ?? -1) + 1;
  const F = S.levelsF || {}, v = ["vocab","grammar","reading","listening"].map(k=>{ const L = S.levels[k] ?? -1, f = F[k];   // fine test value while it still matches the level
    const x = f!=null && Math.max(-1, Math.min(4, Math.floor(f + 0.3)))===L ? Math.min(f, L + 0.7) : L; return (k==="reading" || k==="listening") ? Math.min(x, cap) : x; }), avg = v.reduce((a,b)=>a+b,0)/v.length;

/* Forecast from real history: logged minutes (empty days count as 0) + lesson speed. "Fully reached" = study hours AND that level's lessons done. */
const LVN = ["A1","A2","B1","B2","C1"];
function dateIn(days){ return new Date(addDays(today(), Math.ceil(days))+"T12:00:00").toLocaleDateString("tr-TR",{month:"long",year:"numeric"}); }
function forecast(planMin){
  const t = today(), days = []; for(let i=0;i<28;i++) days.push(dayMin(addDays(t,-i)));
  const activeIdx = days.map((x,i)=>x>0?i:-1).filter(i=>i>=0), active = activeIdx.length;
  const span = active ? Math.max(7, activeIdx[activeIdx.length-1]+1) : 28;
  const real = active>=3 ? days.slice(0,span).reduce((a,b)=>a+b,0)/span : null;
  const w1 = days.slice(0,7).reduce((a,b)=>a+b,0)/7, w2 = days.slice(7,14).reduce((a,b)=>a+b,0)/7;
  const trend = active>=5 && w2>0 ? (w1>w2*1.25 ? "up" : w1<w2*0.75 ? "down" : "flat") : null;
  const lessons28 = Object.values(gr().done).filter(d=>d.pass && d.date && d.date>addDays(t,-28)).length;
  const H = totalHours();
  // trust real data gradually: a few days in, a 7-day average of new-starter days says little (it gave "2033")
  const first = Object.keys(S.log||{}).filter(d=>dayMin(d)>0).sort()[0], age = first ? Math.round((new Date(t+"T12:00:00") - new Date(first+"T12:00:00"))/864e5) + 1 : 0, wR = Math.min(1, age/28);
  const per = real!=null ? wR*real + (1-wR)*planMin : planMin;
  const rows = [2,3,4].map(i=>{
    const hLeft = Math.max(0, LV_HOURS[i]-H), dH = hLeft*60/Math.max(3, per);
    const lLeft = LESSONS.filter(l=>l.lv<=i && !lessonPassed(l.id)).length;
    const lRate = lessons28>=2 ? lessons28/28 : Math.max(0.15, per/60*0.5);   // lessons per day; before data: ~1 lesson per 2 h of study
    const dL = lLeft / lRate, dAll = Math.max(dH, dL);
    const planH = hLeft*60/Math.max(3, planMin), planAll = Math.max(planH, lLeft / Math.max(lRate, planMin/60*0.5));
    return {i, lv:LVN[i], hLeft, lLeft, dAll, planAll, limit: dL>dH ? "ders" : "saat", done: hLeft<=0 && lLeft===0};
  });
  return {real: real!=null ? Math.round(real) : null, active, span, trend, lessons28, H, per, planMin, rows, age, wR};
}

/* Habits and error patterns from the event log (last 28 days). */
function behaviour(){
  const from = Math.round(Date.now()/1000) - 28*86400, E = (S.ev||[]).filter(e=>e[0]>=from), cnt = (a,k)=>{ a[k] = (a[k]||0)+1; return a; };

let WP = null;
function vWpm(m){
  const g = game(), W = g.wpm || (g.wpm = []);
  const pool = READS.map((r,i)=>({i, t:r.t, x:r.x, lv:r.lv}));
  if(WP && WP.phase){
    const toks = WP.x.split(/\s+/);
    m.innerHTML = `<h1>${WP.phase==="run" ? `⏱️ <span id="wpt">60</span> sn` : "Nerede kaldın?"}</h1><p class="sub">${WP.phase==="run" ? "Normal hızında, anlayarak oku. Süre bitince son okuduğun kelimeye dokun." : "Son okuduğun kelimeye dokun."}</p>
    <div class="card reader" lang="en" style="line-height:1.9">${toks.map((w,i)=>`<span class="tk" data-wi="${i}">${esc(w)}</span>`).join(" ")}</div>
    ${WP.phase==="run" ? `<button class="btn ghost block" data-wstop>Metni bitirdim</button>` : ""}`;
    if(WP.phase==="run"){ const t0 = Date.now(); clearInterval(WP.iv); WP.iv = setInterval(()=>{ if(!WP || location.hash!=="#oyun/hiz"){ clearInterval(WP && WP.iv); WP = null; return; } const left = 60 - Math.floor((Date.now()-t0)/1000); const el = $("#wpt"); if(el) el.textContent = Math.max(0,left); if(left<=0){ clearInterval(WP.iv); WP.phase = "pick"; WP.sec = 60; vWpm(m); } }, 250); WP.t0 = t0; }
    m.onclick = e=>{
      if(e.target.closest("[data-wstop]")){ clearInterval(WP.iv); WP.sec = Math.max(5, (Date.now()-WP.t0)/1000); WP.phase = "pick"; vWpm(m); return; }
      const tk = e.target.closest("[data-wi]"); if(tk && WP.phase==="pick"){ const n = +tk.dataset.wi + 1, w = Math.round(n * 60 / (WP.sec||60)); W.push({t: Date.now(), d: today(), w, txt: WP.t}); WP = null; save(); toast(`${w} kelime/dakika`); vWpm(m); }
    };
    return;
  }
  const mx = Math.max(250, ...W.map(x=>x.w));
  m.innerHTML = guideSeg("oyun") + `<a class="btn ghost" href="#oyun">‹ Oyun</a><h1>Okuma hızı</h1><p class="sub">İki haftada bir, daha önce okumadığın bir metni 1 dakika normal hızda, anlayarak oku. Başlarda 60–90 kelime çok normal; rahat bir okur 200'ün üstüne çıkar.</p>
  ${W.length ? `<div class="card"><div style="display:flex;align-items:flex-end;gap:6px;height:140px">${W.slice(-18).map(x=>`<div style="flex:1;text-align:center"><div class="tiny">${x.w}</div><div style="background:var(--acc);border-radius:6px 6px 0 0;height:${Math.round(110*x.w/mx)}px"></div></div>`).join("")}</div>
    <p class="small" style="margin:8px 0 0">İlk ölçüm: <b>${W[0].w}</b> · Son: <b>${W[W.length-1].w}</b>${W.length>1?` · Fark: <b>%${Math.round(100*(W[W.length-1].w-W[0].w)/W[0].w)}</b>`:""}</p></div>` : ""}
  <h2>Bir metin seç</h2>${pool.map(r=>`<button class="card lrow" style="width:100%;border:0;text-align:left;cursor:pointer" data-wsel="${r.i}"><span class="tag acc">${r.lv}</span><span style="flex:1">${esc(r.t)}</span>›</button>`).join("")}
  <div class="card stack"><b class="small">Ya da kendi metnini yapıştır (kitaptan, dersten)</b><textarea id="wown" rows="4" lang="en"></textarea><button class="btn sm" data-wown>Bu metinle ölç</button></div>`;
  m.onclick = e=>{
    const s = e.target.closest("[data-wsel]"); if(s){ const r = pool[+s.dataset.wsel]; WP = {phase:"run", x:r.x, t:r.t}; vWpm(m); return; }
    if(e.target.closest("[data-wown]")){ const x = $("#wown").value.trim(); if(x.split(/\s+/).length<40){ toast("En az 40 kelimelik bir metin yapıştır"); return; } WP = {phase:"run", x, t:"Kendi metnim"}; vWpm(m); }
  };
}
/* ses kaydı: aynı soruyu her seferinde kaydet, ilk kayıtla karşılaştır. Ses dosyaları sadece bu cihazda (IndexedDB). */
const RQ = "Who are you, what do you study and what are you working on these days?";
function idb(){ return new Promise((ok, no)=>{ const r = indexedDB.open("ingilizce-ses", 1); r.onupgradeneeded = ()=>r.result.createObjectStore("rec"); r.onsuccess = ()=>ok(r.result); r.onerror = ()=>no(r.error); }); }
async function idbPut(k, v){ const db = await idb(); return new Promise(ok=>{ const tx = db.transaction("rec","readwrite"); tx.objectStore("rec").put(v, k); tx.oncomplete = ()=>ok(); }); }
async function idbGet(k){ const db = await idb(); return new Promise(ok=>{ const q = db.transaction("rec").objectStore("rec").get(k); q.onsuccess = ()=>ok(q.result); q.onerror = ()=>ok(null); }); }
let MR = null;
function vRec(m){
  const g = game(), R = g.rec || (g.rec = []);
  m.innerHTML = guideSeg("oyun") + `<a class="btn ghost" href="#oyun">‹ Oyun</a><h1>Ses kayıtları</h1><p class="sub">Her kayıt 1 dakika, her seferinde aynı soru. Aynı soruyu sorduğun için gelişimini net duyarsın.</p>
  <div class="card" style="text-align:center"><p lang="en" style="font-weight:700;font-size:18px">${esc(RQ)}</p>
   <button class="btn primary" data-rec>${MR ? "⏹️ Durdur" : "🎙️ Kaydı başlat (1 dk)"}</button><div class="tiny" id="rect" style="margin-top:6px"></div></div>
  ${R.slice().reverse().map((x,i)=>`<div class="card"><div class="between"><b class="small">#${R.length-i} · ${esc(x.d)}</b>${i===R.length-1?`<span class="tag">ilk kayıt</span>`:""}</div><audio controls preload="none" data-aud="${x.t}" style="width:100%;margin-top:6px"></audio>
   <input class="small" data-rnote="${x.t}" placeholder="Ne fark ettim?" value="${esc(x.note||"")}" style="width:100%;margin-top:6px"></div>`).join("")}
  <p class="tiny" style="text-align:center">Ses dosyaları sadece bu cihazda saklanır, Drive'a gönderilmez.</p>`;
  m.querySelectorAll("[data-aud]").forEach(async a=>{ const b = await idbGet(a.dataset.aud); if(b) a.src = URL.createObjectURL(b); else a.replaceWith(Object.assign(document.createElement("div"), {className:"tiny muted", textContent:"Bu kayıt başka bir cihazda."})); });
  m.onchange = e=>{ const n = e.target.closest("[data-rnote]"); if(n){ const x = R.find(y=>String(y.t)===n.dataset.rnote); if(x){ x.note = n.value; save(); } } };
  m.onclick = async e=>{
    if(!e.target.closest("[data-rec]")) return;
    if(MR){ MR.stop(); return; }
    if(!navigator.mediaDevices || !window.MediaRecorder){ toast("Bu tarayıcı ses kaydedemiyor. Telefonun ses kaydediciyi kullanıp sadece işaretleyebilirsin."); return; }
    try{ const st = await navigator.mediaDevices.getUserMedia({audio:true}); const ch = []; MR = new MediaRecorder(st); const t0 = Date.now();
      MR.ondataavailable = ev=>ch.push(ev.data);
      MR.onstop = async ()=>{ st.getTracks().forEach(t=>t.stop()); clearInterval(MR.iv); MR = null; const t = Date.now(); await idbPut(String(t), new Blob(ch, {type: ch[0] ? ch[0].type : "audio/webm"}));
        R.push({t: String(t), d: today()}); if(!R.slice(0,-1).some(x=>x.d===today())) gLog("Ses kaydı", 10); lvCheck(); save(); toast("Kaydedildi · +10 XP 🎙️"); vRec(m); };
      MR.start(); MR.iv = setInterval(()=>{ const s = Math.floor((Date.now()-t0)/1000); const el = $("#rect"); if(el) el.textContent = s+" sn"; if(s>=60 && MR) MR.stop(); }, 500); vRec(m);
    }catch(err){ MR = null; toast("Mikrofon izni verilmedi."); }
  };
}

  } else {

    m.innerHTML = head + `<h1>${esc(it.title)}</h1><p class="sub">${esc(it.text)}</p><div class="card" style="padding:4px 18px">${rows}</div><button class="btn primary block" data-selfnext>Devam</button>`;
  }
  m.onclick = e=>{
    if(e.target.closest("[data-quit]")){ T = null; return; }
    if(e.target.closest("[data-next]")){ T.i++; vTest(m); return; }
    const o = e.target.closest("[data-k]");
    if(o){ const k = +o.dataset.k; T.ans[T.i] = k===it.a ? 1 : k<0 ? 0 : -1; ev("pt", it.sec+":"+it.lv, T.ans[T.i]); T.i++; vTest(m); return; }   // 1 right · 0 "Bilmiyorum" · -1 wrong
    if(e.target.closest("[data-skipsec]")){ const sec = it.sec; while(T.i<T.q.length && T.q[T.i].sec===sec){ T.ans[T.i]=0; T.i++; } vTest(m); return; }
    if(e.target.closest("[data-selfnext]")){
      T.self[it.sec] = [...m.querySelectorAll("input:checked")].map(c=>+c.dataset.l);

/* Scoring. Old rule ("≥50% right at a level, stop at the first miss") let lucky guesses pass a level: in a simulation
   it found the true level only 30–40% of the time. Now: each wrong answer cancels a lucky guess (right − wrong/(options−1)),
   every level adds 0–1 to a continuous score, and a level counts once ~70% of it is shown. Simulated accuracy 56–72%,
   almost never 2 levels off. "Bilmiyorum" is never punished. levelsF keeps the fine value for the hour estimate. */
function testLevel(cells){ const s = cells.reduce((a,c)=>a + Math.min(1, Math.max(0, c)), 0), f = s - 1;
  return {lv: Math.max(-1, Math.min(4, Math.floor(f + 0.3))), f: Math.round(f*100)/100}; }
function finishTest(){
  const res = {}, fine = {};
  ["vocab","grammar","reading","listening"].forEach(sec=>{
    const by = [0,0,0,0,0].map(()=>({n:0, ok:0, bad:0, k:4}));
    T.q.forEach((x,i)=>{ if(x.sec===sec && x.type==="mc"){ const b = by[x.lv]; b.n++; b.k = x.o.length; if(T.ans[i]===1 || T.ans[i]===true) b.ok++; else if(T.ans[i]===-1) b.bad++; } });
    const r = testLevel(by.map(b=>b.n ? (b.ok - b.bad/Math.max(1, b.k-1))/b.n : 0)); res[sec] = r.lv; fine[sec] = r.f;
  });
  ["writing","speaking"].forEach(sec=>{   // both statements of a level = full, one = half
    const c = T.self[sec], r = testLevel([0,1,2,3,4].map(l=>c.filter(x=>x===l).length/2)); res[sec] = r.lv; fine[sec] = r.f;
  });
  S.levels = res; S.levelsF = fine; S.testDate = today(); S.history.push({date:today(), levels:res}); S.onboarded = true;
  save(); T = null; location.hash = "#sonuc";
}

function wordById(id){
  if(id.startsWith("p:")) return packWord(id);
  if(id.startsWith("b:")){ const w = WORDS.find(x=>"b:"+x[0]===id); return w ? {en:w[0],tr:w[1],ex:w[2],lv:w[3],topic:w[4]} : null; }
  const c = S.custom.find(x=>x.id===id); return c ? {en:c.en,tr:c.tr,ex:c.ex||"",lv:null,topic:"benim"} : null;
}
function bulkAdd(text){
  const have = new Set([...S.custom.map(c=>c.en.toLowerCase()), ...Object.keys(S.cards).filter(k=>k.startsWith("b:")).map(k=>k.slice(2).toLowerCase())]);
  let added = 0, skipped = 0, n = Date.now();
  text.split(/\r?\n/).forEach(line=>{
    const parts = line.replace(/^\s*(?:[-•*]|\d+[.)])\s*/,"").split(/\s+[—–-]\s+|\s*\|\s*|\t/).map(s=>s.replace(/\*\*/g,"").trim()).filter(Boolean);
    if(parts.length<2) return;
    const en = parts[0], tr = parts[1], ex = parts.slice(2).join(" — ");
    if(have.has(en.toLowerCase())){ skipped++; return; }
    const id = "u:"+(n++); S.custom.push({id,en,tr,ex}); S.cards[id] = {box:0, due:today()}; have.add(en.toLowerCase()); added++;
  });
  if(added) save();
  return {added, skipped};
}

let REC = null;
function stopRec(){ if(REC){ try{ REC.onend=null; REC.stop(); }catch(e){} REC=null; } }
function listen(onText, onEnd, continuous){
  if(!SR){ toast("Bu tarayıcı konuşmayı yazıya çeviremiyor. Chrome, Edge ya da Safari dene."); return null; }
  stopRec();
  const r = new SR(); r.lang = "en-US"; r.interimResults = true; r.continuous = !!continuous;
  let finalText = "";
  r.onresult = ev=>{ let interim=""; for(let i=ev.resultIndex;i<ev.results.length;i++){ const t=ev.results[i][0].transcript; if(ev.results[i].isFinal) finalText += t+" "; else interim += t; } onText((finalText+interim).trim(), false); };
  r.onerror = ev=>{ if(ev.error==="not-allowed") toast("Mikrofon izni gerekiyor."); };
  r.onend = ()=>{ REC=null; onEnd(finalText.trim()); };
  r.start(); REC = r; return r;
}

function wr(){ if(!S.wr) S.wr = {stage:0, done:{}, count:[0,0,0,0,0], rules:[], free:0, micro:0, sentences:0, dismissUp:0}; return S.wr; }
function defaultStage(){ const l = lvOf("writing"); return l<=0 ? 1 : l===1 ? 2 : 3; }
function curStage(){ return wr().stage || defaultStage(); }
function countSentences(t){ return (t.match(/[^.!?\n]+[.!?]*/g)||[]).filter(s=>s.trim().split(/\s+/).length>=2).length; }
function nextUnit(){
  const w = workOf("writing"), d = wr().done;
  for(let l=w; l<5; l++){ const u = UNITS.find(x=>x.lv===l && !d[x.id]); if(u) return u; }
  const atLv = UNITS.filter(x=>x.lv===w);
  return atLv.find(x=>(d[x.id]||0) < curStage()) || atLv[dayNo()%atLv.length];
}
function markWrite(){ S.done[today()] = Object.assign({}, S.done[today()], {write:true}, DAYPLAN[new Date().getDay()]==="writing" ? {main:true} : {}); }
function insertAt(ta, text){
  const s = ta.selectionStart ?? ta.value.length, e = ta.selectionEnd ?? ta.value.length;
  const before = ta.value.slice(0,s), sep = before && !/\s$/.test(before) ? " " : "";
  ta.value = before + sep + text + ta.value.slice(e);
  const pos = (before+sep+text).length; const blank = text.indexOf("___");
  ta.focus(); if(blank>=0){ ta.setSelectionRange(before.length+sep.length+blank, before.length+sep.length+blank+3); } else ta.setSelectionRange(pos,pos);
  ta.dispatchEvent(new Event("input"));
}

      <textarea id="t2" rows="6" lang="en" spellcheck="false">${esc(entry.text2 || entry.text)}</textarea><button class="btn" data-t2 style="margin-top:8px">2. taslağı kaydet</button></div>

    const wb = e.target.closest("[data-wb]"); if(wb && $("#wt")){ insertAt($("#wt"), wb.dataset.wb); return; }
    if(e.target.closest("[data-easier]")){ stage = Math.max(1, stage-1); draw(); toast("Daha çok destek: "+STAGES[stage].n); return; }

      if(stage===2 && text===plain) toast("Hiç değiştirmedin, olsun. Bir dahakine 1 kelimeyle başla 🙂");

      S.journal.push(entry); W.done[u.id] = Math.max(W.done[u.id]||0, stage); W.count[stage] = (W.count[stage]||0)+1; W.sentences += countSentences(text);
      markWrite(); setDraft(null); save(); phase = "done"; draw(); window.scrollTo(0,0); return;
    }
    if(e.target.closest("[data-fb]")) bridge("Yazını Claude'a göster", wfocus(u, stage, LV[u.lv], entry.text2 || entry.text), {save:v=>{ entry.fb = v; const m = v.match(/BU HAFTANIN KURALI[^:\n]*[:\-–]\s*(.+)/i); if(m && $("#rule")) $("#rule").value = m[1].replace(/\*+/g,"").trim(); save(); }, tip:"Claude ipucu verince cevaplara bakmadan önce 2. taslakta kendin düzeltmeyi dene."});
    if(e.target.closest("[data-rule]")){ const r = $("#rule").value.trim(); if(!r){ toast("Kuralı yaz"); return; } W.rules.push({text:r, date:today()}); save(); toast("Kural defterine eklendi 🔑"); $("#rule").value=""; }
    if(e.target.closest("[data-t2]")){ entry.text2 = $("#t2").value.trim(); save(); toast("2. taslak kaydedildi"); }
    if(e.target.closest("[data-again]")){ stage = Math.min(4, stage+1); phase = "write"; entry = null; hint = false; draw(); window.scrollTo(0,0); }
  };
}

    el.innerHTML = `<div class="card"><div class="between"><h3 style="margin:0">1 · Shadowing</h3><span class="tag acc">${LV[w]} · ${si+1}/${sents.length}</span></div>

      <div class="row" style="margin-top:8px"><button class="btn primary" data-sfb>Claude'dan geri bildirim al</button></div></div>
     <div class="card"><h3>3 · LinguaClaude ile konuş</h3><p class="small muted" style="margin:0 0 10px">Serbest sohbet, rol yapma (kafe, mülakat, jüri…), kelime koçu ya da sınav provası. Claude mobil uygulamasında ses moduyla gerçek bir konuşma.</p><a class="btn" href="#pratik/sohbet">Sohbet modlarına git</a></div>
     ${SR ? "" : `<p class="tiny">Not: Bu tarayıcı konuşmayı yazıya çeviremiyor. Chrome, Edge ya da iPhone'da Safari dene.</p>`}`;

    };
    const frBtn = $("#fr"), frt = $("#frt"), frtx = $("#frtx"); let timer = null;

      frBtn.classList.add("live"); frBtn.innerHTML = ICON.stop; frt.textContent = "0 sn";
      timer = setInterval(()=>{ sec++; frt.textContent = sec+" sn"+(sec>=60?" · 1 dakika oldu! 🎉":""); }, 1000);
      listen(t=>{ frtx.value = (base?base+" ":"")+t; }, said=>{ clearInterval(timer); frBtn.classList.remove("live"); frBtn.innerHTML = ICON.mic; if(said) frtx.value = (base?base+" ":"")+said; }, true);
    };

      if(e.target.closest("[data-prev]")){ stopRec(); si = Math.max(0,si-1); draw(); }
      else if(e.target.closest("[data-nexts]")){ stopRec(); si = (si+1) % sents.length; if(si===0) toast("Tur tamam! Baştan bir tur daha?"); draw(); }

  };
  draw();

function pListen(el){
  const w = workOf("listening");
  const pool = [...SENT[w], ...(w>0?SENT[w-1]:[])];
  let i = 0, order = pool.map((_,k)=>k).sort(()=>Math.random()-.5).slice(0,5), score = [];
  const draw = ()=>{
    if(i>=order.length){
      const avg = Math.round(score.reduce((a,b)=>a+b,0)/score.length);
      el.innerHTML = `<div class="card soft"><h3>Dikte bitti 🎧</h3><p class="small" style="margin:0">Ortalama doğruluk: <b>%${avg}</b>. ${avg>=85?"Kulakların iyi çalışıyor!":"Kaçırdığın kelimeler genelde kısa, vurgusuz kelimeler (a, the, to, have). Bu çok normal; dinledikçe oturur."}</p></div>
      <button class="btn primary block" data-again>Yeni 5 cümle</button>`;
      if(DAYPLAN[new Date().getDay()]==="listening" && band(w)==="low"){ S.done[today()] = Object.assign({}, S.done[today()], {main:true}); save(); }
      el.onclick = e=>{ if(e.target.closest("[data-again]")){ i=0; score=[]; order = pool.map((_,k)=>k).sort(()=>Math.random()-.5).slice(0,5); draw(); } };
      return;
    }
    const s = pool[order[i]];
    el.innerHTML = `<div class="card"><div class="between"><h3 style="margin:0">Dikte</h3><span class="tag acc">${LV[w]} · ${i+1}/${order.length}</span></div>
      <p class="small muted" style="margin:6px 0 12px">Cümleyi dinle ve duyduğun gibi yaz. İstediğin kadar tekrar dinle.</p>
      <div class="row">${playBtn(s, "Cümleyi dinle")}</div>
      <textarea id="dt" rows="3" lang="en" spellcheck="false" autocapitalize="off" style="margin-top:12px" placeholder="Duyduğunu yaz…"></textarea>
      <div id="dres" class="diff" style="margin-top:10px"></div>
      <div class="row" style="margin-top:10px"><button class="btn primary" data-chk>Kontrol et</button></div></div>
      <div class="card small muted">İpucu: Önce tüm cümleyi bir kez dinle, sonra parça parça yaz. Emin olmadığın yere tahmin yaz; boş bırakmaktan iyidir.</div>`;
    setTimeout(()=>speak(s), 300);
    el.onclick = e=>{
      const b = e.target.closest("[data-chk],[data-nx]"); if(!b) return;
      if(b.hasAttribute("data-nx")){ i++; draw(); return; }
      const c = compare(s, $("#dt").value); score.push(c.pct);
      $("#dres").innerHTML = `<div class="small"><b>%${c.pct}</b></div><div lang="en" style="font-size:17px">${c.html}</div>`;
      b.outerHTML = `<button class="btn primary" data-nx>Sonraki ›</button>`;
    };
  };
  draw();
}

   <div class="row">${Sync.on() ? `<button class="btn ${Sync.needsAuth() ? "primary" : ""}" data-sync>${Sync.needsAuth() ? "Yeniden bağlan ve eşitle" : "Şimdi eşitle"}</button><button class="btn ghost" data-unsync>Bağlantıyı kes</button>` : `<button class="btn primary" data-gconnect>Google Drive'a bağlan</button>`}</div></div>
  <div class="card stack"><p class="small muted" style="margin:0">Ek güvence: ara sıra yedek dosyası indirebilirsin.</p>
   <div class="row"><button class="btn" data-exp>Yedeği indir</button><label class="btn">Yedekten yükle<input type="file" accept="application/json" data-imp hidden></label></div>
   <div class="row"><span class="small">Görünüm</span>${[["","Otomatik"],["light","Açık"],["dark","Koyu"]].map(([k,l])=>`<button class="chip" data-th="${k}" aria-pressed="${(S.settings.theme||"")===k}">${l}</button>`).join("")}</div>
   <div class="row"><span class="small">Konuşma hızı</span>${[[0.8,"Yavaş"],[0.9,"Normal"],[1,"Doğal"]].map(([k,l])=>`<button class="chip" data-rate="${k}" aria-pressed="${S.settings.rate===k}">${l}</button>`).join("")}</div>
   <button class="btn ghost" data-reset style="color:var(--warn)">Her şeyi sıfırla</button></div>`;
  m.onclick = e=>{
    if(e.target.closest("[data-exp]")){ const b = new Blob([JSON.stringify(S,null,1)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="ingilizce-yedek-"+today()+".json"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); return; }
    const th = e.target.closest("[data-th]"); if(th){ S.settings.theme = th.dataset.th; save(); applyTheme(); vMe(m); return; }
    const rt = e.target.closest("[data-rate]"); if(rt){ S.settings.rate = +rt.dataset.rate; save(); speak("This is how fast I will speak."); vMe(m); return; }
    if(e.target.closest("[data-gconnect]")){ Sync.connect(false); return; }
    if(e.target.closest("[data-sync]")){ if(Sync.needsAuth()){ saveLocal(); Sync.connect(false); } else Sync.run(); return; }
    if(e.target.closest("[data-unsync]")){ if(confirm("Bu cihazın Drive bağlantısı kesilecek. Veriler bu cihazda ve Drive'da kalır.")){ Sync.disconnect(); vMe(m); } return; }
    if(e.target.closest("[data-reset]")){ if(confirm("Tüm ilerleme, kartlar ve yazılar silinecek"+(Sync.on()?" (Drive'daki kopya dahil)":"")+". Emin misin? (Önce yedek almanı öneririm.)")){ S = fresh(); S.resetAt = Date.now(); save(); location.hash="#bugun"; render(); } }
  };
  m.querySelector("[data-imp]").onchange = ev=>{ const f = ev.target.files[0]; if(!f) return; f.text().then(t=>{ try{ const d = JSON.parse(t); if(!d || d.v!==1) throw 0; S = Object.assign(fresh(), d); S.resetAt = Date.now(); save(); applyTheme(); toast("Yedek yüklendi"); render(); }catch(err){ toast("Bu dosya bir yedek değil gibi"); } }); };
}
function applyTheme(){ const t = S.settings.theme; if(t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme"); }

/* ================= BOOT ================= */
Sync.handleRedirect();
applyTheme();
render();
Sync.start();
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
