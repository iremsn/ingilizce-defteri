  if(t==="w"){ const parts = q[1].split("___");
    body = `<div class="qs" lang="en">${parts.length>1 ? `${esc(parts[0])}<input class="slot gw" id="gw" autocomplete="off" autocapitalize="off" spellcheck="false" ${fb?"disabled":""} value="${esc(fb?fb.given:"")}" size="10">${esc(parts[1])}` : esc(q[1])+`<br><input class="f" id="gw" ${fb?"disabled":""}>`}</div>
    <p class="tiny">Boşluğu yaz, Enter'a bas.</p>`; }
  if(t==="o") body = `<div class="small muted" style="margin-top:8px">Kelimelere sırayla dokunarak cümleyi kur:</div>
    <div class="built" lang="en">${GP.built.map((x,j)=>`<button class="tok" data-un="${j}" ${fb?"disabled":""}>${esc(x.w)}</button>`).join("") || '<span class="tiny" style="padding:8px">…</span>'}</div>
    <div class="row" lang="en">${GP.pool.map(x=>`<button class="tok ${GP.built.includes(x)?"used":""}" data-tk="${x.i}" ${fb?"disabled":""}>${esc(x.w)}</button>`).join("")}</div>`;
  const done = Math.min(GP.i, total);
  m.innerHTML = `<div class="between"><button class="btn ghost" data-quit>‹ Çık</button><span class="tiny">${GP.i+1} / ${total}${GP.mode==="lesson"&&L?" · "+esc(L.t.split(":")[0]):GP.mode==="rev"?" · tekrar":""}</span></div>
  <div class="progress"><i style="width:${Math.round(100*done/total)}%"></i></div>
  ${GP.mode==="rev"&&L?`<span class="tag">${esc(L.t.split(":")[0])}</span>`:""}
  ${body}
  ${fb ? `<div class="fb ${fb.ok?"ok":"no"}"><h3>${fb.ok?"✓ Doğru!":"Doğrusu:"}</h3>${fb.ok?"":`<div lang="en" style="font-weight:600">${esc(qFull(q))}</div>`}<div class="small" style="margin-top:4px">${esc(q[4]||q[3]||"")}</div>
     <div class="row" style="margin-top:10px"><button class="btn primary" data-next>Devam →</button>${sayBtn(qFull(q))}</div></div>`
   : t!=="c" ? `<div class="row" style="margin-top:14px"><button class="btn primary" data-check>Kontrol et</button><button class="btn ghost" data-idk>Bilmiyorum</button></div>` : ""}`;

  const answer = (ok, extra)=>{
    if(!(it.k in GP.first)){ GP.first[it.k] = ok; logAdd("q"); if(ok) logAdd("qok"); }
    if(!ok && !GP.re.has(it.k)){ GP.re.add(it.k); GP.items.push(it); }
    GP.fb = Object.assign({ok}, extra||{}); saveLocal(); vGP(m);
  };
  const check = ()=>{
    if(t==="w"){ const v = ($("#gw").value||"").trim(); if(!v){ toast("Önce bir şey yaz ya da \"Bilmiyorum\" de"); return; } answer(q[2].some(a=>nrm(a)===nrm(v)), {given:v}); }
    if(t==="o"){ if(GP.built.length < GP.pool.length){ toast("Tüm kelimeleri kullan"); return; } answer(nrm(GP.built.map(x=>x.w).join(" "))===nrm(q[2])); }
  };
  if(gw) gw.onkeydown = e=>{ if(e.key==="Enter"){ e.preventDefault(); check(); } };
  m.onclick = e=>{
    if(e.target.closest("[data-quit]")){ const back = GP.mode==="syn" ? "#kelime" : GP.mode==="lesson" ? "#gramer/"+GP.lid : "#gramer"; GP = null; location.hash = back; return; }
    if(e.target.closest("[data-next]")){ GP.i++; GP.fb = null; GP.pool = null; vGP(m); return; }
    if(fb) return;
    const c = e.target.closest("[data-c]"); if(c){ const i = +c.dataset.c; answer(i===q[3], {pick:i}); return; }
    if(e.target.closest("[data-idk]")){ answer(false, {given:"", pick:-1}); return; }
    if(e.target.closest("[data-check]")){ check(); return; }
    const tk = e.target.closest("[data-tk]"); if(tk){ const x = GP.pool.find(p=>p.i===+tk.dataset.tk); if(x && !GP.built.includes(x)){ GP.built.push(x); vGP(m); } return; }
    const un = e.target.closest("[data-un]"); if(un){ GP.built.splice(+un.dataset.un, 1); vGP(m); }
  };
}
function vGPEnd(m){
  const keys = Object.keys(GP.first), ok = keys.filter(k=>GP.first[k]).length, pct = keys.length ? Math.round(100*ok/keys.length) : 0;

      if(passNow) logAdd("lessons"); }

      Object.entries(by).forEach(([id,[a,b]])=>{ const d = gr().done[id]; if(!d) return; if(a/b>=0.7){ d.step = Math.min(GR_INT.length-1, (d.step||0)+1); d.due = addDays(today(), GR_INT[d.step]); } else { d.step = 0; d.due = addDays(today(), 1); } d.date = today(); }); }

    else if(GP.mode!=="syn") { fd().gram = true; save(); }

  const msg = pct>=90 ? "Harika! Bu konu oturmuş görünüyor." : pct>=70 ? "Güzel, ders tamam. Ufak hatalar öğrenmenin parçası." : "Bu konu biraz daha zaman istiyor. Bu çok normal; formüle tekrar bak, sonra bir daha dene. Yarın da karşına çıkacak.";
  m.innerHTML = `<div style="text-align:center;padding-top:10px"><div class="big-ok" style="${pct<70?"background:var(--warn)":""}">${pct<70?"↻":ICON.check.replace('width="16" height="16"','width="40" height="40"')}</div>
   <h1>%${pct}</h1><p class="sub">${ok} / ${keys.length} soruyu ilk denemede bildin. ${msg}</p></div>
   <div class="stack">
   ${GP.mode==="lesson" ? `<a class="btn primary block" href="#cumle/${GP.lid}">Bu konuyla 3 cümle kur →</a>` : ""}
   ${pct<70 && GP.mode==="lesson" ? `<a class="btn block" href="#gramer/${GP.lid}">Dersi tekrar oku</a>` : ""}
   <button class="btn block" data-again>Tekrar çöz</button>
   <a class="btn ghost block" href="${GP.mode==="syn"?"#kelime":"#gramer"}">${GP.mode==="syn"?"Kelime'ye dön":"Gramer ana sayfası"}</a></div>`;
  const mode = GP.mode, lid = GP.lid, items = GP.items;
  m.onclick = e=>{ if(e.target.closest("[data-again]")){ if(mode==="syn") startSyn(); else startPractice(mode, lid, items); vGP(m); } };
}

/* ---------- sentence ladder: copy-change → translate → your life ---------- */
let LD = null;
function vLadder(m, id){
  const L = lessonById(id) || nextLesson() || LESSONS[0];
  if(!LD || LD.id!==L.id) LD = {id:L.id, step:0, a:["","",""], r:[null,null,null]};
  const life = lifeOf(L) || {q:"Bu konuyla kendi hayatından bir cümle yaz.", st:""};
  const mdl = L.ex[0], tra = L.ex[1] || L.ex[0];
  const words = learningWords(6);
  const rungs = [
    {n:"Değiştir", d:"Örnek cümleyi kendine göre değiştir. Yapıyı koru, sadece bir-iki kelimeyi değiştir (isim, yer, zaman…).",
     top:`<div class="card soft"><div class="between"><div><div lang="en" style="font-weight:600">${esc(mdl[0])}</div><div class="small muted">${esc(mdl[1])}</div></div>${sayBtn(mdl[0])}</div></div>`, pre: mdl[0]},
    {n:"Çevir", d:"Bu Türkçe cümleyi İngilizceye çevir. Formül aşağıda; yanlış yapmaktan korkma, doğrusunu hemen göstereceğim.",
     top:`<div class="card soft"><div style="font-weight:600">🇹🇷 ${esc(tra[1])}</div></div>`, pre:""},
    {n:"Kendi hayatın", d:life.q, top:`<div class="card soft small">Başlangıç hazır, sen devam et. Kısa olması sorun değil.</div>`, pre: life.st ? life.st+" " : ""}
  ];
  const s = LD.step;
  if(s>=3) return vLadderEnd(m, L);
  const R = rungs[s], res = LD.r[s];
  m.innerHTML = `<div class="between"><a class="btn ghost" href="${flowOn()?"#bugun":"#gramer/"+L.id}">‹ Geri</a><span class="tiny">Basamak ${s+1} / 3</span></div>
  <div class="progress"><i style="width:${Math.round(100*s/3)}%"></i></div>
  <div class="tiny">✍️ CÜMLE KUR · ${esc(L.t)}</div>
  <h1 style="font-size:26px">${s+1}. ${R.n}</h1><p class="sub">${esc(R.d)}</p>
  ${R.top}
  <textarea id="ld" rows="3" lang="en" autocapitalize="sentences" spellcheck="false" ${res?"disabled":""}>${esc(LD.a[s] || R.pre)}</textarea>
  ${s===2 && words.length && !res ? `<div class="row" style="margin-top:8px"><span class="tiny">Kartlarındaki kelimelerden birini kullanmak ister misin?</span>${words.map(w=>`<button class="chip" data-ins="${esc(w)}">${esc(w)}</button>`).join("")}</div>` : ""}
  <details class="card small" style="margin-top:10px" ${s===1?"open":""}><summary>🧮 Formül</summary>${L.f.slice(0,3).map(fx).join("")}</details>
  ${res ? `<div class="fb ${res.ok?"ok":"no"}"><h3>${esc(res.t)}</h3>${res.html?`<div lang="en" class="diff" style="margin:4px 0">${res.html}</div>`:""}<div class="small">${esc(res.note||"")}</div>
    <div class="row" style="margin-top:10px"><button class="btn primary" data-next>${s<2?"Sonraki basamak →":"Bitir →"}</button><button class="btn ghost" data-edit>Düzelt</button></div></div>`
  : `<div class="row" style="margin-top:12px"><button class="btn primary" data-check>Kontrol et</button></div>`}`;
  const ta = $("#ld"); if(ta && !res){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  m.onclick = e=>{
    const ins = e.target.closest("[data-ins]"); if(ins){ insertAt(ta, ins.dataset.ins); return; }
    if(e.target.closest("[data-edit]")){ LD.r[s] = null; vLadder(m, id); return; }

    if(!e.target.closest("[data-check]")) return;
    const v = ta.value.trim(); LD.a[s] = v;
    const nw = v.split(/\s+/).filter(Boolean).length;
    if(nw<2){ toast("Biraz daha yaz 🙂"); return; }
    let r;
    if(s===0){ const c = compare(mdl[0], v);
      r = nrm(v)===nrm(mdl[0]) ? {ok:false, t:"Aynısı kaldı", note:"Bir-iki kelimeyi kendine göre değiştir: kendi adın, şehrin, okulun, saatin…"}

        : {ok:true, t:"Farklı bir cümle olmuş, olsun", note:"Formüldeki yapıyı kullandığından emin ol. Kendi cümlen her zaman daha değerli."}; }
    if(s===1){ const c = compare(tra[0], v);
      r = {ok:c.pct>=60, html:c.html, t: c.pct>=90 ? "✓ Neredeyse birebir!" : c.pct>=60 ? "Çok yakın! Doğrusu:" : "Doğrusu bu:", note: c.pct>=90 ? "Harika." : "Yeşil kelimeler sende de var; turuncular eksik ya da farklı. Farklı ama doğru bir cümle yazmış da olabilirsin."}; }
    if(s===2){ r = nw>=4 ? {ok:true, t:"✓ Kendi hayatından bir cümle", note:"İstersen bitirince Claude'a göster; doğruluğunu ve daha doğal halini söyler."} : {ok:false, t:"Biraz daha uzat", note:"En az 4 kelime: kim, ne, nerede, ne zaman?"}; if(!r.ok){ toast(r.t); return; } }
    LD.r[s] = r; vLadder(m, id);
  };
}
function vLadderEnd(m, L){

function buildDict(){
  DICT = new Map();
  const add = (k, v)=>{ k = k.toLowerCase().replace(/\.\.\.|…|\bsth\b|\bsbd\b|\bobj\b|to do|ving|\(.*?\)/gi," ").replace(/\s+/g," ").trim(); if(k && !DICT.has(k)) DICT.set(k, v); };
  WORDS.forEach(w=>add(w[0], {tr:w[1], ex:w[2]}));
  (S.custom||[]).forEach(c=>add(c.en, {tr:c.tr, ex:c.ex}));
  if(S.pack){ (S.pack.groups||[]).forEach(g=>g.en.forEach(e=>add(e, {tr:g.tr, syn:g.en.filter(x=>x!==e).join(", ")})));
    (S.pack.phrasal||[]).forEach(([e,tr])=>add(e, {tr})); (S.pack.multi||[]).forEach(x=>add(x.en, {tr:x.tr}));
    (S.pack.reads||[]).forEach(r=>(r.gl||[]).forEach(([e,tr])=>add(e, {tr}))); }
}
function lookup(w){
  if(!DICT) buildDict();
  w = w.toLowerCase().replace(/[’]/g,"'");
  const cands = [w, w.replace(/'s$/,""), w.replace(/ies$/,"y"), w.replace(/es$/,""), w.replace(/s$/,""), w.replace(/ied$/,"y"), w.replace(/ed$/,""), w.replace(/d$/,""), w.replace(/ing$/,""), w.replace(/ing$/,"e"), w.replace(/ly$/,"")];
  for(const c of cands){ if(DICT.has(c)) return Object.assign({w:c}, DICT.get(c)); }
  return null;
}

  return esc(m[1])+`<span class="tk ${lookup(m[2])?"known":""}" data-w="${esc(m[2])}">${esc(m[2])}</span>`+esc(m[3]); }).join(""); }

/* ---------- exam vocabulary pack (imported from the user's own file, stays private) ---------- */
function packPool(){
  const P = S.pack; if(!P) return [];
  const g = (P.groups||[]).map((_,i)=>"p:g"+i), v = (P.phrasal||[]).map((_,i)=>"p:v"+i), mu = (P.multi||[]).map((_,i)=>"p:m"+i);
  const out = []; let vi = 0;
  g.forEach((id,i)=>{ out.push(id); if(i%3===2 && vi<v.length) out.push(v[vi++]); });
  return [...out, ...v.slice(vi), ...mu].filter(id=>!S.cards[id]);
}
function packNewLeft(){ return S.pack ? Math.max(0, (S.settings.packPerDay ?? 5) - (S.newOn[today()+"p"]||0)) : 0; }
function packWord(id){
  const P = S.pack; if(!P) return null; const k = id[2], n = +id.slice(3), c = S.cards[id];
  if(k==="g"){ const g = P.groups[n]; if(!g) return null; const front = g.en[((c&&c.box)||0) % g.en.length];
    return {en:front, tr:g.tr, ex:"", back: g.en.length>1 ? "Eş anlamlıları: "+g.en.filter(x=>x!==front).join(" · ") : "", lv:3, topic:"sınav · eş anlamlı"}; }
  if(k==="v"){ const p = P.phrasal[n]; return p ? {en:p[0], tr:p[1], ex:"", lv:3, topic:"sınav · phrasal verb"} : null; }
  if(k==="m"){ const x = P.multi[n]; return x ? {en:x.en, tr:x.tr, ex:"", back:"Birden fazla anlamı var: hepsini hatırlamaya çalış.", lv:3, topic:"sınav · çok anlamlı"} : null; }
  return null;
}
function startSyn(){
  const P = S.pack; const started = (P.groups||[]).map((g,i)=>({g,i})).filter(x=>x.g.en.length>1 && S.cards["p:g"+x.i]);
  const pool = started.length>=4 ? started : (P.groups||[]).map((g,i)=>({g,i})).filter(x=>x.g.en.length>1).slice(0, 20);
  const others = (P.groups||[]).flatMap(g=>g.en);
  const items = shuffle(pool).slice(0,10).map((x,j)=>{ const en = shuffle(x.g.en), a = en[0], right = en[1];
    const wrong = shuffle(others.filter(w=>!x.g.en.includes(w))).slice(0,3); const opts = shuffle([right, ...wrong]);
    return {q:["c", `"${a}" kelimesinin eş anlamlısı hangisi?`, opts, opts.indexOf(right), `${x.g.tr}: ${x.g.en.join(", ")}`], lid:"syn", k:"s"+j}; });
  GP = {mode:"syn", lid:"syn", items, i:0, first:{}, re:new Set(), fb:null, built:[], pool:null, saved:false};
}

/* ---------- pace, study time and target dates ---------- */
// Approximate cumulative guided-learning hours to reach each level (Cambridge estimates): A1, A2, B1, B2, C1
const LV_HOURS = [100, 200, 375, 550, 800];
const PACES = {
  20:{n:"Hafif", items:["Bugün akışı: Kelime → Gramer → Cümle kur"]},
  45:{n:"Dengeli", items:["Bugün akışı (18 dk)","Bonus görev: okuma, dinleme ya da konuşma (12 dk)","15 dk İngilizce altyazılı dizi ya da video"]},
  60:{n:"Kararlı", items:["Bugün akışı (18 dk)","Bonus görev (12 dk)","15 dk dizi ya da video","15 dk okuma: Pratik › Oku'dan bir Okuma Kitabı metni"]},
  90:{n:"Yoğun", items:["Bugün akışı (18 dk)","Bonus görev (12 dk)","Gramer sekmesinden 2. ders (8 dk)","20 dk kitap bölümü","30 dk dizi / podcast, sınav kelime paketi günde 12 kart"]},
  180:{n:"Kamp", items:["Bugün akışı (18 dk)","Gramer: 2–3 ders + tekrar (25 dk)","Kelime: sınav paketi günde 20 kart + eş anlamlı testi (20 dk)","Okuma: 2 metin, Pratik → Oku ya da okuma kitabı (30 dk)","Dinleme: 1 saat. Önce metne bakmadan not alarak dinle, sonra metinle tekrar dinle.","Yazma / konuşma: Claude ile 20 dk (paragraf, essay ya da sohbet)","Haftada bir: koç raporu ve deneme"]}
};
function resting(){ return !!(S.settings.rest && S.settings.rest >= today()); }
function basePace(){ return resting() ? 5 : (S.settings.pace || 45); }
function pace(){ const a = (S.done[today()]||{}).avail; return a || basePace(); }   // today's answer to "how much time do you have?" wins
function itemsFor(p){ if(p<=5) return REST_ITEMS; const k = [20,45,60,90,180].filter(x=>x<=p).pop() || 20; return PACES[k].items; }
const AVAIL = [[5,"5 dk"],[20,"20 dk"],[45,"45 dk"],[60,"1 saat"],[90,"1,5 saat"],[180,"3 saat"]];
function setPace(p){ S.settings.pace = p; if(S.pack){ S.settings.packPerDay = p>=180 ? 20 : p>=90 ? 12 : p>=45 ? 5 : 3; } save(); }
const REST_ITEMS = ["Sadece 2 dakikalık mini kartlar (5 kart). Seri bozulmaz.","Gramer, yazma ve bonus görevler bekleyebilir.","Kafan dinlenirken dizi izlersen +dk olarak ekleyebilirsin."];
function dayMin(d){ const l = (S.log||{})[d] || {};
  const est = (l.cards||0)*0.25 + (l.q||0)*0.5 + (l.sent||0)*1.5 + (l.lessons||0)*4;
  return Math.max(l.min||0, est) + (l.ext||0); }
function baseHours(){
  if(!S.levels) return 0;
  const v = ["vocab","grammar","reading","listening"].map(k=>S.levels[k] ?? -1), avg = v.reduce((a,b)=>a+b,0)/v.length;
  if(avg<0) return Math.round(100*(avg+1));
  const lo = Math.floor(avg), hi = Math.min(4, lo+1);
  return Math.round(LV_HOURS[lo] + (LV_HOURS[hi]-LV_HOURS[lo])*(avg-lo));
}
function studiedHours(){ return Object.keys(S.log||{}).reduce((s,d)=>s+dayMin(d),0)/60; }
function totalHours(){ return baseHours() + studiedHours(); }
function recentAvg(){ const t = today(); let sum = 0, active = 0, first = null;
  for(let i=0;i<14;i++){ const d = addDays(t,-i), m = dayMin(d); sum += m; if(m>0){ active++; first = i; } }
  return active>=3 ? Math.round(sum/Math.min(14, (first||0)+1)) : null; }
function eta(targetH, perDay){
  const rem = targetH - totalHours(); if(rem<=0) return "ulaştın 🎉";
  const d = new Date(addDays(today(), Math.ceil(rem*60/Math.max(5, perDay))) + "T12:00:00");
  return d.toLocaleDateString("tr-TR", {month:"long", year:"numeric"});
}
function weekMin(){ const t = today(), now = new Date(t+"T12:00:00"), mon = addDays(t, -((now.getDay()+6)%7)); let s = 0; for(let i=0;i<7;i++){ const d = addDays(mon,i); if(d>t) break; s += dayMin(d); } return Math.round(s); }
function addExt(n){ logAdd("ext", n); save(); toast(`+${n} dk eklendi`); }
// Active study time: counted in 30-second slices while the app is visible and you're interacting.
let LAST_ACT = Date.now(), ACT_TICK = 0;
["pointerdown","keydown","touchstart","scroll"].forEach(ev=>addEventListener(ev, ()=>{ LAST_ACT = Date.now(); }, {passive:true}));
setInterval(()=>{ if(S.onboarded && document.visibilityState==="visible" && Date.now()-LAST_ACT < 90000){ logAdd("min", 0.5); saveLocal(); if(++ACT_TICK % 6 === 0) save(); } }, 30000);
function paceCard(compact){

  const items = compact ? itemsFor(p) : rest ? REST_ITEMS : PACES[p].items;

/* Forecast from real history: logged minutes (empty days count as 0) + lesson speed. "Fully reached" = study hours AND that level's lessons done. */
const LVN = ["A1","A2","B1","B2","C1"];
function dateIn(days){ return new Date(addDays(today(), Math.ceil(days))+"T12:00:00").toLocaleDateString("tr-TR",{month:"long",year:"numeric"}); }
function forecast(planMin){
  const t = today(), days = []; for(let i=0;i<28;i++) days.push(dayMin(addDays(t,-i)));
  const activeIdx = days.map((x,i)=>x>0?i:-1).filter(i=>i>=0), active = activeIdx.length;
  const span = active ? Math.max(7, activeIdx[activeIdx.length-1]+1) : 28;
  const real = active>=3 ? days.slice(0,span).reduce((a,b)=>a+b,0)/span : null;
  const w1 = days.slice(0,7).reduce((a,b)=>a+b,0)/7, w2 = days.slice(7,14).reduce((a,b)=>a+b,0)/7;
  const trend = active>=5 && w2>0 ? (w1>w2*1.25 ? "up" : w1<w2*0.75 ? "down" : "flat") : null;
  const lessons28 = Object.values(gr().done).filter(d=>d.pass && d.date && d.date>addDays(t,-28)).length;
  const H = totalHours();
  const per = real!=null ? real : planMin;
  const rows = [2,3,4].map(i=>{
    const hLeft = Math.max(0, LV_HOURS[i]-H), dH = hLeft*60/Math.max(3, per);
    const lLeft = LESSONS.filter(l=>l.lv<=i && !lessonPassed(l.id)).length;
    const lRate = lessons28>=2 ? lessons28/28 : Math.max(0.15, per/60*0.5);   // lessons per day; before data: ~1 lesson per 2 h of study
    const dL = lLeft / lRate, dAll = Math.max(dH, dL);
    const planH = hLeft*60/Math.max(3, planMin), planAll = Math.max(planH, lLeft / Math.max(lRate, planMin/60*0.5));
    return {i, lv:LVN[i], hLeft, lLeft, dAll, planAll, limit: dL>dH ? "ders" : "saat", done: hLeft<=0 && lLeft===0};
  });
  return {real: real!=null ? Math.round(real) : null, active, span, trend, lessons28, H, per, planMin, rows};
}
function forecastHTML(planMin, compact){
  const F = forecast(planMin), next = F.rows.find(r=>!r.done) || F.rows[2], b2 = F.rows[1];
  const show = compact ? [...new Set([next, b2])].filter(r=>!r.done) : F.rows.filter(r=>!r.done);
  const basis = F.real!=null
    ? `Son ${F.span} günün <b>${F.active}</b> gününde çalıştın; boş günler dahil gerçek ortalaman <b>${F.real} dk/gün</b>, son 4 haftada <b>${F.lessons28}</b> ders geçtin.`
    : `Henüz 3 günlük verin yok, bu yüzden tahmin seçtiğin <b>${planMin} dk</b>'ya göre. Birkaç gün sonra gerçek verinle hesaplarım.`;
  const tr = F.trend==="up" ? " Son hafta hızlandın ↑" : F.trend==="down" ? " Son hafta yavaşladın; normal, dönemsel olur." : "";
  const line = r => { const sooner = F.real!=null && planMin > F.real*1.15 ? Math.round((r.dAll - r.planAll)/30) : 0;
    return `<div class="between" style="padding:6px 0;border-top:1px solid var(--line);align-items:flex-start;gap:8px"><span><b>${r.lv}${r.i===3?" 🎯":""}</b><span class="tiny" style="display:block">${Math.round(r.hLeft)} saat + ${r.lLeft} ders kaldı</span></span>
      <span style="text-align:right"><b>${dateIn(r.dAll)}</b>${sooner>=1?`<span class="tiny" style="display:block">her gün ${planMin>=60?(planMin/60+"").replace(".",",")+" saat":planMin+" dk"} yaparsan ≈${dateIn(r.planAll)} (${sooner} ay erken)</span>`:""}${r.limit==="ders"?`<span class="tiny" style="display:block">seni ders hızın sınırlıyor</span>`:""}</span></div>`; };
  return `<div class="stack" style="gap:6px"><div class="small"><b>📈 Böyle giderse</b></div><div class="small muted">${basis}${tr}</div>${show.map(line).join("")}
    ${compact?"":`<p class="tiny" style="margin:0">Bu tarihler bir söz ya da baskı değil, bir pusula. Her çalıştığın gün tarih biraz öne gelir. "Tam ulaşmak" = o seviyenin çalışma saatini doldurmak <b>ve</b> o seviyeye kadarki tüm gramer derslerini geçmek. Hangisi daha geç biterse tarih odur. Seviye testini 6 haftada bir tekrarlarsan başlangıç tahmini de düzelir.</p>`}</div>`;
}
function forecastText(){
  const F = forecast(S.settings.pace||45);
  return `Gerçek ortalamam ${F.real!=null?F.real+" dk/gün (son "+F.span+" günün "+F.active+" günü çalıştım)":"henüz hesaplanamadı"}, seçtiğim tempo ${S.settings.pace||45} dk/gün, toplam tahmini çalışma ${Math.round(F.H)} saat, son 4 haftada ${F.lessons28} ders geçtim. Uygulamanın tahmini: ${F.rows.filter(r=>!r.done).map(r=>`${r.lv} ≈ ${dateIn(r.dAll)} (${Math.round(r.hLeft)} saat + ${r.lLeft} ders kaldı)`).join(", ")}.`;
}

function game(){ if(!S.game){ const nl = nextLesson(), u = nl ? LESSONS.indexOf(nl)+1 : 41; S.game = {stage: u<=16?1:u<=24?2:3, week: 1, done:{}, log:[], err:[], wpm:[], rec:[], env:{}, lvd:{}, rev:{}, dice:{}, boss:{}, sc:[]}; } return S.game; }
function autoXP(){ let x = 0; Object.values(S.done||{}).forEach(d=>{ if(d && d.cards && d.gram) x += 5; }); Object.values(gr().done).forEach(d=>{ if(d.pass && (d.best||0)>=85) x += 10; }); return x; }
function gXP(){ const g = game(); let x = 50 + autoXP(); Object.values(g.done).forEach(d=>x += d.xp||0); (g.log||[]).forEach(e=>x += e.xp||0); return x + Math.floor((g.err||[]).length/5)*10; }
function gLevel(x){ let i = 0; GLV.forEach((l,k)=>{ if(x>=l[1]) i = k; }); return i; }   // 0-based
function xpOn(d){ const g = game(); let x = 0; Object.values(g.done).forEach(e=>{ if(e.d===d) x += e.xp||0; }); (g.log||[]).forEach(e=>{ if(e.d===d) x += e.xp||0; }); const dd = S.done[d]; if(dd && dd.cards && dd.gram) x += 5; return x; }

function vTest(m){
  if(!T) T = buildTest();

  const pct = Math.round(100*T.i/T.q.length);
  const head = `<div class="between"><a class="btn ghost" href="#${S.onboarded?"ben":"bugun"}" data-quit>Vazgeç</a><span class="tiny">${SK[it.sec]}</span></div><div class="progress"><i style="width:${pct}%"></i></div>`;

    m.innerHTML = head + `<h1>${esc(it.title)}</h1><p class="sub">${esc(it.text)}</p><button class="btn primary block" data-next>Başla</button>`;
  } else if(it.type==="mc"){
    m.innerHTML = head + `<div lang="en">${it.html}</div><div class="opts">${it.o.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}<button class="opt idk" data-k="-1">Bilmiyorum</button></div>

    const rows = T_SELF[it.sec].map((pair,l)=>pair.map((t,j)=>`<label class="check"><input type="checkbox" data-l="${l}" data-j="${j}"><span>${esc(t)} <span class="tag">${LV[l]}</span></span></label>`).join("")).join("");

  }

    if(e.target.closest("[data-quit]")){ T = null; return; }
    if(e.target.closest("[data-next]")){ T.i++; vTest(m); return; }
    const o = e.target.closest("[data-k]");
    if(o){ T.ans[T.i] = +o.dataset.k === it.a; T.i++; vTest(m); return; }

function finishTest(){
  const res = {};
  ["vocab","grammar","reading","listening"].forEach(sec=>{

    T.q.forEach((x,i)=>{ if(x.sec===sec && x.type==="mc"){ by[x.lv].n++; if(T.ans[i]) by[x.lv].ok++; } });
    let lv = -1;

    res[sec] = lv;

    for(let l=0;l<5;l++){ if(c.includes(l)) lv = l; else break; }
    res[sec] = lv;
  });
  S.levels = res; S.testDate = today(); S.history.push({date:today(), levels:res}); S.onboarded = true;

}

/* ================= CARDS ================= */
function wordById(id){
  if(id.startsWith("p:")) return packWord(id);
  if(id.startsWith("b:")){ const w = WORDS.find(x=>"b:"+x[0]===id); return w ? {en:w[0],tr:w[1],ex:w[2],lv:w[3],topic:w[4]} : null; }
  const c = S.custom.find(x=>x.id===id); return c ? {en:c.en,tr:c.tr,ex:c.ex||"",lv:null,topic:"benim"} : null;
}
function bulkAdd(text){
  const have = new Set([...S.custom.map(c=>c.en.toLowerCase()), ...Object.keys(S.cards).filter(k=>k.startsWith("b:")).map(k=>k.slice(2).toLowerCase())]);
  let added = 0, skipped = 0, n = Date.now();
  text.split(/\r?\n/).forEach(line=>{
    const parts = line.replace(/^\s*(?:[-•*]|\d+[.)])\s*/,"").split(/\s+[—–-]\s+|\s*\|\s*|\t/).map(s=>s.replace(/\*\*/g,"").trim()).filter(Boolean);
    if(parts.length<2) return;
    const en = parts[0], tr = parts[1], ex = parts.slice(2).join(" — ");
    if(have.has(en.toLowerCase())){ skipped++; return; }
    const id = "u:"+(n++); S.custom.push({id,en,tr,ex}); S.cards[id] = {box:0, due:today()}; have.add(en.toLowerCase()); added++;
  });
  if(added) save();
  return {added, skipped};
}
const INTERVALS = [0,1,3,7,16,35];

  const t = today();

  add.forEach(id=>{ S.cards[id] = {box:0, due:t}; });
  if(add.length){ S.newOn[t] = (S.newOn[t]||0) + add.length; save(); }
  const addP = packPool().slice(0, packNewLeft());
  addP.forEach(id=>{ S.cards[id] = {box:0, due:t}; });
  if(addP.length){ S.newOn[t+"p"] = (S.newOn[t+"p"]||0) + addP.length; add.push(...addP); save(); }
  q = [...new Set([...q, ...add])];
  if(mini) q = q.slice(0,5);
  CS = {q, show:false, total:q.length, ok:0, again:new Set()};
}

function stopRec(){ if(REC){ try{ REC.onend=null; REC.stop(); }catch(e){} REC=null; } }
function listen(onText, onEnd, continuous){
  if(!SR){ toast("Bu tarayıcı konuşmayı yazıya çeviremiyor. Chrome, Edge ya da Safari dene."); return null; }
  stopRec();
  const r = new SR(); r.lang = "en-US"; r.interimResults = true; r.continuous = !!continuous;
  let finalText = "";
  r.onresult = ev=>{ let interim=""; for(let i=ev.resultIndex;i<ev.results.length;i++){ const t=ev.results[i][0].transcript; if(ev.results[i].isFinal) finalText += t+" "; else interim += t; } onText((finalText+interim).trim(), false); };
  r.onerror = ev=>{ if(ev.error==="not-allowed") toast("Mikrofon izni gerekiyor."); };
  r.onend = ()=>{ REC=null; onEnd(finalText.trim()); };
  r.start(); REC = r; return r;
}
function vPractice(m, sub, arg){
  sub = sub || "yaz";
  const seg = `<div class="seg" role="tablist">${[["oku","Oku"],["yaz","Yaz"],["konus","Konuş"],["dinle","Dinle"],["sohbet","Sohbet"]].map(([k,l])=>`<button role="tab" aria-selected="${k===sub}" data-sub="${k}">${l}</button>`).join("")}</div>`;
  m.innerHTML = `<h1>Pratik</h1>` + seg + `<div id="pbody"></div>`;
  m.querySelector(".seg").onclick = e=>{ const b=e.target.closest("[data-sub]"); if(b) location.hash = "#pratik/"+b.dataset.sub; };
  const body = $("#pbody");
  ({oku:pRead, yaz:pWrite, konus:pSpeak, dinle:pListen, sohbet:pChat}[sub] || pWrite)(body, arg);
}
/* ---------- Writing workshop ---------- */
function wr(){ if(!S.wr) S.wr = {stage:0, done:{}, count:[0,0,0,0,0], rules:[], free:0, micro:0, sentences:0, dismissUp:0}; return S.wr; }
function defaultStage(){ const l = lvOf("writing"); return l<=0 ? 1 : l===1 ? 2 : 3; }
function curStage(){ return wr().stage || defaultStage(); }
function countSentences(t){ return (t.match(/[^.!?\n]+[.!?]*/g)||[]).filter(s=>s.trim().split(/\s+/).length>=2).length; }
function nextUnit(){
  const w = workOf("writing"), d = wr().done;
  for(let l=w; l<5; l++){ const u = UNITS.find(x=>x.lv===l && !d[x.id]); if(u) return u; }
  const atLv = UNITS.filter(x=>x.lv===w);
  return atLv.find(x=>(d[x.id]||0) < curStage()) || atLv[dayNo()%atLv.length];
}
function markWrite(){ S.done[today()] = Object.assign({}, S.done[today()], {write:true}, DAYPLAN[new Date().getDay()]==="writing" ? {main:true} : {}); }
function insertAt(ta, text){
  const s = ta.selectionStart ?? ta.value.length, e = ta.selectionEnd ?? ta.value.length;
  const before = ta.value.slice(0,s), sep = before && !/\s$/.test(before) ? " " : "";
  ta.value = before + sep + text + ta.value.slice(e);
  const pos = (before+sep+text).length; const blank = text.indexOf("___");
  ta.focus(); if(blank>=0){ ta.setSelectionRange(before.length+sep.length+blank, before.length+sep.length+blank+3); } else ta.setSelectionRange(pos,pos);
  ta.dispatchEvent(new Event("input"));
}
const wfocus = (u, stage, lv, text)=>`Ben Türkçe konuşan, İngilizceye karşı eski bir çekincesi olan bir öğrenciyim. Seviyem yaklaşık ${lv}. Aşağıdaki kısa metni bir yazma alıştırmasında yazdım.
Alıştırma: ${u.t}. Hedef kalıp: ${u.rule}
${stage<=2 ? "Not: Bir örnek metni kendime göre değiştirerek yazdım; özellikle değiştirdiğim kısımlara odaklan.\n" : ""}
Lütfen:
1) Önce iyi yaptığım 1 somut şeyi söyle.
2) Hedef kalıbı doğru kullanmış mıyım? Kısaca söyle.
3) En önemli en fazla 3 hatayı seç. Doğrusunu hemen verme: hatalı kısmı tırnak içinde göster ve Türkçe bir ipucu ver, ben kendim düzelteyim.
4) Diğer küçük hataları sayma; onlara sonra geleceğiz.
5) "BU HAFTANIN KURALI": tek cümlelik Türkçe bir kural.
6) En sonda "CEVAPLAR" başlığı altında o 3 hatanın doğrusunu yaz.
Parantez içinde Türkçe yazdığım kelimeler varsa İngilizcesini öner.

Metin:
${text}`;

function pWrite(el, arg){
  if(arg==="serbest") return wFree(el);
  const u = arg && UNITS.find(x=>x.id===arg);
  if(u) return wUnit(el, u);
  wHome(el);
}

  <div class="grid2">
    <div class="card" style="margin:0"><h3>✏️ Sadece 1 cümle</h3><div class="small muted" style="margin-bottom:8px">Hiç enerjin yoksa. Bugünü saymaya yeter.</div>

  ${first && last && first!==last ? `<details class="card"><summary><b>İlk yazın ↔ son yazın</b></summary><div class="tiny" style="margin-top:10px">${esc(first.date)}</div><pre lang="en" style="white-space:pre-wrap;font:inherit;font-size:14.5px;margin:4px 0 10px">${esc(first.text)}</pre><div class="tiny">${esc(last.date)}</div><pre lang="en" style="white-space:pre-wrap;font:inherit;font-size:14.5px;margin:4px 0 0">${esc(last.text)}</pre></details>` : ""}
  ${W.rules.length ? `<h2>Kural defterim</h2><div class="card small" style="padding:6px 18px">${W.rules.slice().reverse().map((r,i)=>`<div class="between" style="padding:8px 0;${i?"border-top:1px solid var(--line)":""}"><span>🔑 ${esc(r.text)}</span><span class="tiny">${esc(r.date)}</span></div>`).join("")}</div>` : ""}
  <h2>Tüm üniteler</h2>
  <div class="card" style="padding:4px 18px">${units}</div>
  <details class="card small"><summary><b>Bu atölye neden böyle?</b></summary>
    <ul style="margin:10px 0 0;padding-left:18px">
     <li><b>Boş sayfa yok.</b> Önce örnek metin, sonra örneği değiştirme, sonra kalıplarla yazma, en son serbest yazma. Destek sen hazır oldukça azalır.</li>
     <li><b>Az ve odaklı düzeltme.</b> Claude sadece en önemli 3 hatayı gösterir, doğrusunu hemen söylemez; ipucu verir, sen düzeltirsin. Kendi bulduğun hata daha kalıcı olur.</li>

  <h2>Yazılarım</h2>
  <div class="card" style="padding:4px 18px">${S.journal.length ? S.journal.slice().reverse().map(j=>`<details class="entry"><summary><b>${esc(j.date)}</b> · <span class="muted small">${esc(j.prompt)}${j.stage?` · ${STAGES[j.stage].n}`:""}</span></summary><pre lang="en">${esc(j.text)}</pre>${j.text2?`<hr><div class="tiny">2. taslak</div><pre lang="en">${esc(j.text2)}</pre>`:""}${j.fb?`<hr><div class="tiny">Claude'un geri bildirimi</div><pre>${esc(j.fb)}</pre>`:""}</details>`).join("") : `<p class="small muted">Henüz yazı yok. İlki en zoru; 1 cümle bile sayılır.</p>`}</div>`;
  el.onclick = e=>{

      S.journal.push({id:Date.now(), date:today(), prompt:"Tek cümle", text:t, kind:"tek cümle"}); W.micro++; W.sentences++; markWrite(); save(); toast("Kaydedildi. Bugün de yazdın ✓"); wHome(el); }
  };

function wUnit(el, u){
  const W = wr(); let stage = curStage(), showTr = false, hint = false, phase = "write", entry = null;
  const dk = ()=>KEY+":wd:"+u.id+":"+stage;
  const parts = u.model.split(/\[\[(.+?)\]\]/), plain = parts.join("");
  const slotVals = {};
  const getDraft = ()=>{ try{ return localStorage.getItem(dk()); }catch(e){ return null; } };
  const setDraft = v=>{ try{ v==null ? localStorage.removeItem(dk()) : localStorage.setItem(dk(), v); }catch(e){} };
  const frames = ()=>`<div class="tiny" style="margin:4px 0 6px">Kalıplar (dokun, yazıya eklensin; ___ yerine kendi kelimeni yaz)</div>
    <div class="row" style="margin-bottom:10px">${u.frames.map(f=>`<button class="chip" lang="en" data-fr="${esc(f)}">${esc(f)}</button>`).join("")}</div>
    <div class="tiny" style="margin:4px 0 6px">Kelime kutusu</div>
    <div class="row" style="margin-bottom:10px">${u.bank.map(b=>`<button class="chip" lang="en" data-wb="${esc(b)}">${esc(b)}</button>`).join("")}</div>`;
  const draw = ()=>{
    if(phase==="done") return drawDone();
    const modelHtml = parts.map((p,i)=> i%2 ? `<b style="color:var(--accent)">${esc(p)}</b>` : esc(p)).join("");
    let work;
    if(stage===1) work = `<div class="passage" lang="en" style="line-height:2.3">${parts.map((p,i)=> i%2 ? `<input class="slot" data-i="${i}" placeholder="${esc(p)}" value="${esc(slotVals[i]||"")}" size="${Math.max(5,p.length+1)}" autocapitalize="off" spellcheck="false">` : esc(p)).join("")}</div>
      <p class="tiny">Boş bıraktığın yerde örnekteki kelime kalır. Birkaçını değiştirmen bile yeter.</p>`;
    else if(stage===2) work = `<textarea id="wt" rows="7" lang="en" spellcheck="false">${esc(getDraft() ?? plain)}</textarea>
      <p class="tiny">Mor kelimeleri kendine göre değiştir, sonuna en az 1 cümle ekle. Bilmediğin kelimeyi (Türkçe) yazabilirsin.</p>`;
    else work = `${stage===3 || hint ? frames() : `<button class="btn ghost" data-hint>💡 İpucu: kalıpları ve kelimeleri göster</button>`}
      <textarea id="wt" rows="7" lang="en" spellcheck="false" placeholder="${stage===3 ? "Bir kalıba dokunarak başla…" : "3–5 cümle. Basit cümleler tamamen yeterli."}">${esc(getDraft() ?? "")}</textarea>
      <p class="tiny">Bilmediğin kelimeyi (Türkçe) parantez içinde yaz, sorun değil.</p>`;
    const myRules = W.rules.slice(-2).map(r=>`🔑 ${esc(r.text)}`);
    const checks = [`Kalıbı kullandım: <i>${esc(u.rule)}</i>`, u.lv<=1 ? "Cümlelerim büyük harfle başlıyor, nokta ile bitiyor" : "En az bir bağlaç kullandım (because, so, but, however…)", ...myRules];
    el.innerHTML = `<div class="between"><a class="btn ghost" href="#pratik/yaz">‹ Atölye</a><span class="tag acc">${LV[u.lv]} · ${STAGES[stage].n}</span></div>
    <h2 style="margin-top:6px">${esc(u.t)}</h2>
    <div class="card"><div class="between"><h3 style="margin:0">1 · Oku ve dinle</h3><div class="row">${playBtn(plain)}</div></div>
      <div class="passage" lang="en" style="margin-top:10px">${modelHtml}</div>
      ${u.tr ? `<button class="btn ghost small" data-tr>${showTr?"Türkçeyi gizle":"Türkçesi"}</button>${showTr?`<div class="small muted" style="margin-top:6px">${esc(u.tr)}</div>`:""}` : ""}
      <div class="small" style="margin-top:10px;padding:10px 12px;background:var(--accent-soft);border-radius:10px">🔑 <b>Kalıp:</b> ${esc(u.rule)}</div></div>
    <div class="card"><h3>2 · ${stage===1?"Kendi bilgilerinle doldur":stage===2?"Kendine göre değiştir":stage===3?"Kalıplarla kendi metnini yaz":"Kendi metnini yaz"}</h3>
      ${stage===4 ? `<p class="small" style="margin:0 0 8px"><b>${esc(u.p)}</b></p>` : stage===3 ? `<p class="small muted" style="margin:0 0 8px">${esc(u.p)}</p>` : ""}
      ${work}
      <div class="tiny" id="wc"></div>
      <div class="row" style="margin-top:6px"><button class="btn ghost small" data-easier ${stage===1?"disabled":""}>Bu zor geldi, daha çok destek</button></div></div>
    <div class="card"><h3>3 · Hızlı kontrol</h3><div class="tiny" style="margin-bottom:4px">Mükemmel olması gerekmiyor, sadece bir göz at.</div>

    el.querySelectorAll(".slot").forEach(s=>s.oninput = ()=>{ slotVals[s.dataset.i] = s.value; });
  };
  const getText = ()=> stage===1 ? parts.map((p,i)=> i%2 ? ((el.querySelector(`.slot[data-i="${i}"]`)||{}).value || "").trim() || p : p).join("") : ($("#wt") ? $("#wt").value.trim() : "");

      <button class="btn primary" data-fb>Claude'a göster</button></div>
    <div class="card"><h3>Haftanın kuralını kaydet</h3><p class="small muted" style="margin:0 0 8px">Claude'un verdiği "BU HAFTANIN KURALI"nı buraya yaz. Sonraki yazılarda kontrol listende çıkar.</p>
      <input class="f" id="rule" placeholder="Örn. He/She'den sonra fiile -s ekle"><button class="btn" data-rule style="margin-top:8px">Kural defterine ekle</button></div>
    <div class="card"><h3>2. taslak (isteğe bağlı)</h3><p class="small muted" style="margin:0 0 8px">Geri bildirimden sonra metni temize çek. Düzelterek yeniden yazmak, öğrenmenin en kalıcı kısmı.</p>
      <textarea id="t2" rows="6" lang="en" spellcheck="false">${esc(entry.text2 || entry.text)}</textarea><button class="btn" data-t2 style="margin-top:8px">2. taslağı kaydet</button></div>
    <div class="row"><a class="btn" href="#pratik/yaz">Atölyeye dön</a>${stage<4?`<button class="btn ghost" data-again>Aynı üniteyi "${STAGES[stage+1].n}" ile dene</button>`:""}</div>`;
  };
  draw();
  el.onclick = e=>{
    if(e.target.closest("[data-tr]")){ showTr = !showTr; const v = $("#wt") && $("#wt").value; draw(); if(v!=null && $("#wt")) $("#wt").value = v; return; }
    if(e.target.closest("[data-hint]")){ hint = true; draw(); return; }
    const fr = e.target.closest("[data-fr]"); if(fr && $("#wt")){ insertAt($("#wt"), fr.dataset.fr); return; }
    const wb = e.target.closest("[data-wb]"); if(wb && $("#wt")){ insertAt($("#wt"), wb.dataset.wb); return; }
    if(e.target.closest("[data-easier]")){ stage = Math.max(1, stage-1); draw(); toast("Daha çok destek: "+STAGES[stage].n); return; }
    if(e.target.closest("[data-finish]")){
      const text = getText();
      if(stage>=3 && countSentences(text)<1){ toast("En az bir cümle yaz. Bir kalıba dokunarak başlayabilirsin."); return; }
      if(stage===2 && text===plain) toast("Hiç değiştirmedin, olsun. Bir dahakine 1 kelimeyle başla 🙂");
      entry = {id:Date.now(), date:today(), prompt:u.t, text, kind:"yazma", unit:u.id, stage};
      S.journal.push(entry); W.done[u.id] = Math.max(W.done[u.id]||0, stage); W.count[stage] = (W.count[stage]||0)+1; W.sentences += countSentences(text);
      markWrite(); setDraft(null); save(); phase = "done"; draw(); window.scrollTo(0,0); return;
    }
    if(e.target.closest("[data-fb]")) bridge("Yazını Claude'a göster", wfocus(u, stage, LV[u.lv], entry.text2 || entry.text), {save:v=>{ entry.fb = v; const m = v.match(/BU HAFTANIN KURALI[^:\n]*[:\-–]\s*(.+)/i); if(m && $("#rule")) $("#rule").value = m[1].replace(/\*+/g,"").trim(); save(); }, tip:"Claude ipucu verince cevaplara bakmadan önce 2. taslakta kendin düzeltmeyi dene."});
    if(e.target.closest("[data-rule]")){ const r = $("#rule").value.trim(); if(!r){ toast("Kuralı yaz"); return; } W.rules.push({text:r, date:today()}); save(); toast("Kural defterine eklendi 🔑"); $("#rule").value=""; }

    if(e.target.closest("[data-again]")){ stage = Math.min(4, stage+1); phase = "write"; entry = null; hint = false; draw(); window.scrollTo(0,0); }
  };

function wFree(el){
  const LIMIT = 180; let left = LIMIT, timer = null, finished = false;
  el.innerHTML = `<div class="between"><a class="btn ghost" href="#pratik/yaz">‹ Atölye</a><span class="tag acc" id="ft">3:00</span></div>
  <h2 style="margin-top:6px">3 dakika serbest yazma</h2>
  <p class="small muted">Kimse okumayacak, düzeltme yok, Claude'a gitmiyor. Durmadan yaz. Takılırsan "I don't know what to write" yaz ve devam et. Bilmediğin kelimeyi Türkçe yaz. Süre ilk harfte başlar.</p>
  <div class="row" style="margin-bottom:8px">${["Today I feel…","Right now I can see…","I want to…","My favourite…"].map(s=>`<button class="chip" data-fs="${esc(s)}" lang="en">${esc(s)}</button>`).join("")}</div>
  <textarea id="fw" rows="10" lang="en" spellcheck="false" placeholder="Start here…"></textarea>
  <div id="fend"></div>`;
  const ta = $("#fw"), ft = $("#ft");
  const end = ()=>{ if(finished) return; finished = true; clearInterval(timer); ta.readOnly = true;
    const words = ta.value.trim().split(/\s+/).filter(Boolean).length;
    $("#fend").innerHTML = `<div class="card soft" style="margin-top:12px"><h3>Süre doldu ⏱️</h3><div class="small"><b>${words}</b> kelime yazdın. Kaygıya rağmen yazdın, asıl başarı bu.</div>
      <div class="row" style="margin-top:10px"><button class="btn primary" data-keep>Sakla</button><button class="btn" data-drop>Sil gitsin</button></div></div>`; };
  ta.addEventListener("input", ()=>{ if(!timer && !finished){ timer = setInterval(()=>{ left--; ft.textContent = Math.floor(left/60)+":"+String(left%60).padStart(2,"0"); if(left<=0) end(); }, 1000); } });
  el.onclick = e=>{
    const fs = e.target.closest("[data-fs]"); if(fs && !finished){ insertAt(ta, fs.dataset.fs.replace("…"," ")); return; }
    const keep = e.target.closest("[data-keep]"), drop = e.target.closest("[data-drop]");
    if(keep || drop){ const W = wr(); W.free++; markWrite();
      if(keep && ta.value.trim()) S.journal.push({id:Date.now(), date:today(), prompt:"3 dk serbest yazma", text:ta.value.trim(), kind:"serbest"});
      save(); toast(keep ? "Saklandı" : "Silindi. Yine de bugün yazdın ✓"); location.hash = "#pratik/yaz"; }
  };
}
function pSpeak(el){
  const w = workOf("speaking"), b = band(w), sents = SENT[w];
  let si = 0; const topics = S_TOPICS[b]; let ti = dayNo() % topics.length;
  const draw = ()=>{
    el.innerHTML = `<div class="card"><div class="between"><h3 style="margin:0">1 · Shadowing</h3><span class="tag acc">${LV[w]} · ${si+1}/${sents.length}</span></div>
      <p class="small muted" style="margin:6px 0 12px">Dinle, sonra mikrofona bas ve aynı ritim ve tonlamayla tekrar et. Telaffuz ve akıcılık için en etkili egzersiz.</p>
      <div class="passage" lang="en" style="font-size:19px">${esc(sents[si])}</div>
      <div class="row">${playBtn(sents[si])}</div>
      <button class="rec" id="sh" aria-label="Kaydet">${ICON.mic}</button>
      <div id="shout" class="diff small" style="text-align:center;min-height:24px"></div>
      <div class="between" style="margin-top:8px"><button class="btn ghost" data-prev ${si?"":"disabled"}>‹ Önceki</button><button class="btn" data-nexts>Sonraki ›</button></div></div>
     <div class="card"><h3>2 · Bir dakika konuş</h3>
      <div class="between"><b style="font-size:17px">${esc(topics[ti])}</b><button class="btn ghost small" data-nt>Başka konu</button></div>
      <p class="small muted" style="margin:6px 0">Mikrofona bas, durmadan 1 dakika konuş. Takılırsan "umm" de ve devam et; mükemmel olması gerekmiyor.</p>
      <button class="rec" id="fr" aria-label="Konuşmayı kaydet">${ICON.mic}</button>
      <div class="tiny" id="frt" style="text-align:center"></div>
      <textarea id="frtx" rows="4" lang="en" placeholder="Konuşman burada yazıya dökülecek. İstersen düzeltebilirsin."></textarea>
      <div class="row" style="margin-top:8px"><button class="btn primary" data-sfb>Claude'dan geri bildirim al</button></div></div>
     <div class="card"><h3>3 · LinguaClaude ile konuş</h3><p class="small muted" style="margin:0 0 10px">Serbest sohbet, rol yapma (kafe, mülakat, jüri…), kelime koçu ya da sınav provası. Claude mobil uygulamasında ses moduyla gerçek bir konuşma.</p><a class="btn" href="#pratik/sohbet">Sohbet modlarına git</a></div>
     ${SR ? "" : `<p class="tiny">Not: Bu tarayıcı konuşmayı yazıya çeviremiyor. Chrome, Edge ya da iPhone'da Safari dene.</p>`}`;
    const shBtn = $("#sh"), out = $("#shout");
    shBtn.onclick = ()=>{
      if(REC){ stopRec(); return; }
      shBtn.classList.add("live"); shBtn.innerHTML = ICON.stop; out.textContent = "Dinliyorum…";
      listen(t=>{ out.textContent = t; }, said=>{ shBtn.classList.remove("live"); shBtn.innerHTML = ICON.mic;
        if(!said){ out.textContent = "Ses duyamadım, tekrar dene."; return; }
        const c = compare(sents[si], said);
        out.innerHTML = `<div style="margin-bottom:4px"><b>%${c.pct}</b> ${c.pct>=90?"Harika! 🎉":c.pct>=70?"Çok iyi, bir kez daha?":"Altı çizili kelimeleri yavaş dinleyip tekrar dene."}</div><div lang="en">${c.html}</div><div class="tiny">Duyulan: "${esc(said)}"</div>`; }, false);
    };
    const frBtn = $("#fr"), frt = $("#frt"), frtx = $("#frtx"); let timer = null;
    frBtn.onclick = ()=>{
      if(REC){ stopRec(); return; }
      const base = frtx.value.trim(); let sec = 0;
      frBtn.classList.add("live"); frBtn.innerHTML = ICON.stop; frt.textContent = "0 sn";
      timer = setInterval(()=>{ sec++; frt.textContent = sec+" sn"+(sec>=60?" · 1 dakika oldu! 🎉":""); }, 1000);
      listen(t=>{ frtx.value = (base?base+" ":"")+t; }, said=>{ clearInterval(timer); frBtn.classList.remove("live"); frBtn.innerHTML = ICON.mic; if(said) frtx.value = (base?base+" ":"")+said; }, true);
    };
    el.onclick = e=>{
      if(e.target.closest("[data-prev]")){ stopRec(); si = Math.max(0,si-1); draw(); }
      else if(e.target.closest("[data-nexts]")){ stopRec(); si = (si+1) % sents.length; if(si===0) toast("Tur tamam! Baştan bir tur daha?"); draw(); }
      else if(e.target.closest("[data-nt]")){ stopRec(); ti = (ti+1) % topics.length; draw(); }
      else if(e.target.closest("[data-sfb]")){ const t = frtx.value.trim(); if(!t){ toast("Önce konuş ya da yaz"); return; }
        const j = {id:Date.now(), date:today(), prompt:"Konuşma: "+topics[ti], text:t, kind:"konuşma"}; S.journal.push(j);
        if(DAYPLAN[new Date().getDay()]==="speaking") S.done[today()] = Object.assign({}, S.done[today()], {main:true});
        save(); bridge("Konuşmana geri bildirim", P.speaking(topics[ti], LV[w], t), {save:v=>{ const x=S.journal.find(y=>y.id===j.id); if(x){ x.fb=v; save(); } }}); }
    };
  };
  draw();
}
function pListen(el){
  const w = workOf("listening");
  const pool = [...SENT[w], ...(w>0?SENT[w-1]:[])];
  let i = 0, order = pool.map((_,k)=>k).sort(()=>Math.random()-.5).slice(0,5), score = [];
  const draw = ()=>{
    if(i>=order.length){
      const avg = Math.round(score.reduce((a,b)=>a+b,0)/score.length);
      el.innerHTML = `<div class="card soft"><h3>Dikte bitti 🎧</h3><p class="small" style="margin:0">Ortalama doğruluk: <b>%${avg}</b>. ${avg>=85?"Kulakların iyi çalışıyor!":"Kaçırdığın kelimeler genelde kısa, vurgusuz kelimeler (a, the, to, have). Bu çok normal; dinledikçe oturur."}</p></div>
      <button class="btn primary block" data-again>Yeni 5 cümle</button>`;
      if(DAYPLAN[new Date().getDay()]==="listening" && band(w)==="low"){ S.done[today()] = Object.assign({}, S.done[today()], {main:true}); save(); }
      el.onclick = e=>{ if(e.target.closest("[data-again]")){ i=0; score=[]; order = pool.map((_,k)=>k).sort(()=>Math.random()-.5).slice(0,5); draw(); } };
      return;
    }
    const s = pool[order[i]];
    el.innerHTML = `<div class="card"><div class="between"><h3 style="margin:0">Dikte</h3><span class="tag acc">${LV[w]} · ${i+1}/${order.length}</span></div>
      <p class="small muted" style="margin:6px 0 12px">Cümleyi dinle ve duyduğun gibi yaz. İstediğin kadar tekrar dinle.</p>
      <div class="row">${playBtn(s, "Cümleyi dinle")}</div>
      <textarea id="dt" rows="3" lang="en" spellcheck="false" autocapitalize="off" style="margin-top:12px" placeholder="Duyduğunu yaz…"></textarea>
      <div id="dres" class="diff" style="margin-top:10px"></div>
      <div class="row" style="margin-top:10px"><button class="btn primary" data-chk>Kontrol et</button></div></div>
      <div class="card small muted">İpucu: Önce tüm cümleyi bir kez dinle, sonra parça parça yaz. Emin olmadığın yere tahmin yaz; boş bırakmaktan iyidir.</div>`;
    setTimeout(()=>speak(s), 300);
    el.onclick = e=>{
      const b = e.target.closest("[data-chk],[data-nx]"); if(!b) return;
      if(b.hasAttribute("data-nx")){ i++; draw(); return; }
      const c = compare(s, $("#dt").value); score.push(c.pct);
      $("#dres").innerHTML = `<div class="small"><b>%${c.pct}</b></div><div lang="en" style="font-size:17px">${c.html}</div>`;
      b.outerHTML = `<button class="btn primary" data-nx>Sonraki ›</button>`;
    };
  };
  draw();
}

/* ================= RESOURCES ================= */
let RF = {mine:true, skill:"all"};
function vRes(m){
  const ov = overall(), w = Math.min(4, ov+1);
  const list = RES.filter(r=> (!RF.mine || (w>=r.lv[0] && w<=r.lv[1])) && (RF.skill==="all" || r.s.includes(RF.skill) || (RF.skill==="exam" && r.k==="Sınav")));
  m.innerHTML = `<h1>Kaynaklar</h1><p class="sub">Hepsini yapmana gerek yok. Planın zaten bunlardan seçiyor; burası merak ettiğinde bakacağın raf.</p>
  <div class="row" style="margin-bottom:8px"><button class="chip" data-mine aria-pressed="${RF.mine}">Seviyeme uygun (${LV[w]})</button></div>
  <div class="row" style="margin-bottom:16px">${[["all","Hepsi"],...Object.entries(SK),["exam","Sınav"]].map(([k,l])=>`<button class="chip" data-sk="${k}" aria-pressed="${RF.skill===k}">${l}</button>`).join("")}</div>
  ${list.map(r=>`<div class="card res"><div class="ico">${r.i}</div><div style="flex:1;min-width:0">
    <div class="between" style="align-items:flex-start"><h3 style="margin:0">${r.u?`<a href="${r.u}" target="_blank" rel="noopener" style="color:inherit">${esc(r.n)}</a>`:esc(r.n)}</h3></div>
    <div class="row" style="gap:6px;margin-top:4px"><span class="tag">${esc(r.k)}</span><span class="tag">${LV[r.lv[0]]}–${LV[r.lv[1]]}</span>${r.f?`<span class="tag ok">Ücretsiz</span>`:""}</div>
    <p>${esc(r.d)}</p></div></div>`).join("") || `<div class="card small muted">Bu filtreyle kaynak yok.</div>`}
  <h2>Sınav hedefin varsa</h2>
  <div class="card small"><p style="margin:0 0 8px"><b>Önce B1'e kadar genel İngilizce.</b> Sınav tekniği, temel oturmadan işe yaramaz; planı izlemen sınava da hazırlık.</p>
  <p style="margin:0 0 8px"><b>Hangi sınav?</b> Yurtdışı yüksek lisans/değişim → IELTS (ya da ABD için TOEFL). Türkiye'de akademik/kamu → YDS/YÖKDİL.</p>
  <p style="margin:0">B1'e geldiğinde sınavın deneme testlerini haftada bir, Cumartesi keyif günü yerine ekleyebilirsin.</p></div>`;
  m.onclick = e=>{
    if(e.target.closest("[data-mine]")){ RF.mine = !RF.mine; vRes(m); return; }
    const s = e.target.closest("[data-sk]"); if(s){ RF.skill = s.dataset.sk; vRes(m); }
  };
}

/* ================= ME / LEVELS ================= */
function vMe(m){
  const days = Object.values(S.done).filter(d=>d.cards||d.main).length;
  const known = Object.values(S.cards).filter(c=>c.box>=4).length;
  const since = S.testDate ? Math.floor((new Date(today())-new Date(S.testDate))/864e5) : null;
  m.innerHTML = `<h1>Seviyem</h1><p class="sub">${S.testDate ? `Son ölçüm: ${new Date(S.testDate+"T12:00:00").toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"})}` : "Henüz seviye testi yapmadın."}</p>
  <div class="card">${levelRows()}<div class="tiny" style="margin-top:8px">Dolu: geçtiğin seviye · Çizgili: çalıştığın seviye</div></div>
  ${since!==null && since>=42 ? `<div class="card soft small">İlk ölçümden bu yana ${Math.floor(since/7)} hafta geçti. Testi tekrarlayıp ilerlemeni görmenin zamanı.</div>`:""}
  <a class="btn ${S.testDate?"":"primary"} block" href="#test">${S.testDate?"Seviye testini tekrarla":"Seviye testine başla"}</a>
  <h2>İlerleme</h2>
  <div class="grid2"><div class="stat"><b>${days}</b><span>çalıştığın gün</span></div><div class="stat"><b>${known}</b><span>iyi bildiğin kelime</span></div>
  <div class="stat"><b>${S.journal.length}</b><span>yazı ve konuşma</span></div><div class="stat"><b>${S.grammarDone.length}</b><span>gramer konusu</span></div></div>
  ${S.history.length>1 ? `<h2>Ölçüm geçmişi</h2><div class="card small" style="padding:6px 18px">${S.history.slice().reverse().map(h=>`<div class="between" style="padding:7px 0;border-top:1px solid var(--line)"><span>${esc(h.date)}</span><span class="muted">${Object.keys(SK).map(k=>SK[k].slice(0,3)+" "+lvName(h.levels[k])).join(" · ")}</span></div>`).join("")}</div>`:""}
  <h2>Seviyeler ne demek?</h2>
  <div class="card small" style="padding:6px 18px">
   ${[["A1","Temel kalıplar: kendini tanıtmak, basit sorular."],["A2","Günlük işleri halletmek: alışveriş, yol, kısa mesajlar."],["B1","Seyahatte rahat, deneyim anlatabilen, bağımsız kullanıcı. Çoğu staj ve değişim programı en az bunu ister."],["B2","Akıcı sohbet, fikir savunma, iş ve okulda rahat çalışma. Yurtdışı yüksek lisans genelde B2–C1 (IELTS 6.5 civarı) ister."],["C1","İncelikli, akademik ve profesyonel kullanım."]].map(([a,b],i)=>`<div style="padding:8px 0;${i?"border-top:1px solid var(--line)":""}"><b>${a}</b> <span class="muted">${b}</span></div>`).join("")}</div>
  <p class="tiny">Gerçekçi tahmin: sıfırdan B1'e yaklaşık 350–400 saat çalışma gerekir (günde 45 dk ≈ 1–1,5 yıl, kamp temposu ≈ 3–4 ay). Kendi tarihlerini Rehber'deki tempo kartında görebilirsin.</p>
  <h2>Verilerim</h2>
  <div class="card stack"><div class="between" style="align-items:flex-start"><div><h3 style="margin:0">☁️ Google Drive eşitlemesi</h3><div class="small muted" data-sync-text>${esc(Sync.text())}</div></div></div>
   <p class="small muted" style="margin:0">İlerlemen kendi Google Drive'ında, sadece bu uygulamanın görebildiği gizli bir klasörde saklanır. Telefonda ve bilgisayarda aynı Google hesabıyla bağlan; ikisi de aynı verileri görür. Bir cihazda internet yoksa, bağlanınca kendiliğinden eşitlenir.</p>
   <div class="row">${Sync.on() ? `<button class="btn" data-sync>Şimdi eşitle</button><button class="btn ghost" data-unsync>Bağlantıyı kes</button>` : `<button class="btn primary" data-gconnect>Google Drive'a bağlan</button>`}</div></div>
  <div class="card stack"><p class="small muted" style="margin:0">Ek güvence: ara sıra yedek dosyası indirebilirsin.</p>
   <div class="row"><button class="btn" data-exp>Yedeği indir</button><label class="btn">Yedekten yükle<input type="file" accept="application/json" data-imp hidden></label></div>
   <div class="row"><span class="small">Görünüm</span>${[["","Otomatik"],["light","Açık"],["dark","Koyu"]].map(([k,l])=>`<button class="chip" data-th="${k}" aria-pressed="${(S.settings.theme||"")===k}">${l}</button>`).join("")}</div>
   <div class="row"><span class="small">Konuşma hızı</span>${[[0.8,"Yavaş"],[0.9,"Normal"],[1,"Doğal"]].map(([k,l])=>`<button class="chip" data-rate="${k}" aria-pressed="${S.settings.rate===k}">${l}</button>`).join("")}</div>
   <button class="btn ghost" data-reset style="color:var(--warn)">Her şeyi sıfırla</button></div>`;
  m.onclick = e=>{
    if(e.target.closest("[data-exp]")){ const b = new Blob([JSON.stringify(S,null,1)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="ingilizce-yedek-"+today()+".json"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); return; }
    const th = e.target.closest("[data-th]"); if(th){ S.settings.theme = th.dataset.th; save(); applyTheme(); vMe(m); return; }
    const rt = e.target.closest("[data-rate]"); if(rt){ S.settings.rate = +rt.dataset.rate; save(); speak("This is how fast I will speak."); vMe(m); return; }
    if(e.target.closest("[data-gconnect]")){ Sync.connect(false); return; }
    if(e.target.closest("[data-sync]")){ Sync.run(); return; }
    if(e.target.closest("[data-unsync]")){ if(confirm("Bu cihazın Drive bağlantısı kesilecek. Veriler bu cihazda ve Drive'da kalır.")){ Sync.disconnect(); vMe(m); } return; }
    if(e.target.closest("[data-reset]")){ if(confirm("Tüm ilerleme, kartlar ve yazılar silinecek"+(Sync.on()?" (Drive'daki kopya dahil)":"")+". Emin misin? (Önce yedek almanı öneririm.)")){ S = fresh(); S.resetAt = Date.now(); save(); location.hash="#bugun"; render(); } }
  };
  m.querySelector("[data-imp]").onchange = ev=>{ const f = ev.target.files[0]; if(!f) return; f.text().then(t=>{ try{ const d = JSON.parse(t); if(!d || d.v!==1) throw 0; S = Object.assign(fresh(), d); S.resetAt = Date.now(); save(); applyTheme(); toast("Yedek yüklendi"); render(); }catch(err){ toast("Bu dosya bir yedek değil gibi"); } }); };
}
function applyTheme(){ const t = S.settings.theme; if(t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme"); }

/* ================= BOOT ================= */
Sync.handleRedirect();
applyTheme();
render();
Sync.start();
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
