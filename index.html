<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>İngilizce Defteri</title>
<meta name="description" content="Seviye testi, günlük 15 dakikalık plan, kelime kartları ve pratik.">
<meta name="theme-color" content="#F5F2FA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="İngilizce">
<style>
:root{
  --bg:#F5F2FA; --surface:#FFFFFF; --raised:#FFFFFF; --ink:#1E1A24; --ink-2:#6C6577; --ink-3:#8F889A;
  --line:#ECE6F4; --line-2:#D9D0E6; --accent:#8944D9; --accent-ink:#FFFFFF; --accent-soft:#F1E8FC;
  --fill:rgba(124,92,168,.12); --fill-2:rgba(124,92,168,.07); --glass:rgba(250,247,253,.82);
  --ok:#248A3D; --ok-soft:#E5F4E9; --warn:#B35A00; --warn-soft:#FDF0E1;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.06);
  --r-card:16px; --r-ctl:10px;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-d:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI Variable Display","Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C0A10; --surface:#1C1922; --raised:#2A2632; --ink:#F6F3FA; --ink-2:#B3ABBF; --ink-3:#8F889A;
  --line:#37323F; --line-2:#474151; --accent:#9B51E0; --accent-soft:#2C1F42;
  --fill:rgba(150,120,190,.22); --fill-2:rgba(150,120,190,.13); --glass:rgba(28,25,34,.82);
  --ok:#30D158; --ok-soft:#163220; --warn:#FF9F0A; --warn-soft:#3A2A10;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0A10; --surface:#1C1922; --raised:#2A2632; --ink:#F6F3FA; --ink-2:#B3ABBF; --ink-3:#8F889A;
  --line:#37323F; --line-2:#474151; --accent:#9B51E0; --accent-soft:#2C1F42;
  --fill:rgba(150,120,190,.22); --fill-2:rgba(150,120,190,.13); --glass:rgba(28,25,34,.82);
  --ok:#30D158; --ok-soft:#163220; --warn:#FF9F0A; --warn-soft:#3A2A10;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
.app{max-width:720px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom,0px))}
h1{font:700 32px/1.15 var(--f-d);letter-spacing:-.01em;margin:8px 0 4px}
h2{font:700 21px/1.25 var(--f-d);margin:28px 0 10px}
h3{font:600 17px/1.3 var(--f-d);margin:0 0 6px}
.sub{color:var(--ink-2);margin:0 0 18px}
.muted{color:var(--ink-2)} .small{font-size:13.5px} .tiny{font-size:12px;color:var(--ink-3)}
.card{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);padding:16px 18px;margin:0 0 12px}
.card.soft{background:var(--accent-soft);box-shadow:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stack>*+*{margin-top:10px}
.btn{border:0;border-radius:var(--r-ctl);padding:10px 16px;background:var(--fill);color:var(--accent);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;line-height:1.2;min-height:40px;white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;padding-left:8px;padding-right:8px}
.btn.block{width:100%;justify-content:center;min-height:48px;font-size:17px}
.btn:disabled{opacity:.45;cursor:default}
.chip{border:0;border-radius:999px;padding:6px 12px;background:var(--fill-2);color:var(--ink-2);font-size:13.5px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);color:#fff}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:600;background:var(--fill-2);color:var(--ink-2)}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.seg{display:flex;background:var(--fill-2);border-radius:10px;padding:3px;margin:0 0 16px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 6px;font-weight:600;color:var(--ink-2);cursor:pointer;font-size:14.5px}
.seg button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
textarea,input.f{width:100%;border:0;background:var(--fill-2);border-radius:var(--r-ctl);padding:11px 13px;font-size:16px;resize:vertical}
textarea:focus,input.f:focus{outline:0;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent);background:var(--surface)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);padding:6px 8px max(8px,env(safe-area-inset-bottom))}
.tabbar nav{max-width:560px;margin:0 auto;display:flex}
.tabbar .nextbar,.tabbar a.nextbar{display:flex;flex-direction:row;align-items:center;gap:10px;max-width:560px;margin:0 auto 6px;padding:11px 14px;border-radius:14px;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;font-size:14px;line-height:1.3;flex:none}
.tabbar .nextbar.here{background:var(--bg);color:var(--ink);border:1px solid var(--line);font-weight:500;font-size:13px}
.tabbar .nextbar.here a{display:inline;color:var(--accent);font-size:13px;padding:0;flex:none}
body.hasnext .app{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.tabbar a{flex:1;text-decoration:none;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;padding:4px 0}
.tabbar a svg{width:24px;height:24px}
.tabbar a[aria-current=page]{color:var(--accent)}
/* levels */
.lvl{display:grid;grid-template-columns:84px 1fr 54px;gap:10px;align-items:center;padding:7px 0}
.lvl+.lvl{border-top:1px solid var(--line)}
.lvl .bars{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.lvl .bars i{height:10px;border-radius:5px;background:var(--fill)}
.lvl .bars i.on{background:var(--accent)}
.lvl .bars i.work{background:repeating-linear-gradient(45deg,var(--accent) 0 3px,transparent 3px 6px);opacity:.55}
.lvl b{font:600 15px var(--f-d);text-align:right}
/* test */
.progress{height:6px;background:var(--fill);border-radius:3px;overflow:hidden;margin:6px 0 18px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.opt{border:0;text-align:left;background:var(--surface);box-shadow:var(--shadow);border-radius:12px;padding:13px 16px;cursor:pointer;font-size:16px}
.opt:hover{box-shadow:0 0 0 2px var(--accent)}
.opt.idk{background:transparent;box-shadow:none;color:var(--ink-2);text-align:center}
.qword{font:700 30px/1.2 var(--f-d);margin:6px 0}
.passage{background:var(--surface);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);font-size:15.5px;line-height:1.6;margin-bottom:10px}
.check{display:flex;gap:12px;align-items:flex-start;padding:11px 0;cursor:pointer}
.check+.check{border-top:1px solid var(--line)}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin-top:1px}
/* today */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week div{font-size:11px;color:var(--ink-3);font-weight:600}
.week span{display:block;margin:4px auto 0;width:30px;height:30px;border-radius:50%;background:var(--fill-2);line-height:30px;font-size:13px;color:var(--ink-2)}
.week span.done{background:var(--accent);color:#fff}
.week span.today{box-shadow:0 0 0 2px var(--accent)}
.task{display:flex;gap:14px;align-items:flex-start}
.task .tick{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line-2);background:transparent;cursor:pointer;display:grid;place-items:center;color:#fff;margin-top:2px}
.task .tick.on{background:var(--accent);border-color:var(--accent)}
.task .body{flex:1;min-width:0}
.task ol{margin:8px 0 10px;padding-left:20px}
.task ol li{margin:3px 0}
/* cards */
.flash{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:34px 20px;text-align:center;min-height:240px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.flash .w{font:700 34px/1.15 var(--f-d)}
.flash .ex{color:var(--ink-2);font-style:italic}
.flash .tr{font:600 22px var(--f-d);color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px}
.stat b{display:block;font:700 24px var(--f-d)}
.stat span{font-size:12.5px;color:var(--ink-2)}
/* practice */
.diff span{padding:1px 2px;border-radius:4px}
.diff .miss{background:var(--warn-soft);color:var(--warn);text-decoration:underline wavy}
.diff .hit{color:var(--ok)}
.rec{width:72px;height:72px;border-radius:50%;border:0;background:var(--accent);color:#fff;cursor:pointer;display:grid;place-items:center;margin:8px auto}
.rec.live{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 50%,transparent)}100%{box-shadow:0 0 0 18px transparent}}
.entry{border-top:1px solid var(--line);padding:10px 0}
.entry:first-child{border-top:0}
summary{cursor:pointer}
.slot{border:0;border-bottom:2px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:6px 6px 0 0;padding:2px 6px;margin:0 2px;font:inherit;font-weight:600;max-width:100%}
.slot::placeholder{color:var(--ink-3);font-weight:400}
.slot:focus{outline:0;background:var(--surface);box-shadow:0 0 0 2px var(--accent)}
.grid2>.card h3{font-size:16px}
@media (max-width:520px){.grid2:has(>.card){grid-template-columns:1fr}}
.entry pre{white-space:pre-wrap;font:inherit;margin:6px 0 0;font-size:14.5px}
/* resources */
.res{display:flex;gap:12px;align-items:flex-start}
.res .ico{flex:none;width:38px;height:38px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center;font-size:19px}
.res p{margin:3px 0 0;font-size:14px;color:var(--ink-2)}
/* modal */
.ov{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.32);display:flex;align-items:flex-end;justify-content:center;padding:12px}
@media (min-width:700px){.ov{align-items:center}}
.modal{background:var(--surface);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:min(560px,100%);max-height:calc(100dvh - 24px);overflow:auto;padding:18px 20px}
.modal ol{padding-left:20px;margin:10px 0}
.modal ol li{margin:0 0 14px}
.modal textarea.q{font:12.5px/1.45 ui-monospace,"SF Mono",Menlo,Consolas,monospace;min-height:120px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:99;box-shadow:var(--shadow)}
.why{display:grid;gap:10px;margin:18px 0}
.why .card{display:flex;gap:14px;align-items:flex-start;margin:0}
.why .n{flex:none;font-size:24px}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
/* course */
.btn.sm{min-height:32px;padding:6px 10px;font-size:14px}
.fxr{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:7px 0}
.fxr+.fxr{border-top:1px solid var(--line)}
.fx{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:3px 9px;font-weight:600;font-size:14.5px}
.fxp{color:var(--ink-3);font-weight:700}
.fxl{font-size:13px;color:var(--ink-2);margin-right:2px}
.sec{display:flex;align-items:center;gap:8px;margin:22px 0 8px;font:700 17px/1.3 var(--f-d)}
.sec .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px}
.trap .x{color:var(--ink-3);text-decoration:line-through}
.trap .v{color:var(--ok);font-weight:600}
.trap>div+div{border-top:1px solid var(--line)}
.qs{font:600 21px/1.5 var(--f-d);margin:12px 0 4px}
.blank{display:inline-block;min-width:56px;border-bottom:2px solid var(--accent);color:transparent;line-height:1}
.slot.gw{font-size:19px;min-width:90px}
.opt.ok{box-shadow:0 0 0 2px var(--ok);background:var(--ok-soft)}
.opt.no{box-shadow:0 0 0 2px var(--warn);background:var(--warn-soft)}
.opt:disabled{cursor:default;color:inherit}
.fb{border-radius:14px;padding:14px 16px;margin-top:14px}
.fb.ok{background:var(--ok-soft)} .fb.no{background:var(--warn-soft)}
.fb h3{margin:0 0 4px}
.tok{border:0;border-radius:10px;padding:8px 12px;background:var(--surface);box-shadow:var(--shadow);font-size:16px;cursor:pointer;color:var(--ink)}
.tok.used{opacity:.25;pointer-events:none}
.built{min-height:56px;border-radius:12px;background:var(--fill-2);padding:8px;display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px;align-items:center}
.built .tok{background:var(--accent);color:#fff}
.lrow{display:flex;gap:10px;align-items:center;padding:10px 0;text-decoration:none;color:inherit}
.lrow+.lrow{border-top:1px solid var(--line)}
.lrow .st{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--fill-2);font-size:12px;color:var(--ink-2);font-weight:600}
.lrow .st.on{background:var(--accent);color:#fff}
.lrow .st.due{background:var(--warn-soft);color:var(--warn)}
details.card>summary{list-style:none}
details.card>summary::-webkit-details-marker{display:none}
.steps{margin-top:6px}
.steps .sr{display:flex;gap:12px;align-items:center;padding:11px 0}
.steps .sr+.sr{border-top:1px solid var(--line)}
.steps .dot{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--fill-2);color:var(--ink-2);font-weight:700}
.steps .dot.on{background:var(--accent);color:#fff}
.steps .sr.cur .dot{box-shadow:0 0 0 2px var(--accent)}
.big-ok{width:84px;height:84px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;margin:24px auto 10px;font-size:34px}
.bar{height:8px;background:var(--fill);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
@keyframes fillbar{from{width:0}to{width:100%}}
.bar.auto i{width:0;animation:fillbar 2.7s linear forwards}
.reader{font-size:18px;line-height:1.95}
.tk{cursor:pointer;border-radius:4px;padding:0 1px}
.tk:hover{background:var(--fill-2)}
.tk.known{text-decoration:underline dotted color-mix(in srgb,var(--accent) 70%,transparent);text-underline-offset:4px}
.tk.sel{background:var(--accent);color:#fff;text-decoration:none}
.dock{position:sticky;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 8px 30px rgba(0,0,0,.18)}
.road{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;text-align:center}
.road b{display:block;font:700 15px var(--f-d);margin-top:6px}
.road span{font-size:11px;color:var(--ink-3)}
.road .cur b{color:var(--accent)}
@media (prefers-reduced-motion:reduce){.bar.auto i{animation:none;width:100%}}
@media (max-width:420px){h1{font-size:28px}.lvl{grid-template-columns:72px 1fr 46px}}
</style>
</head>

<script>
"use strict";
/* ================= DATA ================= */
const LV = ["A1","A2","B1","B2","C1"];
const SK = {vocab:"Kelime", grammar:"Gramer", reading:"Okuma", listening:"Dinleme", writing:"Yazma", speaking:"Konuşma"};

// [level, word, options, correctIndex]
const T_VOCAB = [
 [0,"apple",["armut","elma","ekmek","anahtar"],1],[0,"kitchen",["mutfak","bahçe","oda","kapı"],0],
 [0,"tired",["mutlu","aç","yorgun","hasta"],2],[0,"buy",["satmak","satın almak","taşımak","beklemek"],1],
 [1,"borrow",["ödünç almak","ödünç vermek","kaybetmek","saklamak"],0],[1,"journey",["gazete","yolculuk","toplantı","günlük"],1],
 [1,"careful",["dikkatsiz","sakin","dikkatli","bakımlı"],2],[1,"improve",["kanıtlamak","geliştirmek","korumak","ithal etmek"],1],
 [2,"avoid",["kaçınmak","onaylamak","ulaşmak","karar vermek"],0],[2,"reliable",["esnek","pahalı","güvenilir","kırılgan"],2],
 [2,"purpose",["sonuç","amaç","teklif","süreç"],1],[2,"achieve",["başarmak","kabul etmek","vazgeçmek","tahmin etmek"],0],
 [3,"feasible",["uygulanabilir","görünür","esnek","makul fiyatlı"],0],[3,"cumbersome",["kullanışlı","hantal","kırılgan","şık"],1],
 [3,"undermine",["desteklemek","altını çizmek","baltalamak","yeraltına inmek"],2],[3,"thorough",["yüzeysel","kapsamlı ve titiz","içinden geçen","hızlı"],1],

const T_GRAM = [

];
const T_READ = [
 {lv:0,text:"Hi, I'm Ece. I am a student. I study design at university. I get up at seven every day. I drink tea and I walk to school. I like drawing chairs and lamps.",
  qs:[["Ece ne okuyor?",["Mimarlık","Tasarım","Resim","Mühendislik"],1],["Okula nasıl gidiyor?",["Otobüsle","Bisikletle","Yürüyerek","Arabayla"],2]]},
 {lv:1,text:"Last weekend Mert visited a small furniture museum in his city. He didn't want to go at first because it was raining, but his friend Selin convinced him. In the museum, he saw chairs from the 1950s. His favourite was a simple wooden chair with three legs. After the visit, they had lunch in a café near the museum.",
  qs:[["Mert neden başta gitmek istemedi?",["Yorgundu","Yağmur yağıyordu","Müze kapalıydı","Selin gelmiyordu"],1],["En çok hangi parçayı sevdi?",["Metal bir masa","1950'lerden bir lamba","Üç bacaklı ahşap bir sandalye","Plastik bir koltuk"],2]]},
 {lv:2,text:"Many students think that a good designer must be good at drawing. Drawing helps, of course, but it is not the most important skill. Good designers spend a lot of time observing how people actually use things. They notice small problems — a handle that is hard to hold, a button that is easy to press by mistake — and they ask why. Sketching is simply a way of thinking about these problems quickly.",
  qs:[["Metne göre en önemli beceri hangisi?",["İyi çizim yapmak","İnsanların nesneleri nasıl kullandığını gözlemlemek","Hızlı çalışmak","Bilgisayar programlarını bilmek"],1],["Metne göre eskiz nedir?",["Sunum için güzel bir görsel","Problemler üzerine hızlıca düşünmenin bir yolu","Zaman kaybı","Sadece yeteneklilerin işi"],1]]},
 {lv:3,text:"Although sustainable materials are often presented as the solution to the environmental impact of products, the reality is more nuanced. A bamboo toothbrush shipped across the world may have a larger carbon footprint than a plastic one produced locally. Designers are therefore increasingly encouraged to consider a product's entire life cycle — from extraction and manufacturing to use and disposal — rather than focusing on a single 'green' feature.",
  qs:[["Bambu diş fırçası örneği neyi gösteriyor?",["Bambunun her zaman en iyi malzeme olduğunu","Malzeme tek başına sürdürülebilirliği garanti etmez","Plastiğin yasaklanması gerektiğini","Yerel üretimin pahalı olduğunu"],1],["Tasarımcılardan ne yapmaları isteniyor?",["Sadece geri dönüştürülebilir malzeme kullanmaları","Ürünün tüm yaşam döngüsünü düşünmeleri","Daha ucuz ürünler yapmaları","Taşımacılığı tamamen bırakmaları"],1]]},
 {lv:4,text:"The notion that form should follow function, long treated as an unassailable maxim, has come under scrutiny from those who argue that function itself is far from self-evident. What a product is 'for' is shaped by cultural expectations, emotional attachments and the rituals that surround its use; a teapot, after all, does rather more than dispense tea. Critics contend that, by reducing function to mere utility, the maxim inadvertently licenses an impoverished understanding of what people value in objects.",
  qs:[["Eleştirmenlere göre asıl sorun ne?",["Biçimin işlevden daha önemli olması","'İşlev' kavramının sanıldığı kadar açık olmaması ve sadece faydaya indirgenmesi","Çaydanlıkların kötü tasarlanması","İlkenin çok yeni olması"],1],["Çaydanlık örneği neyi anlatıyor?",["Çaydanlıkların pahalı olduğunu","Nesnelerin kültürel ve duygusal anlamları da olduğunu","Çay kültürünün kaybolduğunu","Biçimin önemsiz olduğunu"],1]]}

  f:["Düzenli: fiil + ed → work → worked","Düzensiz: go → went · make → made · see → saw · have → had","Olumsuz: didn't + yalın fiil","Soru: Did + özne + yalın fiil?","be: I / he / she → was · you / we / they → were"],
  ex:[["I finished my model yesterday.","Maketimi dün bitirdim."],["We went to Antalya last summer.","Geçen yaz Antalya'ya gittik."],["She didn't come to class.","Derse gelmedi."],["Did you see the exhibition?","Sergiyi gördün mü?"]],
  trap:[["I didn't went.","I didn't go.","didn't'ten sonra yalın fiil"],["Yesterday I go to school.","Yesterday I went to school.","Geçmiş zaman → fiil de geçmiş"]],
  q:[["c","Last week, I ___ a new book.",["buy","bought","buyed"],1,"buy → bought (düzensiz)"],["c","___ you call her yesterday?",["Do","Did","Were"],1,"Geçmiş soru → Did"],["w","She ___ a film last night. (watch)",["watched"],"Düzenli → -ed"],["w","We ___ out on Saturday. (not / go)",["didn't go","did not go"],"didn't + yalın fiil"],["w","I ___ tired yesterday. (be)",["was"],"I → was"],["c","They ___ at home last night.",["was","were"],1,"they → were"],["o","did / when / arrive / you","When did you arrive","Soru kelimesi + did + özne + fiil"],["o","made / I / sketches / three","I made three sketches","Özne + V2 + nesne"]]},
 {id:"a2-pc",lv:1,t:"Present Continuous (şimdiki zaman)",why:"Şu an olan ya da bu aralar süren şeyler: \"Şu an çalışıyorum.\" Türkçedeki -yor eki.",
  f:["Özne + am / is / are + fiil-ing","Olumsuz: am not / isn't / aren't + fiil-ing","Soru: Am / Is / Are + özne + fiil-ing?","Genel alışkanlık → Present Simple · Şu an → Continuous"],
  ex:[["I'm working on a new project.","Yeni bir proje üzerinde çalışıyorum."],["She is talking on the phone.","Telefonla konuşuyor."],["What are you doing?","Ne yapıyorsun?"],["It isn't raining now.","Şu an yağmur yağmıyor."]],
  trap:[["I working now.","I am working now.","am / is / are atlanmaz"],["I am go to school every day.","I go to school every day.","Her gün = alışkanlık → Present Simple"]],
  q:[["c","Look! It ___.",["rains","is raining","rain"],1,"Şu an → is raining"],["c","I usually ___ tea, but today I'm drinking coffee.",["drink","am drinking"],0,"usually = alışkanlık"],["w","They ___ football right now. (play)",["are playing","'re playing"],"they → are + -ing"],["w","She ___. (not / listen)",["isn't listening","is not listening"],"isn't + -ing"],["c","___ you studying?",["Do","Are","Is"],1,"you → Are"],["o","are / what / doing / you","What are you doing","What + are + özne + -ing"]]},
 {id:"a2-comp",lv:1,t:"Karşılaştırma: -er / more / the most",why:"\"Daha büyük\", \"en büyük\" demek için. Kısa sıfatlar ek alır, uzun sıfatların önüne more / the most gelir.",
  f:["Kısa: big → bigger → the biggest","Uzun: comfortable → more comfortable → the most comfortable","Düzensiz: good → better → the best · bad → worse → the worst","\"-den daha\" → than: A is cheaper than B"],
  ex:[["This chair is lighter than that one.","Bu sandalye şundan daha hafif."],["It's the most comfortable sofa in the shop.","Mağazadaki en rahat koltuk."],["My sketches are better now.","Eskizlerim artık daha iyi."],["Istanbul is bigger than Ankara.","İstanbul Ankara'dan büyük."]],
  trap:[["more cheap","cheaper","Kısa sıfatlarda -er"],["bigger from","bigger than","\"-den daha\" → than"]],
  q:[["c","Plastic is ___ than wood.",["cheap","cheaper","cheapest"],1,"Karşılaştırma → cheaper than"],["c","This is ___ design in the exhibition.",["the most interesting","more interesting","interestinger"],0,"En → the most + uzun sıfat"],["w","My new laptop is ___ than the old one. (good)",["better"],"good → better"],["w","It was ___ day of my life. (bad)",["the worst"],"bad → the worst"],["w","This lamp is ___ than that one. (expensive)",["more expensive"],"Uzun sıfat → more"],["o","than / is / heavier / steel / plastic","Steel is heavier than plastic","A + is + -er + than + B"]]},
 {id:"a2-fut",lv:1,t:"going to / will",why:"going to: önceden kararlaştırılmış plan. will: o an verilen karar, söz ya da tahmin.",
  f:["Plan: am / is / are + going to + fiil","Anlık karar, söz: will + fiil","Tahmin: I think it will rain.","Olumsuz: won't (will not)"],
  ex:[["I'm going to visit my grandmother this weekend.","Bu hafta sonu babaannemi ziyaret edeceğim (planlı)."],["The phone is ringing. — I'll answer it!","Telefon çalıyor. — Ben açarım!"],["I think you'll love this film.","Bence bu filmi seveceksin."],["I won't be late.","Geç kalmayacağım."]],
  trap:[["I will to call you.","I will call you.","will'den sonra to yok"],["I going to study.","I'm going to study.","am / is / are atlanmaz"]],
  q:[["c","I've decided. I ___ study abroad next year.",["will","am going to"],1,"Önceden karar → going to"],["c","It's cold. — I ___ close the window.",["'ll","am going to"],0,"O an karar → will"],["w","She ___ a new phone. (going to / buy)",["is going to buy","'s going to buy"],"is + going to + fiil"],["w","Don't worry, I ___ tell anyone. (will, olumsuz)",["won't","will not"],"will not → won't"],["o","going / are / to / what / do / you","What are you going to do","What + are + you + going to + fiil"]]},
 {id:"a2-pp",lv:1,t:"Present Perfect'e giriş",why:"Zamanı söylenmeyen deneyimler ve sonucu şimdi önemli olan olaylar: \"Hiç İtalya'ya gittin mi?\", \"Ödevimi bitirdim.\"",
  f:["Özne + have / has + V3 (fiilin 3. hali)","he / she / it → has","ever (hiç) · never (asla) · just (az önce) · already (zaten) · yet (henüz)","Belli zaman varsa Past Simple: I went there in 2022."],
  ex:[["I have finished my homework.","Ödevimi bitirdim."],["Have you ever been to Italy?","Hiç İtalya'ya gittin mi?"],["She has never tried sushi.","Hiç suşi denemedi."],["I've just arrived.","Az önce geldim."]],
  trap:[["I have seen him yesterday.","I saw him yesterday.","yesterday gibi belli zaman → Past Simple"],["She have finished.","She has finished.","she → has"]],
  q:[["c","___ you ever eaten Japanese food?",["Did","Have","Has"],1,"Deneyim, you → Have"],["c","He ___ already left.",["have","has","is"],1,"he → has"],["w","I have never ___ to London. (be)",["been"],"be → been (V3)"],["w","We have just ___ the model. (finish)",["finished"],"finish → finished"],["c","I ___ him last week.",["have seen","saw"],1,"last week → Past Simple"],["o","you / have / finished / yet","Have you finished yet","Have + özne + V3 + yet"]]},
 {id:"a2-count",lv:1,t:"some / any / much / many",why:"Sayılabilen (chair, idea) ve sayılamayan (water, money, information) isimler farklı kelimelerle kullanılır.",
  f:["Sayılabilen çoğul: many · a few","Sayılamayan: much · a little","Olumlu: some · Olumsuz ve soru: any","a lot of: ikisiyle de olur"],
  ex:[["I don't have much time.","Çok vaktim yok."],["There are many students.","Çok öğrenci var."],["Can I have some water?","Biraz su alabilir miyim?"],["Do you have any questions?","Sorunuz var mı?"]],
  trap:[["informations","information","information sayılamaz, -s almaz"],["How many money?","How much money?","money sayılamaz → much"]],
  q:[["c","How ___ people came?",["much","many"],1,"people sayılabilir → many"],["c","I need ___ advice.",["an","some","many"],1,"advice sayılamaz → some"],["c","We don't have ___ milk.",["some","any"],1,"Olumsuz → any"],["w","How ___ time do we have?",["much"],"time sayılamaz → much"],["c","There are ___ chairs in the room.",["a little","a few"],1,"Sayılabilir → a few"],["o","any / do / have / you / questions","Do you have any questions","Soru → any"]]},
 {id:"a2-prep",lv:1,t:"in / on / at",why:"Büyükten küçüğe düşün: in (ay, yıl, şehir, iç) → on (gün, tarih, yüzey) → at (saat, nokta).",
  f:["Zaman: in June · in 2025 · on Monday · on 5 May · at 7 o'clock · at night","Yer: in Ankara · in the room · on the table · on the wall · at the bus stop · at school"],
  ex:[["The class starts at 9.","Ders 9'da başlıyor."],["My birthday is in March.","Doğum günüm martta."],["See you on Friday!","Cuma görüşürüz!"],["The lamp is on the desk.","Lamba masanın üstünde."]],
  trap:[["in Monday","on Monday","Günlerle on"],["at the morning","in the morning","Sabah / öğleden sonra → in the (ama at night)"]],
  q:[["c","I was born ___ 2003.",["in","on","at"],0,"Yıl → in"],["c","The meeting is ___ Tuesday.",["in","on","at"],1,"Gün → on"],["c","I'll meet you ___ 6 pm.",["in","on","at"],2,"Saat → at"],["w","The poster is ___ the wall.",["on"],"Yüzey → on"],["w","She lives ___ İzmir.",["in"],"Şehir → in"],["w","I study ___ night.",["at"],"at night"],["o","at / see / you / eight","See you at eight","Saat → at"]]},
 {id:"a2-freq",lv:1,t:"always, usually, sometimes, never",why:"Ne sıklıkla: always (her zaman) > usually (genelde) > often (sık) > sometimes (bazen) > rarely (nadiren) > never (asla).",
  f:["Normal fiilden önce: I usually walk.","be'den sonra: She is always late.","Sormak için: How often ...?"],
  ex:[["I always have breakfast.","Her zaman kahvaltı yaparım."],["He is never on time.","Asla zamanında gelmez."],["We sometimes cook together.","Bazen birlikte yemek yaparız."],["How often do you draw?","Ne sıklıkla çizim yaparsın?"]],
  trap:[["I go always to the gym.","I always go to the gym.","Zarf fiilden önce"],["She always is busy.","She is always busy.","be'den sonra"]],
  q:[["c","Hangisi doğru?",["I usually get up at 7.","I get usually up at 7."],0,"Zarf fiilden önce"],["c","Hangisi doğru?",["He is often tired.","He often is tired."],0,"be'den sonra"],["w","___ often do you exercise?",["how"],"How often"],["o","never / I / coffee / drink","I never drink coffee","Özne + zarf + fiil"],["o","always / she / late / is","She is always late","Özne + is + zarf"],["c","never ne demek?",["asla","bazen","sık sık"],0,"never = asla"]]},
 {id:"b1-ppps",lv:2,t:"Present Perfect mi, Past Simple mı?",why:"Ne zaman olduğu önemliyse Past Simple, sonucu ya da deneyimi önemliyse Present Perfect. \"-den beri\" ve \"-dır\" (süre) Türkçede şimdiki zamanla söylenir ama İngilizcede Present Perfect ister.",
  f:["Past Simple: yesterday · last year · in 2020 · ago · When ...?","Present Perfect: ever · never · just · already · yet · so far","for + süre (for 3 years) · since + başlangıç (since 2022)"],
  ex:[["I've lived here for two years.","İki yıldır burada yaşıyorum."],["I moved here two years ago.","İki yıl önce buraya taşındım."],["Have you finished the report? — Yes, I finished it this morning.","Raporu bitirdin mi? — Evet, bu sabah bitirdim."],["She has worked here since 2023.","2023'ten beri burada çalışıyor."]],
  trap:[["I live here since 2020.","I have lived here since 2020.","\"-den beri\" → Present Perfect"],["I have finished it two days ago.","I finished it two days ago.","ago → Past Simple"]],
  q:[["c","I ___ to Rome in 2022.",["have been","went"],1,"in 2022 → Past Simple"],["c","We ___ each other for ten years.",["know","have known","knew"],1,"for + süre, hâlâ devam → have known"],["c","She has worked here ___ 2021.",["for","since","ago"],1,"Başlangıç → since"],["w","I've studied English ___ five years.",["for"],"Süre → for"],["c","___ you ever ___ a 3D printer?",["Did / use","Have / used"],1,"ever → Have + V3"],["w","He ___ an hour ago. (leave)",["left"],"ago → Past Simple"],["o","have / how / long / known / you / her","How long have you known her","How long + have + özne + V3"]]},
 {id:"b1-pastc",lv:2,t:"Past Continuous",why:"Geçmişte belli bir anda devam etmekte olan eylem: \"Sen aradığında çalışıyordum.\"",
  f:["was / were + fiil-ing","Uzun eylem (Past Continuous) + when + kısa eylem (Past Simple)","while + uzun eylem"],
  ex:[["I was working when you called.","Aradığında çalışıyordum."],["While we were walking, it started to rain.","Yürürken yağmur başladı."],["What were you doing at 8?","Saat 8'de ne yapıyordun?"],["They weren't listening.","Dinlemiyorlardı."]],
  trap:[["When I was sleeping, the phone was ringing.","When I was sleeping, the phone rang.","Kısa, ani eylem → Past Simple"],["I was knowing the answer.","I knew the answer.","know, like, want -ing almaz"]],
  q:[["c","I ___ TV when the lights went out.",["watched","was watching"],1,"Uzun eylem → was watching"],["c","She ___ her phone while she was walking.",["dropped","was dropping"],0,"Kısa eylem → dropped"],["w","What ___ you doing at 10 last night?",["were"],"you → were"],["w","We ___. (not / sleep)",["weren't sleeping","were not sleeping"],"weren't + -ing"],["o","was / I / cooking / when / arrived / he","I was cooking when he arrived","Uzun + when + kısa"]]},
 {id:"b1-cond",lv:2,t:"If cümleleri (1. ve 2. tip)",why:"1. tip: gerçek, olası durum (Yağmur yağarsa evde kalırız). 2. tip: hayali ya da düşük ihtimalli durum (Param olsaydı dünyayı gezerdim).",
  f:["1. tip: If + present simple, will + fiil","2. tip: If + past simple, would + fiil","2. tipte be: If I were you ...","if'li kısımda will / would kullanılmaz"],
  ex:[["If it rains, we'll stay at home.","Yağmur yağarsa evde kalırız."],["If I had more time, I would learn Japanese.","Daha çok vaktim olsa Japonca öğrenirdim."],["If I were you, I'd apply.","Yerinde olsam başvururdum."],["What would you do if you won the lottery?","Piyangoyu kazansan ne yapardın?"]],
  trap:[["If I will see him, I'll tell him.","If I see him, I'll tell him.","if'li kısımda will yok"],["If I would have money ...","If I had money ...","if'li kısımda would yok"]],
  q:[["c","If she ___ late, we'll start without her.",["is","will be"],0,"if + present simple"],["c","If I ___ rich, I'd travel the world.",["am","were","will be"],1,"Hayali → were"],["w","If I see him, I ___ tell him.",["will","'ll"],"1. tip → will"],["w","If I had a car, I ___ drive to school.",["would","'d"],"2. tip → would"],["c","Hangisi hayali bir durum?",["If it rains, I'll stay home.","If I lived in Paris, I'd walk everywhere."],1,"Past + would = hayali"],["o","were / if / I / you","If I were you","If I were you (yerinde olsam)"]]},
 {id:"b1-pass",lv:2,t:"Passive (edilgen)",why:"Eylemi kimin yaptığı önemli değilse: \"Bu sandalye İtalya'da yapıldı.\" Türkçedeki -ıl, -ın ekleri.",
  f:["Şimdi: am / is / are + V3 → It is made in Turkey.","Geçmiş: was / were + V3 → It was designed in 1958.","Yapan kişi: by → designed by Arne Jacobsen"],
  ex:[["The lamps are made by hand.","Lambalar elle yapılıyor."],["This chair was designed in 1958.","Bu sandalye 1958'de tasarlandı."],["The results were announced yesterday.","Sonuçlar dün açıklandı."],["English is spoken here.","Burada İngilizce konuşulur."]],
  trap:[["It made in Italy.","It is made in Italy.","be fiili atlanmaz"],["The house was build in 1990.","The house was built in 1990.","V3 (built) gerekir"]],
  q:[["c","These phones ___ in China.",["make","are made","made"],1,"Edilgen → are made"],["c","The bridge ___ in 1973.",["was built","built","is build"],0,"Geçmiş edilgen → was built"],["w","The emails ___ yesterday. (send)",["were sent"],"were + V3"],["w","Coffee ___ in Brazil. (grow)",["is grown"],"is + V3"],["c","The tower was designed ___ Gustave Eiffel.",["from","by","with"],1,"Yapan → by"],["o","was / when / built / it","When was it built","When + was + özne + V3"]]},
 {id:"b1-used",lv:2,t:"used to / be used to",why:"used to + fiil: eskiden yapardım (artık değil). be used to + -ing: bir şeye alışkın olmak.",
  f:["used to + fiil → I used to play the piano.","didn't use to + fiil","be used to + fiil-ing → I'm used to working late.","get used to: alışmak (süreç)"],
  ex:[["I used to hate English.","Eskiden İngilizceden nefret ederdim."],["She didn't use to drink coffee.","Eskiden kahve içmezdi."],["I'm used to getting up early.","Erken kalkmaya alışkınım."],["You'll get used to it.","Alışırsın."]],
  trap:[["I am used to get up early.","I am used to getting up early.","be used to + -ing"],["I use to play football.","I used to play football.","Geçmiş alışkanlık → used"]],
  q:[["c","When I was a child, I ___ climb trees.",["used to","am used to"],0,"Eskiden → used to"],["c","I'm used to ___ in noisy places.",["work","working"],1,"be used to + -ing"],["w","She ___ to live in Bursa, but now she lives in Ankara.",["used"],"used to"],["c","It's hard now, but you'll ___ used to it.",["be","get"],1,"Alışmak (süreç) → get used to"],["o","used / I / to / hate / English","I used to hate English","Özne + used to + fiil"]]},
 {id:"b1-rep",lv:2,t:"Dolaylı anlatım (Reported Speech)",why:"Birinin söylediğini aktarmak: \"Yorgun olduğunu söyledi.\" Zaman genelde bir adım geriye gider.",
  f:["\"I am tired.\" → She said (that) she was tired.","present → past · will → would · can → could","Soru: He asked where I lived. (soru düzeni yok)","say something · tell someone something"],
  ex:[["He said he was busy.","Meşgul olduğunu söyledi."],["She told me she would call.","Bana arayacağını söyledi."],["They asked if I could help.","Yardım edip edemeyeceğimi sordular."],["He asked where the station was.","İstasyonun nerede olduğunu sordu."]],
  trap:[["She said me that ...","She told me that ...","say me değil, tell me"],["He asked where was the station.","He asked where the station was.","Aktarılan soruda düz cümle sırası"]],
  q:[["c","\"I'm hungry.\" → She said she ___ hungry.",["is","was"],1,"am → was"],["c","\"I will help.\" → He said he ___ help.",["will","would"],1,"will → would"],["c","She ___ me she was leaving.",["said","told"],1,"tell + kişi"],["w","\"I can swim.\" → He said he ___ swim.",["could"],"can → could"],["o","asked / she / I / where / lived","She asked where I lived","asked + where + özne + fiil"]]},
 {id:"b1-rel",lv:2,t:"who / which / that / where",why:"İki cümleyi birleştirip bir ismi tanımlamak: \"Bana yardım eden kadın\" = the woman who helped me. Türkçedeki -en, -dığı ekleri.",
  f:["who → insanlar","which → nesneler, hayvanlar","that → ikisi için (gündelik dil)","where → yerler"],
  ex:[["The designer who made this chair is Danish.","Bu sandalyeyi yapan tasarımcı Danimarkalı."],["The lamp which I bought is broken.","Aldığım lamba bozuk."],["This is the café where we met.","Bu, tanıştığımız kafe."],["I have a friend that lives in Berlin.","Berlin'de yaşayan bir arkadaşım var."]],
  trap:[["The man which called you","The man who called you","İnsan → who"],["The book who I read","The book which I read","Nesne → which / that"]],
  q:[["c","The girl ___ sits next to me is from İzmir.",["which","who","where"],1,"İnsan → who"],["c","This is the phone ___ I want.",["who","which","where"],1,"Nesne → which"],["c","That's the school ___ I studied.",["which","where","who"],1,"Yer → where"],["w","I met a man ___ speaks six languages.",["who","that"],"İnsan → who / that"],["o","who / the / man / called / you","The man who called you","İsim + who + fiil"]]},
 {id:"b1-modal",lv:2,t:"must / have to / should",why:"must, have to: zorunluluk. should: tavsiye. mustn't: yasak. don't have to: gerek yok. Son ikisi çok karıştırılır.",
  f:["must + fiil (kural, kişisel karar)","have to + fiil (dış zorunluluk) · geçmişi had to","should + fiil (tavsiye)","mustn't = yasak · don't have to = gerek yok"],
  ex:[["I have to submit the project on Friday.","Projeyi cuma teslim etmem gerekiyor."],["You should sleep more.","Daha çok uyumalısın."],["You mustn't smoke here.","Burada sigara içmek yasak."],["You don't have to come.","Gelmek zorunda değilsin."]],
  trap:[["You must to go.","You must go.","must'tan sonra to yok"],["You mustn't come. (gerek yok anlamında)","You don't have to come.","mustn't = yasak"]],
  q:[["c","It's free. You ___ pay.",["mustn't","don't have to"],1,"Gerek yok → don't have to"],["c","You look tired. You ___ rest.",["should","mustn't"],0,"Tavsiye → should"],["c","Yesterday I ___ work late.",["must","had to"],1,"Geçmiş → had to"],["w","You ___ touch the models. (yasak)",["mustn't","must not"],"Yasak → mustn't"],["w","She ___ to wear a uniform at work.",["has"],"she → has to"],["o","should / you / a / doctor / see","You should see a doctor","Özne + should + fiil"]]},
 {id:"b2-tense",lv:3,t:"Zamanların büyük resmi: Past Perfect ve Perfect Continuous",why:"Sınavda en çok sorulan konu. Geçmişte iki olay varsa önce olanı had + V3 ile gösterirsin. Süreyi vurgulamak için have been + -ing kullanırsın. İpucu kelimelere bak: by the time, before, for, since, so far.",
  f:["Past Perfect: had + V3 → geçmişteki bir andan ÖNCE","Present Perfect Continuous: have / has been + V-ing → geçmişten şimdiye süren","Past Perfect Continuous: had been + V-ing","Future Perfect: will have + V3 → gelecekte bir ana kadar bitmiş","by the time + past → had V3 · by the time + present → will have V3"],
  ex:[["When I arrived, the film had already started.","Vardığımda film çoktan başlamıştı."],["I've been studying for three hours.","Üç saattir ders çalışıyorum."],["By the time you come, I will have finished.","Sen gelene kadar bitirmiş olacağım."],["She was tired because she had been working all day.","Yorgundu çünkü bütün gün çalışıyordu."]],
  trap:[["When I arrived, the film already started.","When I arrived, the film had already started.","Önce olan olay → had V3"],["I am studying here since 2022.","I have been studying here since 2022.","since / for → perfect"]],
  q:[["c","By the time we got to the station, the train ___.",["left","had left","has left"],1,"by the time + past → had V3"],["c","She ___ English for five years, and she still loves it.",["has been learning","had learnt","learns"],0,"Hâlâ devam → have been V-ing"],["c","By 2030, scientists ___ a cure.",["will find","will have found","have found"],1,"By + gelecek → will have V3"],["w","I was hungry because I ___ breakfast. (not / have)",["hadn't had","had not had"],"Önceki olay → hadn't had"],["c","Hangisi \"Bu sabahtan beri yağmur yağıyor\"?",["It is raining since this morning.","It has been raining since this morning."],1,"since → has been V-ing"],["c","By the time she ___, we will have eaten.",["arrives","will arrive","arrived"],0,"by the time + present (gelecek anlamı)"]],
  life:{s:[["I had never seen snow before I moved to Erzurum.","Erzurum'a taşınmadan önce hiç kar görmemiştim."],["I've been waiting for the bus for twenty minutes!","Yirmi dakikadır otobüs bekliyorum!"]],q:"Ne zamandır bir şey yapıyorsun? (I have been …ing for …)",st:"I have been"}},
 {id:"b2-pass",lv:3,t:"Passive: ileri seviye",why:"Akademik metinlerin çoğu edilgendir. Sınavın sevdiği üç kural var. Nesne almayan fiiller (happen, occur, die, rise, emerge) edilgen olmaz. Modal fiiller \"be + V3\" alır. \"It is believed that…\" kalıbı restatement'ta çok çıkar.",
  f:["Modal: can / must / should + be + V3","Perfect: has been V3 · had been V3","Continuous: is being V3","Nesnesiz fiiller passive olmaz: happen, occur, die, rise, emerge","It is said that S V = S is said to V (geçmiş: to have V3)"],
  ex:[["The project must be finished by Friday.","Proje cumaya kadar bitirilmeli."],["The bridge is being repaired.","Köprü tamir ediliyor."],["She was given an award.","Ona bir ödül verildi."],["Coffee is believed to reduce stress.","Kahvenin stresi azalttığına inanılıyor."]],
  trap:[["The accident was happened at night.","The accident happened at night.","happen nesne almaz → passive yok"],["It must finish today.","It must be finished today.","modal + be + V3"]],
  q:[["c","The results ___ next week.",["will announce","will be announced","are announcing"],1,"Gelecek passive → will be V3"],["c","An earthquake ___ in the region last night.",["occurred","was occurred"],0,"occur passive olmaz"],["c","The new library ___ at the moment.",["is building","is being built","builds"],1,"Şu an + passive → is being V3"],["w","This form must ___ in ink. (complete)",["be completed"],"must + be + V3"],["c","\"It is thought that the painting is fake.\" Anlamca en yakın:",["The painting is thought to be fake.","The painting thinks it is fake.","People painted it fake."],0,"It is thought that = S is thought to"],["c","The man is said ___ the money years ago.",["to steal","to have stolen","stealing"],1,"Geçmiş olay → to have V3"]],
  life:{s:[["My bike was stolen last week!","Bisikletim geçen hafta çalındı!"],["Our flat is being painted, so I'm staying with a friend.","Dairemiz boyanıyor, o yüzden bir arkadaşımda kalıyorum."]],q:"Başına gelen bir şeyi edilgen anlat (çalındı, iptal edildi, tamir edildi…).",st:"Last month my"}},
 {id:"b2-rel",lv:3,t:"Relative clauses: whose, in which, where",why:"Uzun akademik cümleler relative clause ile kurulur. Sınavda whose, \"edat + which\", virgüllü cümleler ve that'in kullanılamadığı yerler sorulur.",
  f:["whose + isim → sahiplik: the man whose car …","edat + which / whom: the city in which I live","when → zaman · where → yer · why → sebep","Virgüllü (ek bilgi): who / which → that KULLANILMAZ","which = önceki cümlenin tamamı: He passed, which surprised us."],
  ex:[["The designer whose chair won the prize is only 25.","Sandalyesi ödülü kazanan tasarımcı sadece 25 yaşında."],["This is the room in which the meeting took place.","Bu, toplantının yapıldığı oda."],["I remember the day when we met.","Tanıştığımız günü hatırlıyorum."],["My sister, who lives in Berlin, is visiting us.","Berlin'de yaşayan kız kardeşim bizi ziyaret ediyor."]],
  trap:[["The man who his car was stolen","The man whose car was stolen","Sahiplik → whose"],["Istanbul, that is a huge city, …","Istanbul, which is a huge city, …","Virgülden sonra that olmaz"]],
  q:[["c","The student ___ project was chosen will go to Milan.",["who","whose","which"],1,"Sahiplik → whose"],["c","This is the house ___ I grew up.",["which","where","whose"],1,"Yer → where"],["c","The company ___ she works is very big.",["for which","which","for that"],0,"work for → for which"],["c","My father, ___ is a doctor, works at night.",["that","who","whose"],1,"Virgüllü → who (that olmaz)"],["w","She missed the bus, ___ made her late for class.",["which"],"Önceki cümlenin tamamı → which"],["o","I / remember / the / day / when / we / met","I remember the day when we met","… the day + when + cümle"]],
  life:{s:[["I have a neighbour whose dog barks all night.","Köpeği bütün gece havlayan bir komşum var."],["That's the café where I study every weekend.","Orası her hafta sonu ders çalıştığım kafe."]],q:"Çevrendeki birini whose ile, bir yeri where ile tanımla.",st:"I have a friend whose"}},
 {id:"b2-red",lv:3,t:"Kısaltılmış cümleler: -ing ve V3",why:"Okuma parçalarında çok sık geçer: \"the students living here\" (burada yaşayan öğrenciler), \"a book written in 1900\" (1900'de yazılmış bir kitap). Etken anlam V-ing, edilgen anlam V3 olur. Bunu tanımak uzun cümleleri anlamanın anahtarı.",
  f:["who / which + etken fiil → V-ing: people living in cities","who / which + is / was + V3 → V3: a car made in Italy","Zaman bağlacından sonra: after finishing · before leaving · while walking","Önce olan / sebep: Having finished my work, I went out."],
  ex:[["The woman sitting next to me was very kind.","Yanımda oturan kadın çok kibardı."],["The cars produced in this factory are exported.","Bu fabrikada üretilen arabalar ihraç ediliyor."],["After graduating, she moved to London.","Mezun olduktan sonra Londra'ya taşındı."],["Having lost my keys, I couldn't get in.","Anahtarlarımı kaybettiğim için içeri giremedim."]],
  trap:[["The book writing in 1900","The book written in 1900","Kitap yazılır → edilgen → V3"],["People live in cities are busy.","People living in cities are busy.","Kısaltma → V-ing (ya da who live)"]],
  q:[["c","The man ___ to the manager is my uncle.",["talking","talked","talks"],0,"Etken → V-ing"],["c","Most of the toys ___ in China are cheap.",["making","made","make"],1,"Edilgen → V3"],["c","___ the report, she sent it to her boss.",["Finished","Having finished","Finish"],1,"Önce bitirdi → Having V3"],["w","Before ___ the house, check the windows. (leave)",["leaving"],"before + V-ing"],["c","\"The students who were chosen for the trip were excited.\" Kısa hali:",["The students choosing for the trip …","The students chosen for the trip …"],1,"were chosen → chosen"]],
  life:{s:[["The guy sitting behind me in class never stops talking.","Derste arkamda oturan çocuk hiç susmuyor."],["After finishing work, I usually go for a walk.","İşi bitirdikten sonra genelde yürüyüşe çıkarım."]],q:"Akşam rutinini after + -ing ile anlat.",st:"After finishing"}},
 {id:"b2-caus",lv:3,t:"Ettirgen: have / get / make / let",why:"Bir işi başkasına yaptırmak için kullanılır: \"Saçımı kestirdim\" = I had my hair cut. Türkçedeki -dır / -tir eki gibi. Sınavda yapı sorulur: kime yaptırıyorsun, ne yaptırıyorsun?",
  f:["have + kişi + yalın fiil: I had the mechanic check the car.","get + kişi + to + fiil: I got him to help me.","have / get + nesne + V3: I had my phone repaired.","make + kişi + yalın fiil (zorlamak) · let + kişi + yalın fiil (izin)","help + kişi + (to) fiil"],
  ex:[["I had my hair cut yesterday.","Dün saçımı kestirdim."],["She got her brother to carry the boxes.","Kutuları erkek kardeşine taşıttı."],["My parents never let me stay out late.","Ailem geç saate kadar dışarıda kalmama izin vermezdi."],["The teacher made us rewrite the essay.","Öğretmen bize essay'i yeniden yazdırdı."]],
  trap:[["I cut my hair at the hairdresser.","I had my hair cut at the hairdresser.","Kendin kesmediysen → have + nesne + V3"],["She made me to wait.","She made me wait.","make + yalın fiil (to yok)"]],
  q:[["c","I'm going to have my car ___ tomorrow.",["wash","washed","washing"],1,"have + nesne + V3"],["c","My boss made me ___ late.",["stay","to stay","staying"],0,"make + yalın fiil"],["c","I finally got him ___ the truth.",["tell","to tell","told"],1,"get + kişi + to"],["w","Will you let me ___ your laptop? (use)",["use"],"let + yalın fiil"],["c","\"Bir terziye elbisemi diktirdim.\"",["I had a tailor make my dress.","I made my dress a tailor.","I had my dress make."],0,"have + kişi + yalın fiil"]],
  life:{s:[["I need to get my phone screen fixed.","Telefonumun ekranını tamir ettirmem lazım."],["My mum makes me call her every night.","Annem her akşam onu aramamı istiyor."]],q:"Son zamanlarda bir şey yaptırdın mı (saç, tamir, temizlik)?",st:"Last week I had my"}},
 {id:"b2-conj",lv:3,t:"Bağlaçlar: because / because of / although / despite",why:"Sınavda en çok puan getiren konulardan biri. Kural basit: arkasından cümle mi (özne + fiil), isim mi geliyor? because, although ve while'dan sonra cümle gelir. because of, due to, despite ve in spite of'tan sonra isim ya da V-ing gelir.",
  f:["Sebep + cümle: because · as · since · now that","Sebep + isim: because of · due to · owing to · on account of","Zıtlık + cümle: although · even though · though · while · whereas","Zıtlık + isim / V-ing: despite · in spite of","Amaç: so that + cümle · in order to / so as to + fiil"],
  ex:[["We stayed in because it was raining.","Yağmur yağdığı için içeride kaldık."],["We stayed in because of the rain.","Yağmur yüzünden içeride kaldık."],["Although she was tired, she finished the model.","Yorgun olmasına rağmen maketi bitirdi."],["Despite being tired, she finished the model.","Yorgunluğuna rağmen maketi bitirdi."]],
  trap:[["Despite it was raining, we went out.","Although it was raining, we went out.","despite + isim; cümle için although"],["Because of he was ill …","Because he was ill …","Cümle → because"]],
  q:[["c","___ the heavy traffic, I was late.",["Because","Because of","Although"],1,"İsim → because of"],["c","___ he studied hard, he failed the exam.",["Despite","Although","Due to"],1,"Zıtlık + cümle → although"],["c","She went to work ___ feeling sick.",["although","despite","because"],1,"V-ing → despite"],["c","I'm saving money ___ I can travel next summer.",["so that","in order to","because of"],0,"Amaç + cümle → so that"],["w","He left early in ___ to catch the train.",["order"],"in order to + fiil"],["c","\"Even though it was expensive, she bought it.\" En yakın anlam:",["She bought it because it was expensive.","Despite the high price, she bought it.","She didn't buy it as it was expensive."],1,"even though = despite"]],
  life:{s:[["I couldn't sleep because of the noise upstairs.","Üst kattaki gürültü yüzünden uyuyamadım."],["Although I was tired, I went to the gym.","Yorgun olmama rağmen spora gittim."]],q:"Bugün bir zorluğa rağmen yaptığın bir şeyi anlat.",st:"Although I was"}},
 {id:"b2-trans",lv:3,t:"Geçiş kelimeleri: however, therefore, moreover",why:"Bu kelimeler essay'in ve okuma sorularının iskeletidir. İki cümleyi mantıkla bağlarlar ve genelde noktadan ya da noktalı virgülden sonra gelirler: \"… . However, …\" Anlamlarını gruplar halinde öğren.",
  f:["Zıtlık: however · nevertheless · on the other hand","Sonuç: therefore · thus · as a result · consequently","Ekleme: moreover · furthermore · in addition · besides","Örnek: for example · for instance","Kalıp: Cümle. However, cümle. · Cümle; therefore, cümle."],
  ex:[["The flat is small. However, it is very bright.","Daire küçük. Ancak çok aydınlık."],["He didn't study. Therefore, he failed.","Çalışmadı. Bu yüzden kaldı."],["Cycling is cheap. Moreover, it is healthy.","Bisiklet ucuz. Üstelik sağlıklı."],["Some materials, for example bamboo, grow fast.","Bazı malzemeler, örneğin bambu, hızlı büyür."]],
  trap:[["However it is expensive, I like it.","It is expensive. However, I like it.","however iki cümlenin arasında, ardından virgül"],["moreover = ancak","moreover = üstelik","moreover ekleme yapar, zıtlık değil"]],
  q:[["c","The test was hard. ___, most students passed.",["Therefore","However","Moreover"],1,"Zıtlık → However"],["c","It was raining heavily; ___, the match was cancelled.",["therefore","however","for example"],0,"Sonuç → therefore"],["c","This phone is cheap. ___, it has a great camera.",["Nevertheless","Furthermore","Consequently"],1,"Ekleme → Furthermore"],["c","Hangisi \"sonuç olarak\" anlamında?",["moreover","as a result","nevertheless"],1,"as a result = sonuç olarak"],["c","She is talented. ___, she is lazy.",["On the other hand","In addition","Thus"],0,"Zıtlık → On the other hand"]],
  life:{s:[["My new job is far from home. However, the salary is good.","Yeni işim evden uzak. Ancak maaşı iyi."],["I missed the bus. As a result, I was late for class.","Otobüsü kaçırdım. Sonuç olarak derse geç kaldım."]],q:"Yaşadığın şehrin bir iyi, bir kötü yanını However ile anlat.",st:"My city is"}},
 {id:"b2-noun",lv:3,t:"Noun clauses: that / whether / what",why:"Bir cümle başka bir cümlenin içinde isim gibi kullanılır: \"Ne dediğini anlamadım\" = I didn't understand what you said. En önemli kural: içteki soru düz cümle sırasıyla yazılır.",
  f:["that + cümle: I think (that) she is right.","whether / if + cümle (-ıp -madığı): I don't know whether he will come.","soru kelimesi + özne + fiil: I don't know where she lives.","Özne olarak: What he said surprised me. · The fact that …"],
  ex:[["I don't know what you mean.","Ne demek istediğini anlamıyorum."],["Can you tell me where the station is?","İstasyonun nerede olduğunu söyler misiniz?"],["I wonder whether she got my message.","Mesajımı alıp almadığını merak ediyorum."],["What surprised me was his calm voice.","Beni şaşırtan şey sakin sesiydi."]],
  trap:[["I don't know where does she live.","I don't know where she lives.","İçteki soru düz cümle sırasıyla"],["Can you tell me what time is it?","Can you tell me what time it is?","Düz sıra: it is"]],
  q:[["c","Do you know where ___?",["is the bank","the bank is"],1,"Düz sıra → the bank is"],["c","I'm not sure ___ I'll have time.",["whether","what","that"],0,"-ıp -madığı → whether"],["c","___ she said made everyone laugh.",["That","What","Whether"],1,"Söylediği şey → What"],["w","I can't remember ___ I put my keys. (nereye)",["where"],"Yer → where"],["o","I / don't / know / what / it / means","I don't know what it means","… what + özne + fiil"],["c","\"Is he coming?\" → I asked ___.",["if he was coming","was he coming","is he coming"],0,"Aktarılan soru → if + düz cümle"]],
  life:{s:[["I have no idea what we should cook tonight.","Bu akşam ne pişireceğimize dair hiçbir fikrim yok."],["Do you know if the library is open on Sunday?","Kütüphanenin pazar açık olup olmadığını biliyor musun?"]],q:"Merak ettiğin bir şeyi yaz (I wonder … / I don't know …).",st:"I wonder if"}},
 {id:"b2-if",lv:3,t:"If 3, karışık if ve wish",why:"Geçmişteki hayali durumlar ve pişmanlıklar için kullanılır: \"Erken kalksaydım otobüsü kaçırmazdım.\" Sınavda zaman uyumu sorulur: geçmiş için had V3 + would have V3.",
  f:["If 3 (geçmiş, olmadı): If + had V3, would / could have V3","Karışık: If + had V3 (geçmiş), would + fiil (şimdi)","wish + past simple → şimdi için keşke · wish + had V3 → geçmiş için keşke","unless = if … not · provided (that) = şartıyla","Had I known = If I had known"],
  ex:[["If I had left earlier, I wouldn't have missed the bus.","Daha erken çıksaydım otobüsü kaçırmazdım."],["If I had studied medicine, I would be a doctor now.","Tıp okusaydım şimdi doktor olurdum."],["I wish I had more free time.","Keşke daha çok boş vaktim olsa."],["I wish I hadn't said that.","Keşke bunu söylemeseydim."]],
  trap:[["If I would have known, I would have come.","If I had known, I would have come.","if'li kısımda would yok"],["I wish I have a car.","I wish I had a car.","wish + past"]],
  q:[["c","If she ___ harder, she would have passed.",["studied","had studied","has studied"],1,"If 3 → had V3"],["c","If I had taken the job, I ___ in London now.",["would live","would have lived","lived"],0,"Karışık: şimdi → would + fiil"],["c","I wish I ___ to the party last night.",["went","had gone","would go"],1,"Geçmiş keşke → had V3"],["w","You won't pass ___ you study. (-mezsen)",["unless"],"unless = if … not"],["c","\"Had I known about the meeting, I would have come.\" Anlamı:",["Toplantıyı biliyordum ve geldim.","Toplantıdan haberim olsaydı gelirdim.","Toplantıya gelecektim."],1,"Had I known = If I had known"]],
  life:{s:[["If I had checked the weather, I would have taken an umbrella.","Havaya baksaydım şemsiye alırdım."],["I wish I could speak English fluently.","Keşke akıcı İngilizce konuşabilsem."]],q:"Bir pişmanlığını ya da \"keşke\"ni yaz.",st:"I wish I"}},
 {id:"b2-modal",lv:3,t:"Perfect modals: must have / should have / could have",why:"Geçmiş hakkında tahmin, eleştiri ve ihtimal bildirir. \"Kesin unutmuştur\" = He must have forgotten. Restatement sorularının favorisidir.",
  f:["must have V3 → kesin öyle olmuştur (güçlü tahmin)","can't / couldn't have V3 → olmuş olamaz","may / might / could have V3 → olmuş olabilir","should have V3 → yapmalıydın (ama yapmadın)","needn't have V3 → gerek yoktu ama yaptın"],
  ex:[["She isn't answering. She must have fallen asleep.","Cevap vermiyor. Kesin uyuyakalmıştır."],["He can't have finished already!","Bitirmiş olamaz!"],["You should have told me earlier.","Bana daha önce söylemeliydin."],["I might have left my wallet in the car.","Cüzdanımı arabada bırakmış olabilirim."]],
  trap:[["He must forgot.","He must have forgotten.","must + have + V3"],["You should told me.","You should have told me.","should + have + V3"]],
  q:[["c","The streets are wet. It ___ last night.",["must rain","must have rained","should have rained"],1,"Güçlü tahmin (geçmiş) → must have V3"],["c","You failed. You ___ more.",["should have studied","must have studied","can't have studied"],0,"Eleştiri → should have V3"],["c","She ___ the email; she was offline all day.",["must have read","can't have read","should have read"],1,"İmkânsız → can't have V3"],["w","I'm not sure, but I ___ have left my phone at school. (olabilir)",["might","may","could"],"İhtimal → might / may / could have"],["c","\"I'm sure he forgot the meeting.\" En yakın anlam:",["He should have forgotten the meeting.","He must have forgotten the meeting.","He might forget the meeting."],1,"I'm sure = must have"]],
  life:{s:[["I can't find my keys. I must have left them at work.","Anahtarlarımı bulamıyorum. Kesin işte bırakmışımdır."],["I should have gone to bed earlier.","Daha erken yatmalıydım."]],q:"Dün yapman gerekip de yapmadığın bir şey var mı?",st:"Yesterday I should have"}},
 {id:"b2-ger",lv:3,t:"Gerund mi infinitive mi?",why:"Bazı fiillerden sonra -ing, bazılarından sonra to + fiil gelir. Ezberlenecek kısa listeler var ve sınav bunları sever. Edatlardan sonra (in, of, about, without) her zaman -ing gelir.",
  f:["-ing alanlar: enjoy · avoid · finish · mind · consider · suggest · keep · deny","to alanlar: want · decide · hope · plan · agree · refuse · manage · afford","Edat + -ing: interested in learning · good at drawing · without asking","Anlamı değişenler: stop doing (bırakmak) / stop to do (yapmak için durmak) · remember doing / remember to do"],
  ex:[["I enjoy drawing in cafés.","Kafelerde çizim yapmayı severim."],["She decided to study abroad.","Yurtdışında okumaya karar verdi."],["He left without saying goodbye.","Hoşça kal demeden gitti."],["I stopped smoking. / I stopped to buy water.","Sigarayı bıraktım. / Su almak için durdum."]],
  trap:[["I enjoy to read.","I enjoy reading.","enjoy + -ing"],["I'm interested in learn English.","I'm interested in learning English.","Edat + -ing"]],
  q:[["c","I can't afford ___ a new laptop.",["buying","to buy"],1,"afford + to"],["c","Would you mind ___ the window?",["closing","to close"],0,"mind + -ing"],["c","She's good at ___ people's names.",["remember","remembering","to remember"],1,"Edat + -ing"],["w","We agreed ___ at 8. (meet)",["to meet"],"agree + to"],["c","\"Remember to lock the door\" ne demek?",["Kapıyı kilitlediğini hatırla.","Kapıyı kilitlemeyi unutma."],1,"remember to do = yapmayı unutmamak"],["c","He suggested ___ a taxi.",["taking","to take"],0,"suggest + -ing"]],
  life:{s:[["I avoid drinking coffee after 6 pm.","Akşam 6'dan sonra kahve içmekten kaçınırım."],["I've decided to learn English properly this year.","Bu yıl İngilizceyi düzgünce öğrenmeye karar verdim."]],q:"Yapmaktan keyif aldığın ve yapmaya karar verdiğin şeyleri yaz.",st:"I enjoy"}},
 {id:"b2-comp",lv:3,t:"İleri karşılaştırma: as … as, the more … the more",why:"\"… kadar\", \"ne kadar … o kadar\" ve \"çok daha\" gibi ifadeler. Okuma ve restatement sorularında anlamı doğru yakalamak için önemli.",
  f:["as + sıfat + as → kadar · not as … as → kadar değil","twice / three times as … as → iki / üç kat","much / far / a lot + -er → çok daha","The + -er …, the + -er … → ne kadar …, o kadar …","the same as · similar to · different from"],
  ex:[["This chair is as comfortable as that one.","Bu sandalye şunun kadar rahat."],["The new model is far lighter than the old one.","Yeni model eskisinden çok daha hafif."],["The more you practise, the easier it gets.","Ne kadar çok pratik yaparsan o kadar kolaylaşır."],["Rent here is twice as expensive as in my hometown.","Burada kira memleketimdekinin iki katı."]],
  trap:[["more better","much better","better zaten karşılaştırma; much ile güçlendir"],["The more you practise, more you learn.","The more you practise, the more you learn.","İki tarafta da the"]],
  q:[["c","My new phone is ___ than my old one.",["very faster","much faster","more fast"],1,"Çok daha → much + -er"],["c","The ___ you sleep, the more tired you feel.",["less","least","fewer"],0,"The less …, the more …"],["c","This exam wasn't ___ difficult as the last one.",["so","more","than"],0,"not so / as … as"],["w","The sooner we start, the ___ we finish. (early)",["earlier"],"The + -er, the + -er"],["c","\"Ali is taller than Can.\" En yakın anlam:",["Can is not as tall as Ali.","Can is as tall as Ali.","Ali is not as tall as Can."],0,"not as … as"]],
  life:{s:[["Online shopping is much faster than going to the mall.","İnternetten alışveriş AVM'ye gitmekten çok daha hızlı."],["The more I listen to English, the more I understand.","İngilizce ne kadar çok dinlersem o kadar çok anlıyorum."]],q:"İki şeyi karşılaştır ya da \"ne kadar … o kadar\" cümlesi kur.",st:"The more I"}},
 {id:"c1-inv",lv:4,t:"Inversion: Never have I …, Not only …",why:"Bu konu hedefinin bir üstü: resmi ve vurgulu İngilizce. Cümle olumsuz bir zarfla başlarsa soru düzeni gelir: \"Never have I seen …\" Okumada tanıman yeter. Essay'de bir kez kullanırsan çok etkileyici olur.",
  f:["Never / Rarely / Seldom + yardımcı fiil + özne + fiil","Not only + yardımcı + özne …, but (also) …","No sooner had + özne + V3 … than … · Hardly had … when …","Only after / Only when + cümle, yardımcı + özne + fiil"],
  ex:[["Never have I seen such a beautiful building.","Hiç bu kadar güzel bir bina görmedim."],["Not only is it cheap, but it is also durable.","Sadece ucuz değil, aynı zamanda dayanıklı."],["No sooner had I arrived than it started to rain.","Varır varmaz yağmur başladı."],["Only when I moved abroad did I understand my parents.","Ailemi ancak yurtdışına taşınınca anladım."]],
  trap:[["Never I have seen …","Never have I seen …","Olumsuz zarf başta → yardımcı fiil önce"],["Not only it is cheap …","Not only is it cheap …","Soru düzeni"]],
  q:[["c","Rarely ___ such a talented student.",["I have met","have I met","I met"],1,"Rarely + yardımcı + özne"],["c","Not only ___ late, but he also forgot the documents.",["he arrived","did he arrive","he did arrive"],1,"Not only + did + özne + fiil"],["c","No sooner had she left ___ the phone rang.",["when","than","that"],1,"No sooner … than"],["c","\"I have never felt so tired.\" En yakın:",["Never have I felt so tired.","Never I have felt so tired.","I felt never so tired."],0,"Never + have + I"],["w","Hardly ___ I sat down when the bell rang.",["had"],"Hardly had … when"]],
  life:{s:[["Never have I eaten such good baklava!","Hiç bu kadar güzel baklava yemedim!"],["Not only is my flat small, but it's also noisy.","Dairem sadece küçük değil, aynı zamanda gürültülü."]],q:"Seni en çok etkileyen bir deneyimi Never have I … ile yaz.",st:"Never have I"}},
 {id:"c1-cleft",lv:4,t:"Vurgu cümleleri: It is … that / What … is",why:"Bir bilgiyi öne çıkarmak için kullanılır: \"Asıl ihtiyacım olan şey uyku\" = What I need is sleep. Essay'de, sunumda ve mülakatta güçlü ve doğal durur.",
  f:["It is / was + vurgulanan + that / who …","What + özne + fiil + is / was + …","The reason / thing / place … is …","All I want is …"],
  ex:[["It was my teacher who encouraged me.","Beni cesaretlendiren öğretmenimdi."],["What I need is a long holiday.","İhtiyacım olan şey uzun bir tatil."],["The reason I study English is my career.","İngilizce çalışmamın sebebi kariyerim."],["All I want is a quiet place to work.","Tek istediğim çalışacak sessiz bir yer."]],
  trap:[["What I need it is sleep.","What I need is sleep.","Fazladan it yok"],["It was in 2020 when I graduated.","It was in 2020 that I graduated.","Vurgu kalıbında that"]],
  q:[["c","___ I like about this city is the food.",["What","That","Which"],0,"What … is"],["c","It was Ece ___ found the solution.",["which","who","what"],1,"Kişi → who / that"],["c","\"I need time, not money.\" Vurgulu hali:",["What I need is time, not money.","It is money what I need.","Time is what need I."],0,"What I need is …"],["w","It was in Paris ___ I first saw the painting.",["that"],"It was … that"],["o","all / I / want / is / sleep","All I want is sleep","All I want is …"]],
  life:{s:[["What I love about weekends is sleeping late.","Hafta sonlarında sevdiğim şey geç uyumak."],["What I can offer your team is a fresh perspective.","Ekibinize sunabileceğim şey taze bir bakış açısı. (mülakat)"]],q:"Kendini bir mülakatta anlatır gibi What I … is … ile yaz.",st:"What I love about design is"}},
 {id:"c1-link",lv:4,t:"İleri bağlantılar: whereas, provided that, so as to",why:"C1 metinlerinde ve iyi bir essay'de cümleler daha ince bağlanır. Karşılaştırma için whereas, şart için provided that ve as long as, amaç için so as to, zıtlık için even so ve nonetheless kullanılır.",
  f:["Karşılaştırma: whereas · while → A …, whereas B …","Şart: provided (that) · as long as · on condition that","Amaç: so as (not) to · in order (not) to + fiil","Zıtlık: nonetheless · even so · in spite of the fact that + cümle"],
  ex:[["My brother loves cities, whereas I prefer the countryside.","Erkek kardeşim şehirleri sever, bense kırsalı tercih ederim."],["You can borrow my car provided that you drive carefully.","Dikkatli sürmen şartıyla arabamı ödünç alabilirsin."],["I left early so as not to miss the train.","Treni kaçırmamak için erken çıktım."],["The plan is risky. Even so, we should try.","Plan riskli. Yine de denemeliyiz."]],
  trap:[["so as not miss","so as not to miss","so as (not) to + fiil"],["in spite of it was cold","in spite of the fact that it was cold","Cümle için \"the fact that\" ekle"]],
  q:[["c","I'll help you ___ you help me later.",["whereas","provided that","so as to"],1,"Şart → provided that"],["c","Some people love winter, ___ others hate it.",["whereas","so as","provided"],0,"Karşılaştırma → whereas"],["c","She whispered ___ wake the baby.",["so as not to","so that not","in order not"],0,"so as not to + fiil"],["w","You can stay as ___ as you keep quiet.",["long"],"as long as = -dığı sürece"],["c","The test was hard. ___, I passed.",["Whereas","Even so","Provided"],1,"Zıtlık → Even so"]],
  life:{s:[["I'm a morning person, whereas my roommate stays up all night.","Ben sabah insanıyım, ev arkadaşım ise bütün gece uyumaz."],["You can use my notes as long as you give them back.","Geri vermen şartıyla notlarımı kullanabilirsin."]],q:"Kendini biriyle whereas kullanarak karşılaştır.",st:"I usually"}},
 {id:"c1-pp",lv:4,t:"Participle clauses: Having …, Not knowing …",why:"Hedefin üstünde bir yazma tekniği: iki cümleyi tek ve akıcı bir cümleye çevirir. \"Ne yapacağımı bilmediğim için …\" = Not knowing what to do, … Okumada tanıman, yazarken ara sıra kullanman yeter.",
  f:["V-ing …, ana cümle → aynı anda / sebep: Feeling tired, I went to bed.","Having + V3 … → önce olan: Having finished, she left.","Not + V-ing → olumsuz sebep: Not knowing the way, we got lost.","V3 … → edilgen anlam: Built in 1900, the house is very old."],
  ex:[["Feeling hungry, I made a sandwich.","Acıktığım için bir sandviç yaptım."],["Having finished the exam, she went home.","Sınavı bitirince eve gitti."],["Not knowing anyone, I felt lonely at the party.","Kimseyi tanımadığım için partide yalnız hissettim."],["Designed by Gaudí, the church attracts millions.","Gaudí'nin tasarladığı kilise milyonlarca kişiyi çekiyor."]],
  trap:[["Walking in the park, a dog bit me.","Walking in the park, I was bitten by a dog.","Kısa kısmın öznesi ana cümlenin öznesiyle aynı olmalı"],["Don't knowing …","Not knowing …","Olumsuz → Not + V-ing"]],
  q:[["c","___ the instructions, he couldn't use the machine.",["Not understanding","Don't understand","Not understood"],0,"Olumsuz sebep → Not + V-ing"],["c","___ her homework, she watched TV.",["Finished","Having finished","Have finished"],1,"Önce olan → Having V3"],["c","___ in 1890, the bridge is still in use.",["Building","Built","Having built"],1,"Edilgen → V3"],["w","___ tired, I decided to stay at home. (feel)",["feeling"],"Sebep → V-ing"],["c","\"Because I didn't have money, I walked home.\" Kısa hali:",["Not having money, I walked home.","Having not money, I walked home.","Didn't having money, I walked home."],0,"Not having …"]],
  life:{s:[["Feeling stressed, I went for a long walk.","Stresli hissettiğim için uzun bir yürüyüşe çıktım."],["Having finished my project, I finally slept for ten hours.","Projemi bitirince sonunda on saat uyudum."]],q:"Bugün bir duyguyla yaptığın bir şeyi Feeling … ile yaz.",st:"Feeling"}}
];

function ev(type, a, b){ if(!S) return; const E = S.ev = S.ev || [], now = Math.round(Date.now()/1000), last = E[E.length-1];
  if(type==="v" && last && last[1]==="v" && last[2]===a && now-last[0]<60) return;
  E.push(b==null ? [now, type, a==null ? "" : a] : [now, type, a==null ? "" : a, b]); if(E.length>3000) E.splice(0, E.length-3000); }
function logAdd(k, n){ const t = today(); S.log = S.log || {}; const o = S.log[t] = S.log[t] || {}; o[k] = (o[k]||0) + (n==null?1:n); }
const nrm = s => String(s).toLowerCase().replace(/[’`]/g,"'").replace(/[.?!,;:"]/g,"").replace(/\s+/g," ").trim();
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
const blank = s => esc(s).replace("___", '<span class="blank">___</span>');

}

function mediaPick(list, store, startAt){
  // start at the listening level, then move on when a series is finished
  let i = Math.min(list.length-1, Math.max(0, startAt));
  while(i < list.length-1 && list[i].eps && (store[list[i].id]||0) >= list[i].eps*(list[i].half?2:1)) i++;
  return list[i];
}

function readFor(slot){

    };

    if(s.item && !s.done) s.done = stepGet(k) || !!(g.done[s.item.k] && g.done[s.item.k].d===today());

// Tick / untick a step by hand or when it finishes. Book steps also tick the game table (XP); media steps move to the next episode.
function markStep(k, v){
  const d = fd(), st = todaySteps(), s = st.find(x=>x.k===k), f = SFLAG[k], g = game();
  if(f) d[f] = !!v;
  ev("st", k, v ? 1 : 0);
  if(k==="scene") d.cards = !!v;   // legacy "studied today" flag: week dots, study days, XP keep working
  // steps done outside the app (series, listening, Claude chat, book pages) count toward study hours when ticked
  if(s && s.min && (["series","listen","chat","fun"].includes(k) || s.item)){ d.xm = d.xm || {};
    if(v && !d.xm[k]){ d.xm[k] = s.min; logAdd("ext", s.min); } else if(!v && d.xm[k]){ logAdd("ext", -d.xm[k]); delete d.xm[k]; } }
  if(!f){ d.st = d.st || {}; if(v){ d.st[k] = s && s.media && v===true ? {id:s.media[1], c:s.media[2]} : v; } else delete d.st[k]; }
  if(s && s.media){ const [store, id, c] = s.media, m = media()[store]; if(v===true) m[id] = Math.max(m[id]||0, c); else if(!v && (m[id]||0)===c) m[id] = c-1; }
  if(s && s.item){ const x = s.item; if(v===true && !g.done[x.k]){ g.done[x.k] = {d:today(), xp:x.xp, l:x.l}; toast(`+${x.xp} XP ✨`); lvCheck(); }
    if(!v && g.done[x.k] && g.done[x.k].d===today()) delete g.done[x.k]; }
  if(s && s.rid && s.rid[0]==="s" && v){ S.readDone = S.readDone || {}; S.readDone[s.rid] = today(); }
  save();
}
// Called when any daily step finishes, from anywhere in the app (not only inside the guided flow):
// marks it done and moves on to the next step, so the user never has to find the next page alone.
function flowNext(m, k, how){
  const s0 = todaySteps().find(s=>s.k===k); if(!s0) return false;
  const wasDone = s0.done;
  if(!wasDone) markStep(k, how || true);
  if(wasDone && !flowOn()) return false;          // extra practice after the step was already done: normal end screen
  return advance(m, k);
}
function advance(m, k){
  const st = todaySteps(), nx = st.find(s=>!s.done), cur = st.find(s=>s.k===k);
  const nb = document.getElementById("nextbar"); if(nb) nb.remove();

    <div class="card" style="text-align:left">${blkChange ? `<div class="tag acc" style="margin-bottom:6px">${esc(BLK[nx.blk])}</div>` : ""}<div class="tiny">SIRADAKİ · ${nx.min} DK</div><h3 style="margin:4px 0">${nx.ic} ${esc(nx.n)}</h3><div class="small muted">${esc(nx.d)}</div>

    <button class="btn ghost block" data-pause style="margin-top:6px">Mola ver, sonra devam ederim</button></div>`;

  FT = setTimeout(go, 2700);
  m.onclick = e=>{ if(e.target.closest("[data-go]")) go(); if(e.target.closest("[data-pause]")){ clearTimeout(FT); setFlow(false); location.hash = "#bugun"; } };
  return true;
}
/* A step that happens outside the app (or needs instructions): what, where, how, then "Bitti". */
let BT = null;
function vStep(m, k){
  const st = todaySteps(), i = st.findIndex(s=>s.k===k), s = st[i];
  if(!s){ location.hash = "#bugun"; return; }

    ${s.how ? `<div class="card"><div class="tiny">NASIL YAPACAKSIN</div><ol class="small" style="margin:6px 0 0;padding-left:20px;line-height:1.6">${s.how.map(h=>`<li>${h}</li>`).join("")}</ol></div>` : ""}

    ${s.alt ? `<p class="small muted">${esc(s.alt)}</p>` : ""}
    ${s.item ? proofHTML(k) : ""}
    <button class="btn primary block" data-sdone style="margin-top:14px">${s.brk ? "Molayı bitir, devam et →" : s.done ? "✓ Yapıldı · sıradakine geç →" : "Bitti ✓ · sıradakine geç"}</button>
    ${s.done || s.brk ? "" : `<p class="tiny" style="text-align:center;margin-top:8px"><a href="#" data-sskip style="color:inherit">Bugün bunu atla (sorun değil)</a></p>`}`;
  if(s.brk){ const end = Date.now() + s.brk*60000; clearInterval(BT);
    BT = setInterval(()=>{ const el = document.getElementById("brkT"); if(!el){ clearInterval(BT); return; } const r = Math.max(0, end-Date.now());
      el.textContent = Math.floor(r/60000) + ":" + String(Math.floor(r/1000)%60).padStart(2,"0"); if(!r){ clearInterval(BT); flowNext(m, k); } }, 1000); }
  if(s.item) proofBind(m, k, ()=>s.item.l, ()=>{ if(!stepGet(k) && !s.done) markStep(k, true); }, ()=>vStep(m, k));
